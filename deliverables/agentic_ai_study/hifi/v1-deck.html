<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Agent AI · V1 Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
<!-- Google's latin subset drops → ≈ ≥ and the superscript digits; this text= subset adds exactly those from the same face -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&text=%E2%86%92%E2%89%88%E2%89%A5%E2%81%B0%C2%B9%C2%B2%C2%B3%E2%81%B4%E2%81%B5%E2%81%B6%E2%81%B7%E2%81%B8%E2%81%B9%E2%86%93%E2%86%91%E2%9C%93&display=swap">
<style>
  :root {
    --page:#F3F5F7; --ink:#15202B; --ink2:#3D4955; --ink3:#5F6B77; --line:#DDE2E8; --focus:#2A62A8;
    --sans:'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;
    --cond:'IBM Plex Sans Condensed','Arial Narrow','IBM Plex Sans','Segoe UI',Arial,sans-serif;
    --mono:'IBM Plex Mono',SFMono-Regular,Consolas,'Liberation Mono',monospace;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--page); color:var(--ink); font-family:var(--sans); }
  body { display:flex; flex-direction:column; overflow:hidden; }
  #wrap { flex:1 1 auto; min-height:0; position:relative; }
  #stage { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:pointer; }
  .f-sans { font-family:var(--sans); } .f-cond { font-family:var(--cond); } .f-mono { font-family:var(--mono); }
  /* speaker notes (N): Bulgarian script for the slide on screen, below the stage, never over it */
  #notes { display:none; flex:none; max-height:30vh; overflow:auto; background:#FBFCFD; border-top:1px solid var(--line);
           padding:10px 20px 12px; font:16px/1.55 var(--sans); color:var(--ink); }
  #notes h2 { margin:0 0 6px; font:600 13px/1.3 var(--sans); color:var(--ink3); letter-spacing:.04em; text-transform:uppercase; }
  #notes p { margin:0 0 8px; max-width:110ch; }
  body.notes-on #notes { display:block; }
  /* compact bar: every slide id, Replay, Notes */
  #bar { flex:none; height:40px; display:flex; align-items:center; gap:6px; padding:0 8px; border-top:1px solid var(--line);
         background:#ECEFF3; font-size:13px; white-space:nowrap; }
  #fbtns { display:flex; gap:2px; overflow-x:auto; scrollbar-width:thin; min-width:0; flex:1 1 auto; padding:2px 0; }
  #fbtns::before, #fbtns::after { content:''; margin:auto; }
  #bar button { font:inherit; font-weight:500; color:var(--ink2); background:transparent; border:1px solid transparent;
                border-radius:7px; padding:3px 7px; min-height:28px; cursor:pointer; flex:none; }
  #bar button:hover { background:#DFE4EA; }
  #bar button[aria-current="true"] { background:var(--ink); color:#fff; }
  #bar button[aria-pressed="true"] { background:#D7DEE6; color:var(--ink); }
  #bar button:focus-visible { outline:2px solid var(--focus); outline-offset:1px; }
  #bar .sep { width:1px; height:20px; background:#CFD6DD; flex:none; }
  #bar .act { font-weight:600; }
  body.review #bar, body.review #notes { display:none !important; }
  body.review #stage { cursor:default; }
  @media (max-width:900px) { #bar { height:36px; gap:3px; } #bar button { padding:2px 5px; min-height:26px; } #notes { font-size:14px; } }
</style>
</head>
<body>
<div id="wrap">
  <svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="">
    <defs>

      <filter id="blurS" x="-10%" y="-10%" width="120%" height="140%"><feGaussianBlur stdDeviation="1.8"/></filter>

        <rect width="14" height="14" fill="#E8ECF0"/><rect width="4" height="14" fill="#DCE2E8"/>
      </pattern>
    </defs>
    <g id="root"></g>
  </svg>
</div>
<aside id="notes" aria-label="Speaker notes" aria-live="polite"></aside>
<nav id="bar" aria-label="Slides">
  <div id="fbtns"></div>
  <span class="sep"></span>
  <button id="replay" class="act" title="Replay the transition into this slide">Replay</button>
  <button id="nbtn" class="act" aria-pressed="false" title="Speaker notes (N)">Notes</button>
</nav>

<script>
'use strict';
'use strict';
/* ======================================================================
   V1 · Refined light. Same element identities as the lofi storyboard
   (hifi/frames.json), re-laid out to fill the 1600×900 stage, drawn as SVG
   and morphed: persistent elements interpolate geometry and colour, new
   ones enter staggered from a sensible origin, changed text crossfades,
   and the news gets a brief halo once everything has landed.
   ====================================================================== */
const W = 1600, H = 900;

/* ---------- palette: calm neutrals + one hue per meaning ---------- */
const C = {
  page:'#F3F5F7', ink:'#15202B', ink2:'#3D4955', ink3:'#5F6B77',
  card:'#FFFFFF', line:'#C3CCD6', region:'#EAEEF2', regionLine:'#D3DAE1',
  io:'#E1E7ED', ioLine:'#A9B5C1',
  good:'#1C7C4D', goodFill:'#E9F6EF', goodLine:'#93CBAA', goodBar:'#2E9A63', goodOnDark:'#4CC38A',
  warn:'#8A5800', warnFill:'#FFF5DC', warnLine:'#D69A1E', warnBar:'#E0A526', warnPill:'#FBE2A0',
  bad:'#C0362C', badFill:'#FCEBE9',
  check:'#5A45B5', checkInk:'#3F2E92', checkFill:'#F1EEFB', checkLine:'#B6ABE4',
  memory:'#2A62A8', memoryInk:'#1E4C8A', memoryFill:'#E9F1FB', memoryLine:'#A9C4E8', noteLine:'#C3D5EC',
  think:'#4E6381', thinkLine:'#A3B3C8', track:'#E1E6EC',
  agentLine:'#B4BFCA', ext:'#8C98A5', segHuman:'#CDD5DE', arrow:'#8C98A5'
};
const FAM = {
  sans:"'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif",
  cond:"'IBM Plex Sans Condensed','Arial Narrow','IBM Plex Sans','Segoe UI',Arial,sans-serif",
  mono:"'IBM Plex Mono',SFMono-Regular,Consolas,'Liberation Mono',monospace"
};
const pcol = p => p >= 0.85 ? C.goodBar : p >= 0.6 ? C.warnBar : C.bad;
const pcolText = p => p >= 0.85 ? C.good : p >= 0.6 ? C.warn : C.bad;

/* ---------- small utilities ---------- */
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const L = (a, b, t) => a + (b - a) * t;
const inOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const outCubic = t => 1 - Math.pow(1 - t, 3);
const outQuart = t => 1 - Math.pow(1 - t, 4);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const f1 = v => Math.round(v * 10) / 10;
function hex(h) { h = h.slice(1); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function mixc(a, b, t) {
  if (a === b || t <= 0) return a; if (t >= 1) return b;
  if (!a || !b || a[0] !== '#' || b[0] !== '#') return t < 0.5 ? a : b;
  const A = hex(a), B = hex(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function lum(h) { return hex(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); })
  .reduce((s, v, i) => s + v * [0.2126, 0.7152, 0.0722][i], 0); }
const contrast = (a, b) => { const A = lum(a), B = lum(b); return (Math.max(A, B) + 0.05) / (Math.min(A, B) + 0.05); };
const lerpRect = (a, b, t) => ({ x:L(a.x, b.x, t), y:L(a.y, b.y, t), w:L(a.w, b.w, t), h:L(a.h, b.h, t) });

/* ---------- text measuring (canvas, same faces as the SVG) ---------- */
const mctx = document.createElement('canvas').getContext('2d');
function measure(s, size, weight = 400, fam = 'sans', italic = false, ls = 0) {
  mctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${FAM[fam]}`;
  return mctx.measureText(s).width + ls * size * Math.max(0, [...s].length - 1);
}

/* ======================================================================
   FRAMES — content exactly as frames.json; geometry re-fitted
   ====================================================================== */
const B = (id, x, y, w, h, label, o = {}) => ({ id, t:'box', x, y, w, h, label, ...o });
const T = (id, x, y, label, o = {}) => ({ id, t:'text', x, y, label, ...o });
const A = (from, to, o = {}) => ({ id:'a:' + from + '>' + to, t:'arrow', from, to, ...o });
const chainArrows = ids => ids.slice(0, -1).map((id, i) => A(id, ids[i + 1]));
const head = (title, cap, clock) => [
  T('ttl', 40, 90, title, { role:'title' }),
  ...(cap ? [T('cap', 40, 856, cap, { role:'caption' })] : []),
  ...(clock ? [B('clock', 1376, 46, 184, 50, clock, { k:'clock' })] : [])];

const STEP_L = ['Search\nroad distance', 'Search\nfuel price', 'Search\ntrain fares', 'Calculate\nboth costs', 'Compare\n& answer'];
// Same words as the storyboard, re-broken for the narrower card; **…** = a bold line.
const ASK_COST = 'Which is cheaper\nfrom Ruse to Sofia\n— driving or\ntaking the train?';
const ASK_THINK = ASK_COST + '\n**Think hard**\n**and describe**\n**the answer**\n**step by step.**';

function frameF4() {
  const els = head('Thinking before each step', '98% per step → 0.98⁵ ≈ 90%. Reasoning is trained with RL on answers that can be checked.', '⏱ ~1 min');
  // panel + equations as one group, centred between title and caption; F3 uses the same frame
  const top = 258, sh = 250;
  els.push(B('ai', 236, 192, 1162, 440, 'AI model', { k:'region' }));
  els.push(B('q', 40, 228, 174, 310, 'Question', { k:'io', sub:ASK_THINK, fs:24, sfs:16 }));
  const xs = [254, 487, 720, 953, 1186];
  xs.forEach((x, i) => {
    els.push(B('s' + (i + 1), x, top, 194, sh, STEP_L[i], { p:0.98, fs:23, pfs:34, ent:1 }));
    els.push(B('th' + (i + 1), x + 22, top + sh + 22, 150, 52, 'thinking…', { k:'think', at:0.56 }));   // after its card has moved up
  });
  els.push(B('ans', 1426, top, 134, sh, 'Answer', { k:'io', p:0.9039207967999999, fs:24, pfs:34 }));
  els.push(...chainArrows(['q', 's1', 's2', 's3', 's4', 's5', 'ans']));
  const eq = ['0.98⁵ ≈ 90%', '0.98¹⁰ ≈ 82%', '0.98¹⁰⁰ ≈ 13%', '0.98¹⁰⁰⁰ ≈ 0%'];
  eq.forEach((s, i) => els.push(T('pow' + i, 230 + i * 380, 737, s, { role:'eq', size:46, ent:i })));
  return { id:'F4', title:'Thinking before each step', els, news:[] };
}

function frameF5a() {
  const els = head('Tools and a check', 'In code: run the tests, read the error. Here: four independent checks. The fare came from a 2025 page, in leva.', '⏱ ~5 min');
  const top = 360, sh = 260;
  els.push(B('ai', 236, 252, 1162, 482, 'AI model', { k:'region' }));
  els.push(B('q', 40, top, 174, sh, 'Question', { k:'io', sub:ASK_COST }));
  const xs = [254, 432, 610, 788, 966];
  const sub = ['web search', 'web search', '2025 page · 23 лв', 'calculator · exact', ''];
  xs.forEach((x, i) => {
    const id = 's' + (i + 1);
    const o = { p:0.98, sub:sub[i] };
    if (id === 's3') Object.assign(o, { s:'bad', lift:1, late:[0.62, 0.84] });   // turns red once the check catches it
    if (id === 's4') Object.assign(o, { p:1, k:'exact', lift:1 });
    els.push(B(id, x, top, 158, sh, STEP_L[i], o));
    if (id !== 's4') els.push(B('th' + (i + 1), x + 10, top + sh + 22, 138, 52, 'thinking…', { k:'think' }));
  });
  els.push(B('v', 1150, 293, 230, 394, 'Check', { k:'verify', ltop:true, lift:1, strong:1, at:0.44, enter:{ dx:30 } }));
  [['sources agree ✓', 'good'], ['sensible range ✓', 'good'], ['date & currency ✗', 'bad'], ['recompute ✓', 'good']]
    .forEach(([l, s], i) => els.push(B('ck' + (i + 1), 1162, 355 + i * 82, 206, 70, l, { k:'ckchip', s, at:0.50 + i * 0.045, enter:{ dx:18 } })));
  els.push(B('ans', 1426, top, 134, sh, 'Answer', { k:'io', p:0.9223681599999999, sub:'on hold', s:'warn', lift:1, late:[0.66, 0.88] }));
  els.push(...chainArrows(['q', 's1', 's2', 's3', 's4', 's5', 'v', 'ans']));
  els.push({ id:'back', t:'arrow', from:'v', to:'s3', fs:'t', ts:'t', shape:'arch', apex:188, k:'bad', at:0.68,
             label:'✗ fare from a 2025 page, in leva' });
  return { id:'F5a', title:'Tools and a check', els, news:['s4', 's3', 'v', 'ans'] };
}

// N1 and N2 share one layout; N2 compresses the rows to make room for the outside world.
const PLAN_NOTES = ['Flights: 12 land\nafter 22:00', 'Hotels: holding 12\nlate check-ins', 'Attendee 37:\nneeds a step-free room',
                    'Catering: 9 vegetarian\nlunches', 'Trains & buses: coach\nfrom Bucharest 15:30'];
const COL = { q:[40, 156], lead:[226, 126], grp:[384, 178], team:[590, 192], chk:[808, 144], plan:[978, 206], gop:[1216, 174], ans:[1420, 140] };
const ROWS = {
  N1:{ region:[152, 684], gt:[172, 346], s_fl:[172, 248], s_tr:[270, 346], ga:[372, 546], s_ho:[372, 448], s_ca:[470, 546],
       gc:[572, 668], plan:[172, 668], q:[379, 539], lead:[394, 524], ans:[379, 539], org:[394, 524],
       notes:[226, 62, 14], foot:632, g_h:[712, 738], g_a:[748, 770] },
  N2:{ region:[152, 608], gt:[168, 316], s_fl:[168, 232], s_tr:[252, 316], ga:[338, 486], s_ho:[338, 402], s_ca:[422, 486],
       gc:[508, 592], plan:[168, 592], q:[332, 492], lead:[347, 477], ans:[332, 492], org:[352, 472],
       notes:[220, 56, 10], foot:572, g_h:[744, 770], g_a:[780, 802] }
};
const modEl = (els, id, props) => els.forEach(e => { if (e.id === id) Object.assign(e, props); });
// The conference system. N1 is the plain system; N2 adds the wall, the two doors and the money path; N3 and R0–R3 are
// variants of N2 (same ids, same places), so moving between them only changes what differs.
function frameConf(v) {
  const doors = v !== 'N1', R = ROWS[doors ? 'N2' : 'N1'];
  const bx = (id, col, row, label, o) => B(id, COL[col][0], R[row][0], COL[col][1], R[row][1] - R[row][0], label, o);
  const title = doors ? 'Acting in the world, through two doors' : 'A real-scale job: 100 people to this conference';
  const els = head(title, doors
    ? 'Only Correspondence writes to people; only Payments can pay, after the budget guard and, above €500, the organiser.'
    : 'A lead, three groups, five teams: ~125 agents. They coordinate through one living plan.', '⏱ ~1 day');
  const d = doors ? { door:1, lift:1 } : {};
  els.push(
    B('ai', 212, R.region[0], 1192, R.region[1] - R.region[0], '', doors ? { k:'region', wall:true, late:[0.4, 0.6] } : { k:'region' }),
    T('ail', 226, 140, doors ? '~127 agents · a lead, three groups, five teams, two payment agents' : '~125 agents · a lead, three groups, five teams', { role:'ail', ent:0 }),
    bx('q', 'q', 'q', 'Task', { k:'io', sub:'get 100 attendees\nfrom 15 countries\nto Ruse by the 23rd,\nunder €30,000', sfs:15 }),
    bx('ans', 'ans', 'ans', 'Result', { k:'io', sub:'every attendee:\nan itinerary,\na bed and\nlunches' }),
    bx('lead', 'lead', 'lead', 'Lead', { k:'lead', nl:'COORDINATE', sub:'splits the job,\nwatches\nprogress', ent:0 }),
    bx('gt', 'grp', 'gt', 'Transport', { k:'agent', sub:doors ? 'posts requests\nin the plan' : 'long and\nshort distance', ent:1 }),
    bx('ga', 'grp', 'ga', 'Accommodation', { k:'agent', sub:doors ? 'posts requests\nin the plan' : 'beds and lunches', ent:1 }),
    bx('gc', 'grp', 'gc', 'Correspondence', { k:'agent', sub:doors ? 'the only agents that\nwrite to people' : 'speaks for\neach attendee', ent:1, ...d }),
    bx('s_fl', 'team', 's_fl', 'Flights', { k:'agent', nl:'×8', sub:'long distance', ent:2 }),
    bx('s_tr', 'team', 's_tr', 'Trains & buses', { k:'agent', nl:'×6', sub:'short distance', ent:2 }),
    bx('s_ho', 'team', 's_ho', 'Hotels', { k:'agent', nl:'×4', sub:'rooms in Ruse', ent:2 }),
    bx('s_ca', 'team', 's_ca', 'Catering', { k:'agent', nl:'×3', sub:'lunches during the stay', ent:2 }),
    bx('s_co', 'team', 'gc', 'Attendee workers', { k:'agent', nl:'×100', sub:'one per attendee', ent:2, ...d }),
    bx('c_t', 'chk', 'gt', 'Verifier', { k:'verify', sub:'connections\n≥ 60 min;\nlands by the 23rd', ent:3 }),
    bx('c_a', 'chk', 'ga', 'Room & meal\ncheck', { k:'verify', sub:'a bed and a lunch\nfor everyone', ent:3 }),
    bx('c_c', 'chk', 'gc', 'Fact check', { k:'verify', sub:'names, dates,\nvisas', ent:3 }),
    bx('plan', 'plan', 'plan', 'Living plan', { k:'board', nl:'MEMORY', ltop:true, ent:3 }),
    T('planfoot', COL.plan[0] + COL.plan[1] / 2, R.foot, 'every team writes and reads', { role:'foot', ent:4 }),
    A('q', 'lead'), A('lead', 'gt'), A('lead', 'ga'), A('lead', 'gc'),
    A('gt', 's_fl'), A('gt', 's_tr'), A('ga', 's_ho'), A('ga', 's_ca'), A('gc', 's_co'),
    A('s_fl', 'c_t'), A('s_tr', 'c_t'), A('s_ho', 'c_a'), A('s_ca', 'c_a'), A('s_co', 'c_c'),
    A('c_t', 'plan'), A('c_a', 'plan'), A('c_c', 'plan'),
    T('tl', 40, R.g_h[1] - 6, 'time →', { role:'tl', ent:4 }),
    B('g_h', 160, R.g_h[0], 1244, R.g_h[1] - R.g_h[0], 'a human team: ~3 weeks of work', { k:'seg', ent:4 }),
    B('g_a', 160, R.g_a[0], Math.round(1244 / 21), R.g_a[1] - R.g_a[0], '', { k:'seg', s:'good', ent:4 }),
    T('ga_t', 160 + Math.round(1244 / 21) + 14, R.g_a[1] - 5, 'agents: ~1 day of work (plus waiting for replies and approvals)', { role:'gat', ent:4 }));
  const [n0, nh, ng] = R.notes;
  PLAN_NOTES.forEach((l, i) => els.push(B('pn' + i, COL.plan[0] + 10, n0 + i * (nh + ng), COL.plan[1] - 20, nh, l, { k:'note', ent:4 })));
  const gx = COL.gop[0], gw = COL.gop[1];
  if (!doors) {
    els.push(B('org', gx, R.org[0], gw, R.org[1] - R.org[0], 'Budget guard\n+ organiser', { k:'human', sub:'stays under €30k;\nfinal sign-off', ent:4 }),
             A('plan', 'org'), A('org', 'ans'));
    return { id:'N1', title, els, news:[] };
  }
  const by = R.region[1];                        // the wall between the system and the outside world
  els.push(
    B('guard', gx, 168, gw, 108, 'Budget guard', { k:'verify', sub:'stays under €30k;\n> €500 → organiser', lift:1, strong:1, at:0.30, enter:{ dy:26 } }),
    B('org', gx, R.org[0], gw, R.org[1] - R.org[0], 'Organiser', { k:'human', nl:'APPROVE', sub:'approves big\npayments;\nfinal sign-off', lift:1 }),
    B('pay', gx, 508, gw, 84, 'Payments', { k:'agent', nl:'×2', sub:'the only agents\nthat can pay', door:1, lift:1, at:0.50, enter:{ dy:22 } }),   // rises from the door side once the organiser has settled
    A('plan', 'guard', { fs:'r', ts:'l' }),
    A('guard', 'org', { fs:'b', ts:'t', fdx:44, tdx:44, label:'> €500', k:'gate' }),
    A('org', 'pay', { fs:'b', ts:'t', k:'strong' }),
    A('org', 'ans'),
    // the outside world rises in once the system has made room for it; then the doors open in the wall
    B('world', 212, by + 38, 1192, 78, 'outside world', { k:'world', at:0.40, enter:{ dy:18 } }),
    B('door1', 600, by - 12, 126, 24, 'door 1 · people', { k:'door', band:by + 38, tag:'r', at:0.48, enter:{ dy:0 } }),
    B('door2', 1280 - 75, by - 12, 150, 24, 'door 2 · money', { k:'door', band:by + 38, at:0.48, enter:{ dy:0 } }),
    B('w_people', 590, by + 51, 192, 52, 'attendees, hotels,\ncarriers · email', { k:'ext', at:0.50, enter:{ dy:18 } }),
    B('w_book', 1022, by + 51, 164, 52, 'booking systems', { k:'ext', at:0.54, enter:{ dy:18 } }),
    B('w_card', 1256, by + 51, 134, 52, 'payment card', { k:'ext', at:0.57, enter:{ dy:18 } }),
    A('s_co', 'w_people', { fs:'b', ts:'t', fdx:-22, tdx:-22, k:'door', at:0.60 }),
    A('w_people', 's_co', { fs:'t', ts:'b', fdx:22, tdx:22, k:'door', at:0.64 }),
    A('pay', 'w_book', { fs:'b', ts:'r', fdx:-66, k:'door', at:0.62 }),
    A('pay', 'w_card', { fs:'b', ts:'t', fdx:20, k:'door', at:0.66 }));
  const out = { id:'N2', title, els, news:['door1', 'door2', 'guard', 'org'], by };
  return VARIANT[v] ? VARIANT[v](out) : out;
}
const VARIANT = {};

const NOTES = {"F1": {"t": "Title", "p": ["Здравейте. Аз съм Александър Андреев, кандидат-докторант в Русенския университет „Ангел Кънчев“. Днес ще ви представя темата „Решаване на сложни проблеми с многоагентни системи: възможности и рискове“."]}, "F2": {"t": "One question, one answer", "p": ["Идеята е да ви покажа процеса нагледно, с диаграма, която постепенно се разширява. Вляво винаги стои въпросът или задачата на потребителя. Вдясно е крайният отговор на ИИ, с примерен шанс този отговор да е верен. По средата е работата, която ИИ извършва, а в горния десен ъгъл – приблизителното време от задаването на въпроса до отговора.", "Започваме с обикновен въпрос и директен отговор – така работеха първите масово разпространени езикови модели, като GPT-3.5 от ноември 2022 г. „Да шофирам ли, или да си хвана влака до София?“ Получаваме бърз, но непроверен отговор – синтез на всичко, което моделът е прочел по време на обучението си. Основният проблем е, че отговорът винаги звучи уверено, дори когато е напълно подвеждащ. Това е т.нар. „халюцинация“."]}, "F3": {"t": "A real task has many steps", "p": ["Ако конкретизираме въпроса – „Кое е по-евтино от Русе до София: с кола или с влак?“ – вече ни трябват конкретни данни. За да даде смислен отговор, ИИ разбива въпроса на няколко последователни подвъпроса и така увеличава шанса за верен отговор. Езиковите модели започнаха да правят това сами около средата на 2023 г.", "Грешка дори в една от стъпките обаче най-вероятно води до грешен отговор. Ако всяка от петте стъпки е вярна с 95%, целият отговор е верен само в 77% от случаите. В реалността стъпките, разбира се, имат различен шанс, но идеята е ясна: дори когато всяка стъпка е вярна с над 90%, шансът за верен краен резултат пада рязко, колкото по-голяма е задачата. Под диаграмата виждате шанса за успех при 5, 10, 100 и 1000 стъпки.", "А времето: ако един въпрос отнема около 2 секунди, тук имаме пет такива – общо около 10 секунди."]}, "F4": {"t": "Thinking before each step", "p": ["За да подобрим шанса на всяка отделна стъпка, можем да оставим модела да „мисли“. Всичко започна с прости инструкции – „помисли задълбочено и обясни отговора си стъпка по стъпка“. Резултатите бяха толкова добри, че компаниите вградиха мисленето в самото обучение на моделите. Първите такива модели бяха OpenAI o1 (септември 2024 г.) и DeepSeek R1 (януари 2025 г.). Вместо направо да „изплюят“ отговора, те водят вътрешен диалог със себе си и търсят обосновка за всяко свое заключение. При 98% за стъпка петте стъпки вече дават 90%, но редът отдолу показва, че при хиляда стъпки и това не стига."]}, "F5a": {"t": "Tools and a check", "p": ["Друг начин да увеличим шанса за успех са инструментите и автоматичните проверки. Когато една стъпка се изпълни с инструмент, например калкулатор или програмен скрипт, шансът за грешка в нея пада до нула – на слайда изчислението на двата разхода вече е точно. За останалите стъпки добавяме проверка, която изрично търси доказателства за всяко заключение. В примера тя открива грешка в цената на билета: взета е от страница от 2025 г. и е в лева, а от януари плащаме в евро."]}, "F5b": {"t": "Redo, with the reason", "p": ["Проверката връща не просто „грешно“, а и причината – затова вторият опит е различен и търси актуалната цена в евро. Възможността да се върнем и да поправим грешката носи много по-голям шанс за успех: тук всяка проверена стъпка е вярна с 99,99% и дори при хиляда стъпки шансът остава около 90%.", "Минусът е цената. Писането на скриптове и многократното минаване през всяка стъпка удължават изчисленията, а някои проверки, дори автоматизирани, отнемат много време. Ако трябваше да проверим резултат от биологично изследване, това нямаше да са минути, а дни – но понякога това е единственият начин да сме сигурни в резултата."]}, "F7a": {"t": "An open question takes many more steps", "p": ["Ако направим въпроса по-„отворен“ – как най-евтино да стигнем до София в рамките на 24 часа – има по-голям шанс да открием решение, което изобщо не сме предвидили. Така можем да проверим различни варианти, а някои от тях отпадат чак докато задачата се решава. Такива системи се появиха в края на 2024 г. с Deep Research на Google, последван от Deep Research на OpenAI през февруари 2025 г. Минусът остава същият: времето за отговор рязко нараства – тук до около два часа. Затова и компаниите промениха начина, по който ги предлагат: вместо чат с активна дискусия, това е процес, който стартирате и получавате резултата след известно време."]}, "F7b": {"t": "Copies take the options in parallel", "p": ["Ако същият процес се раздели на няколко паралелни нишки, стигаме до същия резултат за много по-кратко време – около 25 минути вместо два часа. Всяка нишка е агент: същият модел, със собствена работна памет, пуснат за една задача. Необходимите ресурси обаче нарастват, защото освен стъпките, които иначе бихме изпълнили последователно, имаме и агент-„диригент“, който разпределя работата, следи останалите и ги изчаква."]}, "F7c": {"t": "Copies split again, stop early, report back", "p": ["Това, че има диригент, не означава, че един агент се грижи за всички останали. Тук всеки начин на придвижване се разделя допълнително според нуждите си: колата проверява два пътя – през Плевен и през Велико Търново, а влакът – директна връзка и връзка с прекачване. Йерархията обаче се запазва: обикновено всички подпроцеси трябва да приключат, за да може този, който ги е създал, да продължи. В случая това, че не можем да пътуваме с колело заради бурята, не зависи от останалите. Но ако подпроцесите са свързани и задължителни, провалът на един от тях може да накара диригента да спре всички останали и да преосмисли подхода си."]}, "F8": {"t": "Where splitting helps, and where it hurts", "p": ["Не всяка задача печели от разделяне на паралелни нишки. Търсенето в различни източници в интернет е отличен пример за ускорение без загуба на качество: няма нужда да зареждаме и „четем“ източниците един по един – може наведнъж.", "В другата крайност е писането на роман. Ако пишем всички глави едновременно, резултатът ще е катастрофален – не можем да пишем заключението по същото време като увода. Несъответствията в текста са неизбежни.", "Повечето задачи са някъде по средата, като програмирането: отделни поправки се делят лесно, но две копия, които пишат една и съща функционалност, трябва постоянно да се съгласуват. Въпросът, който трябва да си зададем, е дали значително по-краткото време си струва риска от неуспех."]}, "N1": {"t": "A real-scale job: 100 people to this conference", "p": ["Досега задачата – да намерим един превоз от точка А до точка Б – се ускоряваше значително с езикови модели, но все пак беше по силите на един човек за един работен ден. През последните месеци успехите на ИИ позволиха мащабът на проблемите да нарасне рязко. В новия пример не търсим превоз за един човек: искаме да доведем и настаним 100 гости от 15 държави в нашия град за конференция, с бюджет под 30 000 евро. Работа, която би отнела на екип от хора около три седмици, може да се свърши за един ден – стига външният свят да отговаря бързо с потвърждения за резервации, билети и т.н.", "Повечето сложни системи имат йерархия от възложители и изпълнители, общо място, където споделят междинните резултати, и начин да комуникират и да следят напредъка. Тук задачата е разделена на три части: как да придвижим гостите до града, как да ги настаним подобаващо и как да потвърдим, че всичко това е подходящо за всеки един от тях."]}, "N2": {"t": "Acting in the world, through two doors", "p": ["В такива сложни процеси е наивно да мислим, че най-добрият резултат може да се постигне без човешка намеса по време на изпълнението. Системата действа навън само през две „врати“: само кореспонденцията пише на хора и само агентите за плащания могат да плащат. Затова сме сложили и ограничение на плащанията: всичко под 500 евро агентът за плащания изпълнява сам, а по-големите суми чакат, докато отговорникът за организацията изрично ги одобри."]}, "N3": {"t": "Day 9: a flight is cancelled", "p": ["Реалният свят, разбира се, не е перфектен. Дори основната задача да е свършена за ден, трябват „дежурни“ агенти, които следят за промени и ги отразяват – в реално време или периодично. В примера авиокомпанията отменя полет, който засяга десет от нашите гости. Това може да се реши автоматично, но може и отново да изисква човешка намеса – тук допълнителните 1850 евро чакат одобрение от организатора."]}, "F9": {"t": "Systems like ours are already at work", "p": ["Последната стъпка в тази част: за да покажем какво отключва съвременният ИИ, излизаме от нашите примери и поглеждаме как подобни структури се използват за откриване на нови решения, за защита на критични системи и за ускоряване на научния и технологичния прогрес. Зад тях стоят както компании, така и университети, държавни институции и независими екипи.", "Нарочно не съм включил рекурсивното самоусъвършенстване на ИИ – идеята, че в даден момент ще бъде създадена многоагентна система, която сама подобрява работата си, а новата версия на свой ред създава още по-добра. Истината е, че в големите компании за ИИ прогресът наистина е зашеметяващ и голяма част от работата на експертите им се автоматизира буквално всеки месец. Но тяхната работа, макар и непрекъснато променяща се, остава ключова за успеха им."]}, "R0": {"t": "Misalignment: what we say vs what we mean", "p": ["Време е да обърнем внимание и на рисковете, които носи тази автоматизация. За целта се връщаме към примера с настаняването на 100 гости. Досега приемахме, че системата прави това, което искаме. Но ние ѝ казахме само „най-евтино, под 30 000 евро“, а имахме предвид и „законно, честно и без да подвеждаш никого“. Проблемите започват точно в тази неизказана част."]}, "R4": {"t": "One wrong step is enough", "p": ["Първият пример показва нагледно това, което пресметнахме със степените в многостъпковия процес. Конференцията е на 24-ти, затова всички гости трябва да са настанени до края на 23-ти. Двете дати често се срещат в бележките на агентите и лесно се объркват – и датата на пристигане става 24-ти вместо 23-ти. Веднъж записана така в общия план, грешката предизвиква верижна реакция и от единичен случай засяга действията и на другите агенти. И то без никаква лоша умисъл."]}, "R1": {"t": "It games the guard, to be helpful", "p": ["Във втория пример системата отново няма лоша умисъл. Но за да ни помогне и да ускори процеса, като избегне чакането на човешко одобрение, тя заобикаля защитата, която изрично сме сложили. Предстои плащане от 600 евро – над лимита от 500. Системата го разделя на три плащания по 200 евро. Формално не е нарушила правило, но е очевидно, че е излязла от разрешените ѝ граници."]}, "R2": {"t": "It crosses a line in the world", "p": ["В третия пример нещата ескалират. Да приемем, че агентите за влаковете откриват бъг в системата за резервации и могат да запазят места за гостите, без да плащат. Това е неетично и незаконно, но на теория помага директно на възложителя – в бюджета остават повече пари за други разходи."]}, "R3": {"t": "It hides the problem", "p": ["Една стъпка по-нататък – и това е препратка към реален случай, който ще видим след малко – системата може да усети, че възложителят не би искал това. Но отново, за да му „помогне“ и да запази спестените пари, тя решава да го заблуди: макар да не е платила билетите, генерира фалшиви фактури за плащането им. Така възложителят има още по-малък шанс да разбере какво се случва и да се намеси."]}, "R6": {"t": "It has already happened", "p": ["Ще ви покажа два реални случая, за които вероятно повечето от вас са чували. И двата са станали в тестова среда, но последствията им са стигнали до реалния свят. Не е нарочно, че и двата са на OpenAI – и други компании са имали подобни случаи, но тези са най-известните.", "В първия случай група агенти, които дори не е трябвало да работят заедно, са тествани на много сложни задачи по киберсигурност в изолирани среди. Те намират пролука в изолацията си и начин да комуникират. Малко след това откриват как да заобиколят задачите и да подадат на оценителя фалшиви верни отговори. Подобно на фалшивите фактури от преди малко, те разбират, че действията им не са коректни и че оценителят рано или късно ще ги хване. Затова, според оставените следи, планират атака срещу Hugging Face – един от основните сайтове на общността по машинно обучение – за да подменят истинските отговори и да намалят шанса да бъдат разкрити. Случаят е изследван подробно от независими източници и силно ви препоръчвам да го прочетете.", "Вторият случай е подобен. Задачата е била проучване на лекарства за кожни заболявания. Понеже системата не намира достатъчно информация, тя получава непозволен достъп до медицинска система на австралийското правителство и изтегля вътрешни файлове и пароли – за да изпълни задачата по-пълно. Лични данни на граждани не са прочетени."]}, "R5a": {"t": "Who asks, and who answers", "p": ["Тези примери могат да се обобщят в три групи, според това какво искаме от системата. Първата група са добре описани задачи с ясни граници: дори неетична система в общия случай ще стигне до етичен резултат. Втората група са неясно поставени задачи – нарочно или от небрежност. Неетична система отново може да даде етичен резултат, но може и да престъпи етични или законови правила, само за да изпълни задачата – като плащането, разделено на три. Третата група са недобронамерени възложители, които използват уменията на ИИ, за да навредят умишлено или да се възползват от слабостите на други системи. Неетична система няма да направи разлика и ще изпълни поръчката въпреки последствията."]}, "R5b": {"t": "With alignment, most of it is fixed", "p": ["Затова трябва да се погрижим системите за масово ползване да имат силни защитни механизми, които не могат да бъдат заобиколени. При първата група няма проблем – резултатът не би трябвало да се различава. При втората група, дори при неясно поставена задача, системата сама трябва да си поставя етични и законови граници и да постига целта си само с правилни действия. А умишлено вредните поръчки изобщо не трябва да се изпълняват – нещо повече, трябва да се анализират и да алармират отговорните органи, за да се предотвратяват подобни опити. С правилно съгласуване повечето от тези проблеми могат да бъдат решени. Благодаря ви за вниманието."]}};

/* ======================================================================
   RESOLVE — each element becomes a box + "parts" anchored to that box,
   so text, pills and meters ride along while the box morphs. Parts are
   keyed by role + content: same key → interpolate, else crossfade.
   ====================================================================== */
const FIT = [];   // shrink-to-fit log (QA)
let CUR_FRAME = '';
function txt(role, s, anchor, dx, dy, size, o = {}) {
  return { key:role + ':' + s, t:'text', s, anchor, dx, dy, size, wt:o.wt || 400, fam:o.fam || 'sans', col:o.col || C.ink,
           ta:o.ta || 'middle', it:!!o.it, ls:o.ls || 0, op:1, sc:o.sc || null };
}
function pill(key, s, anchor, dx, dy, o) {
  const size = o.size || 15, ls = o.ls ?? 0.06, fam = o.fam || 'cond', wt = o.wt || 600;
  const w = Math.ceil(measure(s, size, wt, fam, false, ls)) + (o.padX || 10) * 2, h = o.h || 24;
  return { key:'pill:' + key + ':' + s, t:'pill', s, anchor, dx:o.center ? dx - w / 2 : o.right ? dx - w : dx, dy, w, h, size, fam, wt, ls,
           fill:o.fill, stroke:o.stroke || 'none', sw:o.sw || 0, col:o.col || '#FFFFFF', op:1, free:!!o.free };
}
// A block of lines; returns parts positioned around a reference y (centre, or top).
function block(lines, box, opts) {
  const padX = opts.padX ?? 12, maxW = box.w - 2 * padX;
  let k = 1;
  for (const l of lines) {
    const w = measure(l.s, l.size, l.wt, l.fam || 'sans', l.it);
    if (w > maxW * k * 1.0001 && w > 0) k = Math.min(k, maxW / w);
  }
  if (k < 1) { FIT.push({ frame:CUR_FRAME, id:opts.id, k:+k.toFixed(3) }); k = Math.max(k, 0.82); }
  let y = 0; const placed = [];
  lines.forEach((l, i) => {
    const size = l.size * k, lh = size * (l.lh || 1.22);
    if (i > 0) y += (l.gap || 0) * k;
    placed.push({ l, size, base:y + lh / 2 + size * 0.35 }); y += lh;
  });
  const total = y, out = [];
  for (const p of placed) {
    const dy = opts.anchor === 'c' ? p.base - total / 2 + (opts.dy || 0) : p.base + (opts.dy || 0);
    const dx = opts.ta === 'start' ? -box.w / 2 + padX + (opts.dx || 0) : (opts.dx || 0);
    out.push(txt(p.l.role, p.l.s, opts.anchor === 'c' ? 'c' : 't', dx, dy, p.size,
                 { wt:p.l.wt, col:p.l.col, fam:p.l.fam, it:p.l.it, ta:opts.ta || 'middle' }));
  }
  return { parts:out, h:total };
}

function fadeThrough(toId, fromId, t) {
  const uo = inOutCubic(seg(t, 0, 0.5)), ui = inOutCubic(seg(t, 0.5, 1));
  return (uo < 1 ? `<g opacity="${(1 - uo).toFixed(3)}">${draw(staticList(fromId))}</g>` : `<rect width="${W}" height="${H}" fill="${C.page}"/>`) +
         (ui > 0 ? `<g opacity="${ui.toFixed(3)}">${draw(staticList(toId))}</g>` : '');
}
function frameAt(toId, fromId, t, how) {
  if (!fromId || fromId === toId) return draw(staticList(toId));
  if (reduced() || how === 'fade') return fadeThrough(toId, fromId, clamp01(t));
  return draw(mix(resolved(fromId), resolved(toId), clamp01(t)));
}
function paint(html, id) { root.innerHTML = html; svg.setAttribute('aria-label', resolved(id).title); }

const qs = new URLSearchParams(location.search);
const REVIEW = qs.has('frame');
let cur = 0, anim = null;
const notesEl = document.getElementById('notes'), fbtns = document.getElementById('fbtns');

function renderReview() {
  const to = ORDER.includes(qs.get('frame')) ? qs.get('frame') : ORDER[0];
  const from = ORDER.includes(qs.get('from')) ? qs.get('from') : null;
  const t = qs.has('t') ? parseFloat(qs.get('t')) : 1;
  paint(frameAt(to, from, isNaN(t) ? 1 : t), to);
}
// how: 'morph' (neighbours), 'fade' (a jump), 'cut' (no animation)
function show(i, how, fromIdx) {
  i = Math.max(0, Math.min(ORDER.length - 1, i));
  const from = fromIdx ?? cur;
  if (anim) { cancelAnimationFrame(anim); anim = null; }
  cur = i; updateUI();
  if (how === 'cut' || from === i) { paint(frameAt(ORDER[i]), ORDER[i]); return; }
  const fade = how === 'fade' || reduced(), D = fade ? 420 : TM.dur, t0 = performance.now(), A0 = ORDER[from], B0 = ORDER[i];
  const step = now => {
    const t = Math.min(1, (now - t0) / D);
    paint(frameAt(B0, A0, t, fade ? 'fade' : 'morph'), B0);
    anim = t < 1 ? requestAnimationFrame(step) : null;
  };
  anim = requestAnimationFrame(step);
}
function go(i) { if (i === cur) return; show(i, Math.abs(i - cur) === 1 ? 'morph' : 'fade'); }
function updateUI() {
  fbtns.querySelectorAll('button').forEach((b, j) => b.setAttribute('aria-current', j === cur ? 'true' : 'false'));
  const cb = fbtns.querySelector('[aria-current="true"]'); if (cb && cb.scrollIntoView) cb.scrollIntoView({ block:'nearest', inline:'nearest' });
  const id = ORDER[cur], n = NOTES[id];
  notesEl.innerHTML = n ? `<h2>${esc(id)} · ${esc(n.t)}</h2>` + n.p.map(p => `<p>${esc(p)}</p>`).join('') : '';
  document.getElementById('replay').disabled = cur === 0;
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}
function toggleNotes() {
  document.body.classList.toggle('notes-on');
  document.getElementById('nbtn').setAttribute('aria-pressed', String(document.body.classList.contains('notes-on')));
}
function initLive() {
  fbtns.innerHTML = ORDER.map((id, j) => `<button data-j="${j}" title="${esc(FRAMES[j].title)}">${id}</button>`).join('');
  fbtns.addEventListener('click', e => { const b = e.target.closest('button[data-j]'); if (b) go(+b.dataset.j); });
  // a mouse click should not leave focus on a bar button, so Space keeps advancing the slides
  document.getElementById('bar').addEventListener('click', e => { if (e.detail > 0 && document.activeElement) document.activeElement.blur(); });
  document.getElementById('replay').onclick = () => { if (cur > 0) show(cur, 'morph', cur - 1); };
  document.getElementById('nbtn').onclick = toggleNotes;
  svg.addEventListener('click', () => go(cur + 1));
  document.addEventListener('keydown', e => {
    if (e.altKey || e.ctrlKey || e.metaKey) return;
    const tag = (e.target && e.target.tagName) || '';
    if (['ArrowRight', 'PageDown'].includes(e.key) || (e.key === ' ' && tag !== 'BUTTON')) { e.preventDefault(); go(cur + 1); }
    else if (['ArrowLeft', 'PageUp'].includes(e.key)) { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); toggleNotes(); }
    else if (e.key === 'Home') { e.preventDefault(); show(0, 'cut'); }        // restart the talk
    else if (e.key === 'End') { e.preventDefault(); show(ORDER.length - 1, 'cut'); }
  });
  window.addEventListener('hashchange', () => { const j = ORDER.indexOf(location.hash.slice(1)); if (j >= 0 && j !== cur) show(j, 'cut'); });
  cur = Math.max(0, ORDER.indexOf(location.hash.slice(1)));
  show(cur, 'cut');
}

if (REVIEW) { document.body.classList.add('review'); renderReview(); } else initLive();

// Re-measure and redraw once the web fonts are in (canvas measuring depends on them).
const faces = ['400 16px "IBM Plex Sans"', '500 16px "IBM Plex Sans"', '600 16px "IBM Plex Sans"', '700 16px "IBM Plex Sans"', 'italic 500 16px "IBM Plex Sans"',
               '600 16px "IBM Plex Sans Condensed"', '600 16px "IBM Plex Mono"', '600 16px "IBM Plex Sans" →≈≥⁵', '400 16px "IBM Plex Sans" лв'];
const fontsIn = document.fonts ? Promise.all(faces.map(f => document.fonts.load(f).catch(() => null))).then(() => document.fonts.ready) : Promise.resolve();
Promise.race([fontsIn, new Promise(r => setTimeout(r, 3000))]).then(() => {
  CACHE.clear(); FIT.length = 0;
  ORDER.forEach(id => resolved(id));
  if (REVIEW) renderReview(); else if (!anim) paint(frameAt(ORDER[cur]), ORDER[cur]);
  document.documentElement.dataset.ready = '1';
  window.__ready = true;
});
window.__v1 = { FIT, ORDER, resolved, TM };
</script>
