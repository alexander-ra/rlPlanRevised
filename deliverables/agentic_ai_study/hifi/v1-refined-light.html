<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>V1 Refined Light</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">
<!-- Google's latin subset drops → ≈ ≥ and the superscript digits; this text= subset adds exactly those from the same face -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&text=%E2%86%92%E2%89%88%E2%89%A5%E2%81%B0%C2%B9%C2%B2%C2%B3%E2%81%B4%E2%81%B5%E2%81%B6%E2%81%B7%E2%81%B8%E2%81%B9&display=swap">
<style>
  :root {
    --page:#F3F5F7; --ink:#15202B; --ink2:#3D4955; --ink3:#5F6B77; --focus:#2A62A8;
    --sans:'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif;
    --cond:'IBM Plex Sans Condensed','Arial Narrow','IBM Plex Sans','Segoe UI',Arial,sans-serif;
    --mono:'IBM Plex Mono',SFMono-Regular,Consolas,'Liberation Mono',monospace;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--page); color:var(--ink); font-family:var(--sans); }
  body { display:flex; flex-direction:column; overflow:hidden; }
  #wrap { flex:1 1 auto; min-height:0; position:relative; }
  #stage { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:pointer; }
  .f-sans { font-family:var(--sans); } .f-cond { font-family:var(--cond); } .f-mono { font-family:var(--mono); }
  #bar { flex:none; height:44px; display:flex; align-items:center; justify-content:center; gap:4px; padding:0 12px;
         border-top:1px solid #DDE2E8; background:#ECEFF3; font-size:13px; color:var(--ink2); }
  #bar button { font:inherit; font-weight:500; color:var(--ink2); background:transparent; border:1px solid transparent;
                border-radius:8px; padding:4px 10px; min-height:30px; cursor:pointer; }
  #bar button:hover { background:#DFE4EA; }
  #bar button[aria-current="true"] { background:var(--ink); color:#fff; }
  #bar button:focus-visible { outline:2px solid var(--focus); outline-offset:1px; }
  #bar .sep { width:1px; height:20px; background:#CFD6DD; margin:0 8px; }
  #bar .now { color:var(--ink3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:34ch; margin:0 6px; }
  body.review #bar { display:none; }
  @media (max-width:900px) { #bar .now { display:none; } #bar { height:38px; gap:2px; } #bar button { padding:3px 8px; min-height:28px; } #bar .sep { margin:0 4px; } }
</style>
</head>
<body>
<div id="wrap">
  <svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="">
    <defs>
      <filter id="blurL" x="-30%" y="-30%" width="160%" height="190%"><feGaussianBlur stdDeviation="11"/></filter>
      <filter id="blurS" x="-10%" y="-10%" width="120%" height="140%"><feGaussianBlur stdDeviation="1.8"/></filter>
      <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="14" height="14" fill="#E8ECF0"/><rect width="4" height="14" fill="#DCE2E8"/>
      </pattern>
    </defs>
    <g id="root"></g>
  </svg>
</div>
<nav id="bar" aria-label="Slides">
  <button id="prev" title="Previous (← / Page Up)" aria-label="Previous slide">‹</button>
  <span id="frames"></span>
  <button id="next" title="Next (→ / Space / Page Down / click)" aria-label="Next slide">›</button>
  <span class="sep"></span>
  <span class="now" id="now"></span>
  <button id="replay" title="Replay the transition into this slide">Replay transition</button>
</nav>

<script>
'use strict';
/* ======================================================================
   V1 · Refined light. Same element identities as the lofi storyboard
   (hifi/frames.json), re-laid out to fill the 1600×900 stage, drawn as SVG
   and morphed: persistent elements interpolate geometry and colour, new
   ones enter staggered from a sensible origin, changed text crossfades,
   and the news gets a brief halo once everything has landed.
   ====================================================================== */
const W = 1600, H = 900;

/* ---------- palette: calm neutrals + one hue per meaning ---------- */
const C = {
  page:'#F3F5F7', ink:'#15202B', ink2:'#3D4955', ink3:'#5F6B77',
  card:'#FFFFFF', line:'#C3CCD6', region:'#EAEEF2', regionLine:'#D3DAE1',
  io:'#E1E7ED', ioLine:'#A9B5C1',
  good:'#1C7C4D', goodLine:'#93CBAA', goodBar:'#2E9A63', goodOnDark:'#4CC38A',
  warn:'#8A5800', warnFill:'#FFF5DC', warnLine:'#D69A1E', warnBar:'#E0A526', warnPill:'#FBE2A0',
  bad:'#C0362C', badFill:'#FCEBE9',
  check:'#5A45B5', checkInk:'#3F2E92', checkFill:'#F1EEFB', checkLine:'#B6ABE4',
  memory:'#2A62A8', memoryInk:'#1E4C8A', memoryFill:'#E9F1FB', memoryLine:'#A9C4E8', noteLine:'#C3D5EC',
  think:'#4E6381', thinkLine:'#A3B3C8', track:'#E1E6EC',
  agentLine:'#B4BFCA', ext:'#8C98A5', segHuman:'#CDD5DE', arrow:'#8C98A5'
};
const FAM = {
  sans:"'IBM Plex Sans','Segoe UI','Helvetica Neue',Arial,sans-serif",
  cond:"'IBM Plex Sans Condensed','Arial Narrow','IBM Plex Sans','Segoe UI',Arial,sans-serif",
  mono:"'IBM Plex Mono',SFMono-Regular,Consolas,'Liberation Mono',monospace"
};
const pcol = p => p >= 0.85 ? C.goodBar : p >= 0.6 ? C.warnBar : C.bad;
const pcolText = p => p >= 0.85 ? C.good : p >= 0.6 ? C.warn : C.bad;

/* ---------- small utilities ---------- */
const clamp01 = x => x < 0 ? 0 : x > 1 ? 1 : x;
const seg = (t, a, b) => clamp01((t - a) / (b - a));
const L = (a, b, t) => a + (b - a) * t;
const inOutCubic = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const outCubic = t => 1 - Math.pow(1 - t, 3);
const outQuart = t => 1 - Math.pow(1 - t, 4);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const f1 = v => Math.round(v * 10) / 10;
function hex(h) { h = h.slice(1); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
function mixc(a, b, t) {
  if (a === b || t <= 0) return a; if (t >= 1) return b;
  if (!a || !b || a[0] !== '#' || b[0] !== '#') return t < 0.5 ? a : b;
  const A = hex(a), B = hex(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
function lum(h) { return hex(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); })
  .reduce((s, v, i) => s + v * [0.2126, 0.7152, 0.0722][i], 0); }
const contrast = (a, b) => { const A = lum(a), B = lum(b); return (Math.max(A, B) + 0.05) / (Math.min(A, B) + 0.05); };
const lerpRect = (a, b, t) => ({ x:L(a.x, b.x, t), y:L(a.y, b.y, t), w:L(a.w, b.w, t), h:L(a.h, b.h, t) });

/* ---------- text measuring (canvas, same faces as the SVG) ---------- */
const mctx = document.createElement('canvas').getContext('2d');
function measure(s, size, weight = 400, fam = 'sans', italic = false, ls = 0) {
  mctx.font = `${italic ? 'italic ' : ''}${weight} ${size}px ${FAM[fam]}`;
  return mctx.measureText(s).width + ls * size * Math.max(0, [...s].length - 1);
}

/* ======================================================================
   FRAMES — content exactly as frames.json; geometry re-fitted
   ====================================================================== */
const B = (id, x, y, w, h, label, o = {}) => ({ id, t:'box', x, y, w, h, label, ...o });
const T = (id, x, y, label, o = {}) => ({ id, t:'text', x, y, label, ...o });
const A = (from, to, o = {}) => ({ id:'a:' + from + '>' + to, t:'arrow', from, to, ...o });
const chainArrows = ids => ids.slice(0, -1).map((id, i) => A(id, ids[i + 1]));
const head = (title, cap, clock) => [
  T('ttl', 40, 90, title, { role:'title' }),
  T('cap', 40, 856, cap, { role:'caption' }),
  B('clock', 1376, 46, 184, 50, clock, { k:'clock' })];

const STEP_L = ['Search\nroad distance', 'Search\nfuel price', 'Search\ntrain fares', 'Calculate\nboth costs', 'Compare\n& answer'];
// Same words as the storyboard, re-broken for the narrower card; **…** = a bold line.
const ASK_COST = 'Which is cheaper\nfrom Ruse to Sofia\n— driving or\ntaking the train?';
const ASK_THINK = ASK_COST + '\n**Think hard**\n**and describe**\n**the answer**\n**step by step.**';

function frameF4() {
  const els = head('Thinking before each step', '98% per step → 0.98⁵ ≈ 90%. Reasoning is trained with RL on answers that can be checked.', '⏱ ~1 min');
  const top = 272, sh = 210;
  els.push(B('ai', 236, 206, 1162, 386, 'AI model', { k:'region' }));
  els.push(B('q', 40, 247, 174, 260, 'Question', { k:'io', sub:ASK_THINK, sfs:15 }));
  const xs = [254, 487, 720, 953, 1186];
  xs.forEach((x, i) => {
    els.push(B('s' + (i + 1), x, top, 194, sh, STEP_L[i], { p:0.98, ent:1 }));
    els.push(B('th' + (i + 1), x + 22, top + sh + 22, 150, 52, 'thinking…', { k:'think', ent:2 }));
  });
  els.push(B('ans', 1426, top, 134, sh, 'Answer', { k:'io', p:0.9039207967999999 }));
  els.push(...chainArrows(['q', 's1', 's2', 's3', 's4', 's5', 'ans']));
  const eq = ['0.98⁵ ≈ 90%', '0.98¹⁰ ≈ 82%', '0.98¹⁰⁰ ≈ 13%', '0.98¹⁰⁰⁰ ≈ 0%'];
  eq.forEach((s, i) => els.push(T('pow' + i, 230 + i * 380, 718, s, { role:'eq', ent:i })));
  return { id:'F4', title:'Thinking before each step', els, news:[] };
}

function frameF5a() {
  const els = head('Tools and a check', 'In code: run the tests, read the error. Here: four independent checks. The fare came from a 2025 page, in leva.', '⏱ ~5 min');
  const top = 360, sh = 260;
  els.push(B('ai', 236, 252, 1162, 482, 'AI model', { k:'region' }));
  els.push(B('q', 40, top, 174, sh, 'Question', { k:'io', sub:ASK_COST }));
  const xs = [254, 432, 610, 788, 966];
  const sub = ['web search', 'web search', '2025 page · 23 лв', 'calculator · exact', ''];
  xs.forEach((x, i) => {
    const id = 's' + (i + 1);
    const o = { p:0.98, sub:sub[i] };
    if (id === 's3') Object.assign(o, { s:'bad', lift:1, late:[0.62, 0.84] });   // turns red once the check catches it
    if (id === 's4') Object.assign(o, { p:1, k:'exact', lift:1 });
    els.push(B(id, x, top, 158, sh, STEP_L[i], o));
    if (id !== 's4') els.push(B('th' + (i + 1), x + 10, top + sh + 22, 138, 52, 'thinking…', { k:'think' }));
  });
  els.push(B('v', 1150, 293, 230, 394, 'Check', { k:'verify', ltop:true, lift:1, strong:1, at:0.44, enter:{ dx:30 } }));
  [['sources agree ✓', 'good'], ['sensible range ✓', 'good'], ['date & currency ✗', 'bad'], ['recompute ✓', 'good']]
    .forEach(([l, s], i) => els.push(B('ck' + (i + 1), 1162, 355 + i * 82, 206, 70, l, { k:'ckchip', s, at:0.50 + i * 0.045, enter:{ dx:18 } })));
  els.push(B('ans', 1426, top, 134, sh, 'Answer', { k:'io', p:0.9223681599999999, sub:'on hold', s:'warn', lift:1, late:[0.66, 0.88] }));
  els.push(...chainArrows(['q', 's1', 's2', 's3', 's4', 's5', 'v', 'ans']));
  els.push({ id:'back', t:'arrow', from:'v', to:'s3', fs:'t', ts:'t', shape:'arch', apex:188, k:'bad', at:0.68,
             label:'✗ fare from a 2025 page, in leva' });
  return { id:'F5a', title:'Tools and a check', els, news:['s4', 's3', 'v', 'ans'] };
}

// N1 and N2 share one layout; N2 compresses the rows to make room for the outside world.
const PLAN_NOTES = ['Flights: 12 land\nafter 22:00', 'Hotels: holding 12\nlate check-ins', 'Attendee 37:\nneeds a step-free room',
                    'Catering: 9 vegetarian\nlunches', 'Trains & buses: coach\nfrom Bucharest 15:30'];
const COL = { q:[40, 156], lead:[226, 126], grp:[384, 178], team:[590, 192], chk:[808, 144], plan:[978, 206], gop:[1216, 174], ans:[1420, 140] };
const ROWS = {
  N1:{ region:[152, 684], gt:[172, 346], s_fl:[172, 248], s_tr:[270, 346], ga:[372, 546], s_ho:[372, 448], s_ca:[470, 546],
       gc:[572, 668], plan:[172, 668], q:[379, 539], lead:[394, 524], ans:[379, 539], org:[394, 524],
       notes:[226, 62, 14], foot:632, g_h:[712, 738], g_a:[748, 770] },
  N2:{ region:[152, 608], gt:[168, 316], s_fl:[168, 232], s_tr:[252, 316], ga:[338, 486], s_ho:[338, 402], s_ca:[422, 486],
       gc:[508, 592], plan:[168, 592], q:[332, 492], lead:[347, 477], ans:[332, 492], org:[352, 472],
       notes:[220, 56, 10], foot:572, g_h:[744, 770], g_a:[780, 802] }
};
function frameConf(doors) {
  const R = ROWS[doors ? 'N2' : 'N1'];
  const bx = (id, col, row, label, o) => B(id, COL[col][0], R[row][0], COL[col][1], R[row][1] - R[row][0], label, o);
  const title = doors ? 'Acting in the world, through two doors' : 'A real-scale job: 100 people to this conference';
  const els = head(title, doors
    ? 'Only Correspondence writes to people; only Payments can pay, after the budget guard and, above €500, the organiser.'
    : 'A lead, three groups, five teams: ~125 agents. They coordinate through one living plan.', '⏱ ~1 day');
  const d = doors ? { door:1, lift:1 } : {};
  els.push(
    B('ai', 212, R.region[0], 1192, R.region[1] - R.region[0], '', doors ? { k:'region', wall:true, late:[0.4, 0.6] } : { k:'region' }),
    T('ail', 226, 140, doors ? '~127 agents · a lead, three groups, five teams, two payment agents' : '~125 agents · a lead, three groups, five teams', { role:'ail', ent:0 }),
    bx('q', 'q', 'q', 'Task', { k:'io', sub:'get 100 attendees\nfrom 15 countries\nto Ruse by the 23rd,\nunder €30,000', sfs:15 }),
    bx('ans', 'ans', 'ans', 'Result', { k:'io', sub:'every attendee:\nan itinerary,\na bed and\nlunches' }),
    bx('lead', 'lead', 'lead', 'Lead', { k:'lead', nl:'COORDINATE', sub:'splits the job,\nwatches\nprogress', ent:0 }),
    bx('gt', 'grp', 'gt', 'Transport', { k:'agent', sub:doors ? 'posts requests\nin the plan' : 'long and\nshort distance', ent:1 }),
    bx('ga', 'grp', 'ga', 'Accommodation', { k:'agent', sub:doors ? 'posts requests\nin the plan' : 'beds and lunches', ent:1 }),
    bx('gc', 'grp', 'gc', 'Correspondence', { k:'agent', sub:doors ? 'the only agents that\nwrite to people' : 'speaks for\neach attendee', ent:1, ...d }),
    bx('s_fl', 'team', 's_fl', 'Flights', { k:'agent', nl:'×8', sub:'long distance', ent:2 }),
    bx('s_tr', 'team', 's_tr', 'Trains & buses', { k:'agent', nl:'×6', sub:'short distance', ent:2 }),
    bx('s_ho', 'team', 's_ho', 'Hotels', { k:'agent', nl:'×4', sub:'rooms in Ruse', ent:2 }),
    bx('s_ca', 'team', 's_ca', 'Catering', { k:'agent', nl:'×3', sub:'lunches during the stay', ent:2 }),
    bx('s_co', 'team', 'gc', 'Attendee workers', { k:'agent', nl:'×100', sub:'one per attendee', ent:2, ...d }),
    bx('c_t', 'chk', 'gt', 'Verifier', { k:'verify', sub:'connections\n≥ 60 min;\nlands by the 23rd', ent:3 }),
    bx('c_a', 'chk', 'ga', 'Room & meal\ncheck', { k:'verify', sub:'a bed and a lunch\nfor everyone', ent:3 }),
    bx('c_c', 'chk', 'gc', 'Fact check', { k:'verify', sub:'names, dates,\nvisas', ent:3 }),
    bx('plan', 'plan', 'plan', 'Living plan', { k:'board', nl:'MEMORY', ltop:true, ent:3 }),
    T('planfoot', COL.plan[0] + COL.plan[1] / 2, R.foot, 'every team writes and reads', { role:'foot', ent:4 }),
    A('q', 'lead'), A('lead', 'gt'), A('lead', 'ga'), A('lead', 'gc'),
    A('gt', 's_fl'), A('gt', 's_tr'), A('ga', 's_ho'), A('ga', 's_ca'), A('gc', 's_co'),
    A('s_fl', 'c_t'), A('s_tr', 'c_t'), A('s_ho', 'c_a'), A('s_ca', 'c_a'), A('s_co', 'c_c'),
    A('c_t', 'plan'), A('c_a', 'plan'), A('c_c', 'plan'),
    T('tl', 40, R.g_h[1] - 6, 'time →', { role:'tl', ent:4 }),
    B('g_h', 160, R.g_h[0], 1244, R.g_h[1] - R.g_h[0], 'a human team: ~3 weeks of work', { k:'seg', ent:4 }),
    B('g_a', 160, R.g_a[0], Math.round(1244 / 21), R.g_a[1] - R.g_a[0], '', { k:'seg', s:'good', ent:4 }),
    T('ga_t', 160 + Math.round(1244 / 21) + 14, R.g_a[1] - 5, 'agents: ~1 day of work (plus waiting for replies and approvals)', { role:'gat', ent:4 }));
  const [n0, nh, ng] = R.notes;
  PLAN_NOTES.forEach((l, i) => els.push(B('pn' + i, COL.plan[0] + 10, n0 + i * (nh + ng), COL.plan[1] - 20, nh, l, { k:'note', ent:4 })));
  const gx = COL.gop[0], gw = COL.gop[1];
  if (!doors) {
    els.push(B('org', gx, R.org[0], gw, R.org[1] - R.org[0], 'Budget guard\n+ organiser', { k:'human', sub:'stays under €30k;\nfinal sign-off', ent:4 }),
             A('plan', 'org'), A('org', 'ans'));
    return { id:'N1', title, els, news:[] };
  }
  const by = R.region[1];                        // the wall between the system and the outside world
  els.push(
    B('guard', gx, 168, gw, 108, 'Budget guard', { k:'verify', sub:'stays under €30k;\n> €500 → organiser', lift:1, strong:1, at:0.30, enter:{ dy:26 } }),
    B('org', gx, R.org[0], gw, R.org[1] - R.org[0], 'Organiser', { k:'human', nl:'APPROVE', sub:'approves big\npayments;\nfinal sign-off', lift:1 }),
    B('pay', gx, 508, gw, 84, 'Payments', { k:'agent', nl:'×2', sub:'the only agents\nthat can pay', door:1, lift:1, at:0.50, enter:{ dy:22 } }),   // rises from the door side once the organiser has settled
    A('plan', 'guard', { fs:'r', ts:'l' }),
    A('guard', 'org', { fs:'b', ts:'t', fdx:44, tdx:44, label:'> €500', k:'gate' }),
    A('org', 'pay', { fs:'b', ts:'t', k:'strong' }),
    A('org', 'ans'),
    // the outside world rises in once the system has made room for it; then the doors open in the wall
    B('world', 212, by + 38, 1192, 78, 'outside world', { k:'world', at:0.40, enter:{ dy:18 } }),
    B('door1', 686 - 48, by - 12, 96, 24, 'door 1 · people', { k:'door', band:by + 38, at:0.48, enter:{ dy:0 } }),
    B('door2', 1280 - 75, by - 12, 150, 24, 'door 2 · money', { k:'door', band:by + 38, at:0.48, enter:{ dy:0 } }),
    B('w_people', 590, by + 51, 192, 52, 'attendees, hotels,\ncarriers · email', { k:'ext', at:0.50, enter:{ dy:18 } }),
    B('w_book', 1022, by + 51, 164, 52, 'booking systems', { k:'ext', at:0.54, enter:{ dy:18 } }),
    B('w_card', 1256, by + 51, 134, 52, 'payment card', { k:'ext', at:0.57, enter:{ dy:18 } }),
    A('s_co', 'w_people', { fs:'b', ts:'t', fdx:-16, tdx:-16, k:'door', at:0.60 }),
    A('w_people', 's_co', { fs:'t', ts:'b', fdx:16, tdx:16, k:'door', at:0.64 }),
    A('pay', 'w_book', { fs:'b', ts:'r', fdx:-66, k:'door', at:0.62 }),
    A('pay', 'w_card', { fs:'b', ts:'t', fdx:20, k:'door', at:0.66 }));
  return { id:'N2', title, els, news:['door1', 'door2', 'guard', 'org'] };
}

const FRAMES = [frameF4(), frameF5a(), frameConf(false), frameConf(true)];
const ORDER = FRAMES.map(f => f.id);
const NOTES = {
  F4:'Reasoning models think before each step, a skill trained with reinforcement learning on problems with checkable answers. At 98% per step the chain climbs to 90%. The longer the task, the more every point per step matters.',
  F5a:'Some steps can go to an exact tool: the calculator is simply right. The rest still involve judgement, so we add a check. In programming that\'s obvious: run the tests and read the error. For our trip it is four independent checks: do two sources agree, is the number in a sensible range, is the page current and in the right currency, does the arithmetic recompute. And here it catches a real trap: the train fare came from a 2025 page, in leva, and the euro arrived in January.',
  N1:'Now a real-scale version of our problem: bring 100 people from 15 countries to this conference by the 23rd, for under 30,000 euros. By hand, that is weeks of an organiser\'s work. A lead splits the job into three groups. Transport has two teams: flights for the long distances, trains and buses for the short ones. Accommodation has hotels, and catering for the lunches. Correspondence has one worker per attendee, who speaks for that person. Each team\'s work is checked. And the teams don\'t call each other: they write into one living plan and read what the others wrote. Flights notes that twelve people land after ten at night; Hotels reads it and holds late check-ins; attendee 37 needs a step-free room. The plan is how they talk.',
  N2:'Now the system acts, and it touches the outside world through only two doors. Correspondence is the only group that writes to people: attendees, hotels, carriers. Payments is the only group that can pay, and every payment passes the budget guard; anything over 500 euros waits for the organiser. The other teams only post requests in the plan. And some of the companies on the other side may well run AIs of their own.'
};

/* ======================================================================
   RESOLVE — each element becomes a box + "parts" anchored to that box,
   so text, pills and meters ride along while the box morphs. Parts are
