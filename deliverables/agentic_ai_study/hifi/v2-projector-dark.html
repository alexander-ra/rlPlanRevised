<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Projector Dark Slides</title>
<meta name="description" content="V2 hi-fi direction: the F4 → F5a and N1 → N2 showcase slides designed for a dark room and a projector.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fira Sans: a humanist sans drawn for small, poor screens. Open apertures, a large x-height and plain zeros
     survive projector blur; it covers the Cyrillic in "23 лв". The second sheet adds the ≈ → ≥ glyphs, which
     Google's default subsets leave out. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700;800&text=%E2%89%88%E2%86%92%E2%89%A5&display=swap">
<style>
  :root {
    --page:#06080b; --stage:#0e1318; --bar:#090c10; --bar-edge:#1b232c;
    --ink:#f3f6f8; --ink2:#bcc7d1; --btn:#151c24; --btn-edge:#2a3541; --btn-on:#f3f6f8; --focus:#6cc2f2;
    --sans:'Fira Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; }
  body { background:var(--page); color:var(--ink); font:14px/1.3 var(--sans);
         display:grid; grid-template-rows:minmax(0,1fr) auto; overflow:hidden; }
  #wrap { position:relative; min-height:0; min-width:0; cursor:pointer; }
  #stage { position:absolute; inset:0; width:100%; height:100%; display:block; font-family:var(--sans); }
  #bar { display:flex; align-items:center; gap:6px; padding:5px max(12px, env(safe-area-inset-right)) 5px max(12px, env(safe-area-inset-left));
         min-height:38px; background:var(--bar); border-top:1px solid var(--bar-edge); white-space:nowrap; overflow-x:auto; }
  #bar .name { color:var(--ink2); margin-right:8px; font-weight:600; letter-spacing:.02em; }
  #bar button { font:600 13px/1 var(--sans); color:var(--ink); background:var(--btn); border:1px solid var(--btn-edge);
                border-radius:7px; padding:6px 11px; cursor:pointer; }
  #bar button:hover { border-color:#4a5868; }
  #bar button[aria-current="true"] { background:var(--btn-on); color:var(--stage); border-color:var(--btn-on); }
  #bar button:focus-visible { outline:2px solid var(--focus); outline-offset:2px; }
  #bar .sep { flex:1; }
  #bar .hint { color:#7f8c99; font-size:12px; }
  body.review { grid-template-rows:minmax(0,1fr); }
  body.review #bar { display:none; }
  body.review #wrap { cursor:default; }
  @media (max-width:640px) { #bar .hint, #bar .name { display:none; } }
</style>
</head>
<body>
<main id="wrap"><svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Slide"></svg></main>
<nav id="bar" aria-label="Slides">
  <span class="name">V2 · Projector dark</span>
  <span id="frames"></span>
  <button id="replay" type="button">Replay transition</button>
  <span class="sep"></span>
  <span class="hint">→ / Space / click: next · ←: back</span>
</nav>
<script>
(() => {
'use strict';

/* =====================================================================
   Tokens. One hue per meaning, tuned for a projector: mid-light accents
   that survive a washed-out image, never neon; neutrals stepped wide
   enough that cards still separate from the ground when projected.
   ===================================================================== */
const C = {
  bg:'#0e1318', panel:'#141b23', panelEdge:'#27323e', card:'#1c2530', card2:'#26313d', edge:'#3d4a58', edge2:'#4f5d6c',
  ink:'#f3f6f8', ink2:'#bdc8d2', ink3:'#97a4b1', dark:'#0e1318', arrow:'#93a2b1',
  good:'#62d29a', warn:'#f5b544', bad:'#ff6e64', check:'#b9a7ff', sky:'#6cc2f2', sand:'#e3c98e', human:'#f6eedf',
  goodT:'#132a1f', warnT:'#33280f', badT:'#3d1a1b', checkT:'#1f1c38', skyT:'#0f2232', sandT:'#28231a', humanT:'#272620',
  badSub:'#ffbab3', exact:'#eaeff4', exactSub:'#33404d', think:'#2a3542', note:'#221e16', noteInk:'#efe8d6',
  world:'#0c1a25', worldEdge:'#1f3c52', seg:'#2b3542', pill:'#334150', wall:'#8796a5', doorway:'#1d4763'
};
const FN = "'Fira Sans', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif";

/* ---------- small maths ---------- */
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const win = (t, w) => w[1] <= w[0] ? (t >= w[1] ? 1 : 0) : clamp((t - w[0]) / (w[1] - w[0]));
const easeIO = u => u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;   // cubic in-out: glides
const easeOut = u => 1 - Math.pow(1 - u, 3);                                  // entries settle
const easeIn = u => u * u * u;                                                // exits accelerate away
const sine = u => -(Math.cos(Math.PI * u) - 1) / 2;                           // arrows draw on
const smooth = u => u * u * (3 - 2 * u);
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, u) => {
  if (a === b || u <= 0) return a; if (u >= 1) return b;
  if (!/^#[0-9a-f]{6}$/i.test(a) || !/^#[0-9a-f]{6}$/i.test(b)) return u < 0.5 ? a : b;
  const A = hex(a), B = hex(b);
  return '#' + A.map((v, i) => Math.round(lerp(v, B[i], u)).toString(16).padStart(2, '0')).join('');
};
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const f1 = v => (Math.round(v * 10) / 10);
const pct = v => Math.round(v * 100) + '%';
const pcol = v => v >= 0.85 ? C.good : v >= 0.6 ? C.warn : C.bad;

/* ---------- text: measuring, superscripts, rich runs ---------- */
const SUP = '⁰¹²³⁴⁵⁶⁷⁸⁹';
function splitSup(s) {
  const out = []; let cur = '', sup = false;
  for (const ch of String(s)) {
    const i = SUP.indexOf(ch), isS = i >= 0, c = isS ? String(i) : ch;
    if (isS !== sup && cur) { out.push({ s: cur, sup }); cur = ''; }
    sup = isS; cur += c;
  }
  if (cur) out.push({ s: cur, sup });
  return out;
}
const mctx = document.createElement('canvas').getContext('2d');
let mcache = new Map();
function tw(t, size, wt = 400, mono = false) {
  const parts = Array.isArray(t) ? t : [{ t }]; let w = 0;
  for (const p of parts) for (const r of splitSup(p.t)) {
    const sz = r.sup ? size * 0.62 : size, ww = p.wt || wt, k = `${ww}|${sz}|${mono}|${r.s}`;
    let v = mcache.get(k);
    if (v == null) { mctx.font = `${ww} ${sz}px ${FN}`; v = mctx.measureText(r.s).width * (mono ? 1.04 : 1); mcache.set(k, v); }
    w += v;
  }
  return w;
}

/* ---------- icons (drawn, never emoji) ---------- */
function iconSVG(p) {
  const { name, cx, cy, s } = p, col = p.color, sw = f1(p.sw || Math.max(2, s / 11)), op = p.op ?? 1;
  const P = (x, y) => `${f1(cx + x * s)},${f1(cy + y * s)}`;
  const st = `fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"`;
  let g = '';
  switch (name) {
    case 'vdisc': case 'xdisc': {
      g = `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(s / 2)}" fill="${col}"/>`;
      const m = `fill="none" stroke="${p.mark || C.dark}" stroke-width="${f1(s / 8)}" stroke-linecap="round" stroke-linejoin="round"`;
      g += name === 'vdisc' ? `<path d="M${P(-0.24, 0.02)} L${P(-0.06, 0.2)} L${P(0.25, -0.17)}" ${m}/>`
                            : `<path d="M${P(-0.17, -0.17)} L${P(0.17, 0.17)} M${P(0.17, -0.17)} L${P(-0.17, 0.17)}" ${m}/>`;
      break;
    }
    case 'cross': g = `<path d="M${P(-0.3, -0.3)} L${P(0.3, 0.3)} M${P(0.3, -0.3)} L${P(-0.3, 0.3)}" ${st}/>`; break;
    case 'stopwatch':
      g = `<circle cx="${f1(cx)}" cy="${f1(cy + 0.08 * s)}" r="${f1(0.38 * s)}" ${st}/>` +
          `<path d="M${P(0, -0.3)} L${P(0, -0.46)} M${P(-0.12, -0.47)} L${P(0.12, -0.47)} M${P(0.3, -0.24)} L${P(0.38, -0.32)} M${P(0, 0.08)} L${P(0.13, -0.1)}" ${st}/>`;
      break;
    case 'shield':
      g = `<path d="M${P(0, -0.5)} L${P(0.42, -0.34)} L${P(0.42, 0.02)} Q${P(0.42, 0.34)} ${P(0, 0.52)} Q${P(-0.42, 0.34)} ${P(-0.42, 0.02)} L${P(-0.42, -0.34)} Z" ${st}/>` +
          `<path d="M${P(-0.18, 0.0)} L${P(-0.04, 0.15)} L${P(0.2, -0.13)}" ${st}/>`;
      break;
    case 'person':
      g = `<circle cx="${f1(cx)}" cy="${f1(cy - 0.2 * s)}" r="${f1(0.19 * s)}" ${st}/>` +
          `<path d="M${P(-0.36, 0.46)} Q${P(-0.36, 0.06)} ${P(0, 0.06)} Q${P(0.36, 0.06)} ${P(0.36, 0.46)}" ${st}/>`;
      break;
  }
  return `<g opacity="${f1(op * 1000) / 1000}">${g}</g>`;
}

/* =====================================================================
   Frames. Same ids as frames.json (so persistent elements keep their
   identity across a transition), re-laid out to fill the 1600×900 stage.
   ===================================================================== */
const chrome = (title, cap, clock) => [
  { id: 'ttl', k: 'text', x: 48, y: 92, label: title, size: 52, wt: 700, fill: 'ink' },
  { id: 'cap', k: 'text', x: 48, y: 852, label: cap, size: 24, wt: 400, fill: 'ink2' },
  { id: 'clock', k: 'clock', x: 1384, y: 44, w: 168, h: 52, label: clock },
];
const A = (id, from, to, o = {}) => ({ id, k: 'arrow', from, to, r: 'h', ...o });
const STEP_L = ['Search\nroad distance', 'Search\nfuel price', 'Search\ntrain fares', 'Calculate\nboth costs', 'Compare\n& answer'];
const SX = i => 70 + i * 258;            // five 228-wide steps fill the model region edge to edge
const ASK = 'Which is cheaper from Ruse to Sofia — driving or taking the train?';
const chainArrows = () => [0, 1, 2, 3].map(i => A(`a:s${i + 1}>s${i + 2}`, 's' + (i + 1), 's' + (i + 2)));

function F4() {
  const sy = 296, sh = 204;
  return [
    ...chrome('Thinking before each step', '98% per step → 0.98⁵ ≈ 90%. Reasoning is trained with RL on answers that can be checked.', '⏱ ~1 min'),
    { id: 'ai', k: 'region', x: 48, y: 250, w: 1304, h: 280, label: 'AI model', ext: 0, ey: 500 },
    { id: 'q', k: 'prompt', x: 48, y: 120, w: 1504, h: 100, label: 'Question', sub: ASK + '\n**Think hard and describe the answer step by step.**' },
    ...STEP_L.map((l, i) => ({ id: 's' + (i + 1), k: 'step', x: SX(i), y: sy, w: 228, h: sh, label: l, p: 0.98, padB: 58 })),
    ...STEP_L.map((l, i) => ({ id: 'th' + (i + 1), k: 'think', x: SX(i) + 34, y: sy + sh - 56, w: 160, h: 40, label: 'thinking…' })),
    { id: 'ans', k: 'io', x: 1382, y: 318, w: 170, h: 160, label: 'Answer', p: 0.9039207967999999 },
    A('a:q>s1', 'q', 's1', { r: 'v', xa: 'to' }), ...chainArrows(), A('a:s5>ans', 's5', 'ans'),
    ...[[5, '90%', 0.9039], [10, '82%', 0.8171], [100, '13%', 0.1326], [1000, '0%', 0]].map(([n, r, v], i) => ({
      id: 'pow' + i, k: 'tile', x: 48 + i * 382, y: 584, w: 358, h: 186,
      label: `0.98${String(n).replace(/\d/g, d => SUP[d])} ≈ ${r}`, v })),
  ];
}

function F5a() {
  const sy = 262, sh = 216;
  const sub = ['web search', 'web search', '2025 page · 23 лв', 'calculator · exact', ''];
  return [
    ...chrome('Tools and a check', 'In code: run the tests, read the error. Here: four independent checks. The fare came from a 2025 page, in leva.', '⏱ ~5 min'),
    { id: 'ai', k: 'region', x: 48, y: 214, w: 1304, h: 560, label: 'AI model', ext: 200, ey: 500 },
    { id: 'q', k: 'prompt', x: 48, y: 120, w: 1504, h: 70, label: 'Question', sub: ASK },
    ...STEP_L.map((l, i) => ({ id: 's' + (i + 1), k: i === 3 ? 'exact' : 'step', x: SX(i), y: sy, w: 228, h: sh, label: l,
      p: i === 3 ? 1 : 0.98, sub: sub[i], s: i === 2 ? 'bad' : undefined, padB: i === 3 ? 0 : 58 })),
    ...[0, 1, 2, 4].map(i => ({ id: 'th' + (i + 1), k: 'think', x: SX(i) + 34, y: sy + sh - 56, w: 160, h: 40, label: 'thinking…' })),
    { id: 'v', k: 'band', x: 70, y: 570, w: 1460, h: 180, label: 'Check', hx: SX(4), hw: 428 },
    ...['sources agree ✓', 'sensible range ✓', 'date & currency ✗', 'recompute ✓'].map((l, i) => ({
      id: 'ck' + (i + 1), k: 'chip', x: SX(i) + 11, y: 624, w: 206, h: 72, label: l, s: i === 2 ? 'bad' : 'good' })),
    { id: 'ans', k: 'io', x: 1382, y: 262, w: 170, h: 216, label: 'Answer', sub: 'on hold', s: 'warn', p: 0.9223681599999999 },
    A('a:q>s1', 'q', 's1', { r: 'v', xa: 'to' }), ...chainArrows(),
    A('a:s5>v', 's5', 'v', { r: 'v' }), A('a:v>ans', 'v', 'ans', { r: 'v', xa: 'to' }),   // the verdict leaves the model upward
    // the check's verdict goes back from the failing test to the step it caught
    A('back', 'ck3', 's3', { r: 'v', ak: 'bad', label: '✗ fare from a 2025 page, in leva', lp: 'right', lyo: -27 }),
  ];
}

/* N1 / N2 share one grid: lead | groups | teams | checks | living plan | guard·organiser·payments, then the result. */
const NX = { lead: 64, grp: 228, team: 434, chk: 722, plan: 908, right: 1144, res: 1376 };
const NW = { lead: 140, grp: 180, team: 262, chk: 160, plan: 214, right: 190, res: 176 };
const TASK = 'get 100 attendees from 15 countries to Ruse by the 23rd, under €30,000';
const NOTES = ['Flights: 12 land\nafter 22:00', 'Hotels: holding 12\nlate check-ins', 'Attendee 37:\nneeds a step-free room',
  'Catering: 9 vegetarian\nlunches', 'Trains & buses: coach\nfrom Bucharest 15:30'];

function conf(doors) {
  // row geometry: N1 spreads over a tall region; N2 compresses it to make room for the outside world
  const R = doors
    ? { reg: 396, fl: [232, 60], tr: [298, 60], ho: [374, 60], ca: [440, 60], co: [516, 80], gt: [232, 126], ga: [374, 126], gc: [516, 80],
        plan: [232, 364], note0: 280, noteStep: 56, noteH: 48, foot: 580, lead: 354, ans: 355 }
    : { reg: 484, fl: [232, 68], tr: [308, 68], ho: [414, 68], ca: [490, 68], co: [596, 88], gt: [232, 144], ga: [414, 144], gc: [596, 88],
        plan: [232, 452], note0: 288, noteStep: 72, noteH: 54, foot: 668, lead: 398, ans: 383 };
  const box = (id, k, col, row, label, o = {}) => ({ id, k, x: NX[col], y: row[0], w: NW[col], h: row[1], label, ...o });
  const els = [
    ...chrome(doors ? 'Acting in the world, through two doors' : 'A real-scale job: 100 people to this conference',
      doors ? 'Only Correspondence writes to people; only Payments can pay, after the budget guard and, above €500, the organiser.'
            : 'A lead, three groups, five teams: ~125 agents. They coordinate through one living plan.', '⏱ ~1 day'),
    { id: 'ai', k: 'region', x: 48, y: 216, w: 1304, h: R.reg, label: '', wall: doors },
    { id: 'ail', k: 'text', x: NX.grp, y: 205, size: 17, wt: 600, fill: 'ink2',
      label: doors ? '~127 agents · a lead, three groups, five teams, two payment agents' : '~125 agents · a lead, three groups, five teams' },
    { id: 'q', k: 'prompt', x: 48, y: 118, w: 1504, h: 62, label: 'Task', sub: TASK },
    { id: 'lead', k: 'lead', x: NX.lead, y: R.lead, w: NW.lead, h: 120, label: 'Lead', nl: 'COORDINATE', sub: 'splits the job,\nwatches progress' },
    box('gt', 'agent', 'grp', R.gt, 'Transport', { sub: doors ? 'posts requests\nin the plan' : 'long and\nshort distance' }),
    box('ga', 'agent', 'grp', R.ga, 'Accommodation', { sub: doors ? 'posts requests\nin the plan' : 'beds and lunches' }),
    box('gc', 'agent', 'grp', R.gc, 'Correspondence', { sub: doors ? 'the only agents that\nwrite to people' : 'speaks for\neach attendee', door: doors }),
    box('s_fl', 'agent', 'team', R.fl, 'Flights', { nl: '×8', sub: 'long distance' }),
    box('s_tr', 'agent', 'team', R.tr, 'Trains & buses', { nl: '×6', sub: 'short distance' }),
    box('s_ho', 'agent', 'team', R.ho, 'Hotels', { nl: '×4', sub: 'rooms in Ruse' }),
    box('s_ca', 'agent', 'team', R.ca, 'Catering', { nl: '×3', sub: 'lunches during the stay' }),
    box('s_co', 'agent', 'team', R.co, 'Attendee workers', { nl: '×100', sub: 'one per attendee', door: doors }),
    box('c_t', 'verify', 'chk', R.gt, 'Verifier', { sub: 'connections\n≥ 60 min;\nlands by the 23rd' }),
    box('c_a', 'verify', 'chk', R.ga, 'Room & meal\ncheck', { sub: 'a bed and a lunch\nfor everyone' }),
    box('c_c', 'verify', 'chk', R.gc, 'Fact check', { sub: 'names, dates, visas' }),
    box('plan', 'board', 'plan', R.plan, 'Living plan', { nl: 'MEMORY' }),
    { id: 'planfoot', k: 'text', x: NX.plan + NW.plan / 2, y: R.foot, size: 15, wt: 600, fill: 'sand', anchor: 'middle', label: 'every team writes and reads' },
    ...NOTES.map((l, i) => ({ id: 'pn' + i, k: 'note', x: NX.plan + 10, y: R.note0 + i * R.noteStep, w: NW.plan - 20, h: R.noteH, label: l })),
    { id: 'ans', k: 'io', x: NX.res, y: R.ans, w: NW.res, h: 150, label: 'Result', sub: 'every attendee:\nan itinerary, a bed\nand lunches' },
    A('a:q>lead', 'q', 'lead', { r: 'v', xa: 'to', tdy: -14 }),
    ...['gt', 'ga', 'gc'].map(g => A('a:lead>' + g, 'lead', g, { r: 'hvh', mx: 216 })),
    A('a:gt>s_fl', 'gt', 's_fl', { ya: 'to' }), A('a:gt>s_tr', 'gt', 's_tr', { ya: 'to' }),
    A('a:ga>s_ho', 'ga', 's_ho', { ya: 'to' }), A('a:ga>s_ca', 'ga', 's_ca', { ya: 'to' }), A('a:gc>s_co', 'gc', 's_co', { ya: 'to' }),
    A('a:s_fl>c_t', 's_fl', 'c_t'), A('a:s_tr>c_t', 's_tr', 'c_t'), A('a:s_ho>c_a', 's_ho', 'c_a'),
    A('a:s_ca>c_a', 's_ca', 'c_a'), A('a:s_co>c_c', 's_co', 'c_c'),
    A('a:c_t>plan', 'c_t', 'plan'), A('a:c_a>plan', 'c_a', 'plan'), A('a:c_c>plan', 'c_c', 'plan'),
    { id: 'tl', k: 'text', x: 48, y: 743, size: 20, wt: 500, fill: 'ink2', label: 'time →' },
    { id: 'g_h', k: 'seg', x: 150, y: 722, w: 1202, h: 28, label: 'a human team: ~3 weeks of work' },
    { id: 'g_a', k: 'seg', x: 150, y: 758, w: 57, h: 28, label: '', s: 'good' },
    { id: 'ga_t', k: 'text', x: 220, y: 779, size: 17, wt: 600, fill: 'good', label: 'agents: ~1 day of work (plus waiting for replies and approvals)' },
  ];
  if (!doors) {
    els.push({ id: 'org', k: 'human', x: NX.right, y: 388, w: NW.right, h: 140, label: 'Budget guard\n+ organiser', sub: 'stays under €30k;\nfinal sign-off' },
      A('a:plan>org', 'plan', 'org', { ya: 'to' }), A('a:org>ans', 'org', 'ans'));
  } else {
    els.push(
      { id: 'guard', k: 'verify', x: NX.right, y: 232, w: NW.right, h: 80, label: 'Budget guard', sub: 'stays under €30k;\n> €500 → organiser' },
      { id: 'org', k: 'human', x: NX.right, y: 384, w: NW.right, h: 100, label: 'Organiser', nl: 'APPROVE', sub: 'approves big payments;\nfinal sign-off' },
      { id: 'pay', k: 'agent', x: NX.right, y: 516, w: NW.right, h: 80, label: 'Payments', nl: '×2', sub: 'the only agents\nthat can pay', door: true },
      A('a:plan>guard', 'plan', 'guard', { ya: 'to' }),
      A('a:guard>org', 'guard', 'org', { r: 'v', dx: 152, label: '> €500', lk: 'gate' }),
      A('a:org>pay', 'org', 'pay', { r: 'v', dx: 152 }), A('a:org>ans', 'org', 'ans'),
      { id: 'world', k: 'world', x: 48, y: 628, w: 1504, h: 74, label: 'outside world' },
      { id: 'w_people', k: 'ext', x: NX.team, y: 641, w: NW.team, h: 48, label: 'attendees, hotels,\ncarriers · email' },
      { id: 'w_book', k: 'ext', x: 1050, y: 641, w: 168, h: 48, label: 'booking systems' },
      { id: 'w_card', k: 'ext', x: 1236, y: 641, w: 168, h: 48, label: 'payment card' },
      // the two doors: the only openings in the system's wall
      { id: 'door1', k: 'door', x: 520, y: 606, w: 80, h: 28, n: '1' },
      { id: 'door2', k: 'door', x: 1134, y: 606, w: 192, h: 28, n: '2' },

function arrowSVG(p) {

      out.push({ pt: 'T', key: 'lt', x: x0 + 28, y: my + 7.5, t, size: 22, wt: 700, fill: C.bad, anchor: 'start', op: lo, z: 4.6, i: 2, eo: order, el: s.id });

/* ---------- primitive rendering ---------- */
function textSVG(p) {
  const parts = Array.isArray(p.t) ? p.t : [{ t: p.t }];
  let inner = '', lift = 0;
  for (const part of parts) {
    const fill = part.fill ? ` fill="${part.fill}"` : '', wt = part.wt ? ` font-weight="${part.wt}"` : '';
    for (const r of splitSup(part.t)) {
      if (r.sup) { const rise = p.size * 0.38; inner += `<tspan font-size="${f1(p.size * 0.62)}" dy="${f1(-rise + lift)}"${fill}${wt}>${esc(r.s)}</tspan>`; lift = rise; }
      else { inner += `<tspan${lift ? ` dy="${f1(lift)}"` : ''}${fill}${wt}>${esc(r.s)}</tspan>`; lift = 0; }
    }

  if (p.anchor && p.anchor !== 'start') attrs.push(`text-anchor="${p.anchor}"`);

  if ((p.op ?? 1) < 0.999) attrs.push(`opacity="${f1((p.op ?? 1) * 1000) / 1000}"`);
  if (p.cont) attrs.push(`data-c="${p.cont.map(f1).join(',')}"`);

function badgeSVG(p) {
  const t = pct(p.v), col = pcol(p.v), w = tw(t, 20, 700, true) + 26, h = 34, x = p.xr - w, op = p.op ?? 1;
  const fill = mix(C.bg, C.good, p.ex), stroke = mix(col, C.good, p.ex), ink = mix(col, C.dark, p.ex);
  return `<g opacity="${f1(op * 1000) / 1000}"><rect x="${f1(x)}" y="${f1(p.y)}" width="${f1(w)}" height="${h}" rx="${h / 2}" fill="${fill}" stroke="${stroke}" stroke-width="2.5"/>` +
    `<text x="${f1(x + w / 2)}" y="${f1(p.y + 24)}" font-size="20" font-weight="700" text-anchor="middle" fill="${ink}" style="font-variant-numeric:tabular-nums"${p.el ? ` data-e="${esc(p.el)}"` : ''}>${t}</text></g>`;
}
function primSVG(p) {
  const op = p.op ?? 1; if (op <= 0.003) return '';

    case 'R': {
      if (p.w <= 0 || p.h <= 0) return '';

      return `<rect x="${f1(p.x)}" y="${f1(p.y)}" width="${f1(p.w)}" height="${f1(p.h)}" rx="${f1(Math.min(p.rx || 0, p.w / 2, p.h / 2))}" fill="${p.fill}"${st}${p.dash ? ` stroke-dasharray="${p.dash}"` : ''}${op < 0.999 ? ` opacity="${f1(op * 1000) / 1000}"` : ''}${p.el && p.key === 'shape' ? ` data-b="${esc(p.el)}"` : ''}/>`;
    }

      return `<path d="${closedPath(pts, p.rx)}" fill="${p.fill}" stroke="${p.stroke}" stroke-width="${f1(p.sw)}"${op < 0.999 ? ` opacity="${f1(op * 1000) / 1000}"` : ''}/>`;
    }

/* ---------- interpolation of matched primitives ---------- */
const NUMK = ['x', 'y', 'w', 'h', 'rx', 'sw', 'size', 'wt', 'cx', 'cy', 's', 'v', 'ex', 'xr', 'op', 'ext', 'ey'];
const COLK = ['fill', 'stroke', 'color'];
function lerpPrim(a, b, u) {
  const r = { ...b };
  for (const k of NUMK) if (typeof a[k] === 'number' && typeof b[k] === 'number') r[k] = lerp(a[k], b[k], u);
  for (const k of COLK) if (typeof a[k] === 'string' && typeof b[k] === 'string') r[k] = mix(a[k], b[k], u);
  if ((a.sw || 0) > 0 && !(b.sw > 0)) r.stroke = a.stroke;

}
// A persistent element: surviving keys glide, the rest fade out (first half) and in (second half), never overlapping.
function blend(pa, pb, u) {
  const ma = new Map(pa.map(p => [p.key, p])), mb = new Map(pb.map(p => [p.key, p])), out = [];
  const ue = easeIO(u), fo = 1 - smooth(clamp(u / 0.5)), fi = smooth(clamp((u - 0.5) / 0.5));
  for (const p of pa) if (!mb.has(p.key)) out.push({ ...p, op: (p.op ?? 1) * fo });
  for (const p of pb) { const q = ma.get(p.key); out.push(q ? lerpPrim(q, p, ue) : { ...p, op: (p.op ?? 1) * fi }); }

}
// Move / scale / fade every primitive of an element (entries and exits).

    if ('y' in q && typeof q.y === 'number') q.y = Y(q.y);
    if (typeof q.xr === 'number') q.xr = X(q.xr);
    if (typeof q.cx === 'number') q.cx = X(q.cx);
    if (typeof q.cy === 'number') q.cy = Y(q.cy);
    if (typeof q.ey === 'number') q.ey = Y(q.ey);

    if (typeof q.w === 'number') q.w *= sc;
    if (typeof q.h === 'number') q.h *= sc;

    if (typeof q.s === 'number') q.s *= sc;

  });
}

/* =====================================================================
   Scene: the frame `to` reached from `from` at linear progress t.
   Pure function of (from, to, t): no clock, no randomness.
   ===================================================================== */
function scene(fromId, toId, t) {
  const A0 = fromId ? FR[fromId].els : [], B0 = FR[toId].els;
  const S = (fromId && fromId !== toId && SCHED[fromId + '>' + toId]) || {};
  const live = fromId !== toId;
  const mA = new Map(A0.map(e => [e.id, e])), mB = new Map(B0.map(e => [e.id, e]));
  const G = new Map(), prims = [], enterWin = new Map();
  const tag = (ps, el, eo) => ps.map(p => ({ ...p, el, eo }));

  // default entry windows: new boxes arrive left to right
  const ent = B0.filter(e => e.k !== 'arrow' && !mA.has(e.id));
  const xs = ent.map(e => e.x), x0 = Math.min(...xs), x1 = Math.max(...xs);
  ent.forEach(e => {
    const s = S[e.id] || {};
    const st = 0.3 + 0.3 * (x1 > x0 ? (e.x - x0) / (x1 - x0) : 0);
    enterWin.set(e.id, s.i || [st, st + 0.28]);
  });

  B0.forEach((b, order) => {
    if (b.k === 'arrow') return;
    const a = mA.get(b.id), s = S[b.id] || {};
    if (a) {
      const gw = s.g || DEF.g, cw = s.c || gw, nw = s.n || gw;
      const ug = easeIO(win(t, gw)), uc = win(t, cw), un = easeIO(win(t, nw));
      const g = {};
      for (const k of ['x', 'y', 'w', 'h', 'size']) if (typeof a[k] === 'number' && typeof b[k] === 'number') g[k] = lerp(a[k], b[k], ug);
      if (a.p != null && b.p != null) g.p = lerp(a.p, b.p, un);
      if (typeof a.ext === 'number' && typeof b.ext === 'number') g.ext = lerp(a.ext, b.ext, easeIO(win(t, s.gx || gw)));   // region extension
      G.set(b.id, { x: g.x, y: g.y, w: g.w, h: g.h });
      prims.push(...tag(blend(layout({ ...a, ...g }), layout({ ...b, ...g }), uc), b.id, order));
    } else {
      const u = win(t, enterWin.get(b.id)), ue = easeOut(u);
      let e = b;
      if (s.from && mA.has(s.from)) {           // grows out of an element that was already there
        const o = mA.get(s.from), ug = easeIO(u);
        e = { ...b, x: lerp(o.x, b.x, ug), y: lerp(o.y, b.y, ug), w: lerp(o.w, b.w, ug), h: lerp(o.h, b.h, ug) };
      }
      const isText = b.k === 'text';
      const dy = (s.dy ?? (isText ? 10 : 18)) * (1 - ue), dx = (s.dx ?? 0) * (1 - ue);
      const sc = s.sc != null ? lerp(s.sc, 1, ue) : 1;
      const ox = (e.x ?? 0) + (e.w || 0) / 2, oy = (e.y ?? 0) + (e.h || 0) / 2;

  A0.forEach((a, order) => {
    if (a.k === 'arrow' || mB.has(a.id)) return;
    const s = S[a.id] || {}, u = easeIn(win(t, s.x || DEF.x));

  // arrows follow the geometry of this instant
  B0.forEach((b, order) => {
    if (b.k !== 'arrow') return;
    const s = S[b.id] || {};
    if (mA.has(b.id)) { prims.push(...arrowPrims(b, G, 1, 1, order)); return; }
    let w = s.i;

  A0.forEach((a, order) => {

    const s = S[a.id] || {};

  // one subtle pulse on the slide's news as the transition lands
  if (live && fromId) {

      const g = G.get(id), e = mB.get(id); if (!g || !e) continue;
      const col = e.k === 'door' ? C.sky : e.k === 'human' ? C.human : e.s === 'bad' ? C.bad : e.s === 'warn' ? C.warn : C.check;
      const d = 4 + (e.k === 'door' ? 9 : 18) * easeOut(u), pad = e.k === 'door' ? 6 : 0;

        stroke: col, sw: 3, op: 0.75 * Math.pow(1 - u, 1.6) * smooth(clamp(u * 6)), z: 6, i: 0, eo: 0, el: 'pulse:' + id });

function svgFor(prims) {
  return `<rect width="1600" height="900" fill="${C.bg}"/>` + prims.map(p => {
    const s = primSVG(p);
    return p.pt === 'R' && p.fill === 'none' ? s.replace('fill="none"', 'fill="none" pointer-events="none"') : s;
  }).join('');
}

/* =====================================================================
   Stage, navigation and review hooks
   ===================================================================== */
const stage = document.getElementById('stage');
const qs = new URLSearchParams(location.search);
const review = qs.has('frame');
const reduce = qs.get('motion') === 'reduce' || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const D = reduce ? 320 : 1200;
let cur = SEQ.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'F4';
let anim = 0, last = null;

function draw(fromId, toId, t) {
  if (reduce && fromId && fromId !== toId && t < 1) {        // reduced motion: a short crossfade, nothing moves
    const u = smooth(clamp(t));
    stage.innerHTML = svgFor(scene(toId, toId, 1)) + `<g opacity="${f1((1 - u) * 1000) / 1000}">${svgFor(scene(fromId, fromId, 1))}</g>`;
  } else stage.innerHTML = svgFor(scene(fromId, toId, t));

function play(fromId, toId) {

  const step = now => { const t = clamp((now - t0) / D); draw(fromId, toId, t); if (t < 1) anim = requestAnimationFrame(step); };
  anim = requestAnimationFrame(step);
}
function go(id, animate = true) {
  if (!FR[id]) return;
  const prev = cur; cur = id;
  history.replaceState(null, '', location.pathname + location.search + '#' + id);
  updateBar();
  if (animate && prev !== id) play(prev, id); else { cancelAnimationFrame(anim); draw(id, id, 1); }

const step = d => go(SEQ[clamp(SEQ.indexOf(cur) + d, 0, SEQ.length - 1)]);

const framesEl = document.getElementById('frames');
function updateBar() {
  framesEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', String(b.dataset.id === cur)));
}

if (review) {
  document.body.classList.add('review');
  const to = FR[qs.get('frame')] ? qs.get('frame') : 'F4';
  const from = FR[qs.get('from')] ? qs.get('from') : null;
  const t = qs.has('t') ? clamp(parseFloat(qs.get('t')) || 0) : 1;
  const render = () => draw(from && from !== to ? from : to, to, from ? t : 1);
  render();
  const done = () => { mcache = new Map(); render(); document.documentElement.dataset.ready = '1'; };
  Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 3000))]).then(done);
} else {
  framesEl.innerHTML = SEQ.map(id => `<button type="button" data-id="${id}" title="${esc(FR[id].title)}">${id}</button>`).join(' ');
  // after a mouse click, hand focus back to the page so Space / arrows keep driving the slides
  framesEl.addEventListener('click', ev => { const b = ev.target.closest('button'); if (b) { ev.stopPropagation(); if (ev.detail) b.blur(); go(b.dataset.id); } });
  document.getElementById('replay').addEventListener('click', ev => {
    ev.stopPropagation(); if (ev.detail) ev.currentTarget.blur(); const i = SEQ.indexOf(cur); play(i > 0 ? SEQ[i - 1] : null, cur);
  });
  document.getElementById('bar').addEventListener('click', ev => ev.stopPropagation());
  document.getElementById('wrap').addEventListener('click', () => step(1));
  window.addEventListener('keydown', ev => {
    if (ev.target.closest && ev.target.closest('button') && (ev.key === ' ' || ev.key === 'Enter')) return;
    if (['ArrowRight', ' ', 'PageDown', 'ArrowDown'].includes(ev.key)) { ev.preventDefault(); step(1); }
    else if (['ArrowLeft', 'PageUp', 'ArrowUp'].includes(ev.key)) { ev.preventDefault(); step(-1); }
    else if (ev.key === 'Home') { ev.preventDefault(); go(SEQ[0]); }
    else if (ev.key === 'End') { ev.preventDefault(); go(SEQ[SEQ.length - 1]); }
  });
  updateBar(); draw(cur, cur, 1);
  document.fonts.ready.then(() => { mcache = new Map(); if (last) draw(...last); document.documentElement.dataset.ready = '1'; });
}

// Self-check used by the review scripts: text outside its box, text colliding with other text, arrows through text.
window.__audit = () => {
  const out = [], T = [...stage.querySelectorAll('text')].filter(n => +(n.getAttribute('opacity') ?? 1) > 0.5);
  const bb = n => { const b = n.getBBox(); return { x: b.x, y: b.y + b.height * 0.12, w: b.width, h: b.height * 0.76, n }; };
  const boxes = T.map(bb);
  boxes.forEach(b => {
    const c = b.n.dataset.c; if (!c) return;
    const [x, y, w, h] = c.split(',').map(Number);
    if (b.x < x + 6 || b.x + b.w > x + w - 6 || b.y < y + 2 || b.y + b.h > y + h - 2)
      out.push(`clip: "${b.n.textContent}" [${f1(b.x)},${f1(b.y)} ${f1(b.w)}×${f1(b.h)}] in box [${c}]`);
  });
  for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
    const a = boxes[i], b = boxes[j];
    if (a.x < b.x + b.w - 1 && b.x < a.x + a.w - 1 && a.y < b.y + b.h - 1 && b.y < a.y + a.h - 1)
      out.push(`overlap: "${a.n.textContent}" × "${b.n.textContent}"`);
  }
  return out;
};
window.__scene = scene;
})();
