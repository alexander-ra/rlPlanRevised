<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Hundred Attempts Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Golos+Text:wght@400..700&display=swap">
<style>
  :root { --page:#d5dce2; --stage:#f4f6f7; --ink:#14202b; --ink2:#3b4855; --barbg:#e8ecef; --barline:#c3ccd4; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--page); }
  body { display:flex; flex-direction:column; color:var(--ink);
         font-family:Archivo, "Golos Text", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; }
  #wrap { flex:1; min-height:0; position:relative; overflow:hidden; }
  #stage, #ghost { position:absolute; left:0; top:0; width:1600px; height:900px; transform-origin:0 0; background:var(--stage); }
  #stage { box-shadow:0 1px 3px rgba(20,32,43,.12), 0 8px 30px rgba(20,32,43,.08); cursor:pointer; }
  #ghost { pointer-events:none; opacity:1; transition:opacity .16s linear; }
  #ghost.out { opacity:0; }
  #stage.fadein .layer { opacity:0; }
  #stage.fadein.on .layer { opacity:1; transition:opacity .18s linear .14s; }
  svg.layer, canvas.layer { position:absolute; left:0; top:0; width:1600px; height:900px; display:block; }
  svg text { font-family:Archivo, "Golos Text", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; font-kerning:normal;
             font-variant-numeric:tabular-nums; }
  #bar { flex:none; height:40px; display:flex; align-items:center; gap:6px; padding:0 8px; background:var(--barbg);
         border-top:1px solid var(--barline); font-size:13px; white-space:nowrap; }
  #fbtns { display:flex; gap:3px; overflow-x:auto; scrollbar-width:thin; min-width:0; flex:1 1 auto; padding:2px 0; }
  #bar button { font:inherit; font-weight:700; font-stretch:90%; color:var(--ink); background:#fff; border:1px solid #b3bec8;
                border-radius:6px; padding:3px 7px; cursor:pointer; line-height:1.25; flex:none; }
  #bar button:hover { background:#f2f5f7; }
  #bar button[aria-current="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
  #bar button[aria-pressed="true"] { background:#dfe6ec; }
  #bar button:focus-visible { outline:2px solid #2563b0; outline-offset:1px; }
  #bar .sep { width:1px; height:20px; background:var(--barline); flex:none; }
  #notes { display:none; flex:none; max-height:30vh; overflow:auto; background:#fbfcfc; border-top:1px solid var(--barline);
           padding:10px 18px 12px; font:16px/1.5 "Golos Text", Archivo, Arial, sans-serif; color:var(--ink); }
  #notes h2 { margin:0 0 6px; font:600 14px/1.3 Archivo, Arial, sans-serif; color:var(--ink2); letter-spacing:.02em; }
  #notes p { margin:0 0 8px; max-width:110ch; }
  body.notes-on #notes { display:block; }
  body.review #bar, body.review #notes { display:none !important; }
  body.review #stage { box-shadow:none; cursor:default; }
  @media (max-width:900px) { #bar { height:36px; } #bar button { padding:2px 5px; } #notes { font-size:14px; } }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage" role="img" aria-label="Slide">
    <svg id="svg" class="layer" viewBox="0 0 1600 900" width="1600" height="900"></svg>
    <canvas id="cv" class="layer"></canvas>
  </div>
</div>
<aside id="notes" aria-label="Speaker notes" aria-live="polite"></aside>
<nav id="bar" aria-label="Slides">
  <div id="fbtns"></div>
  <span class="sep"></span>
  <button id="replay" title="Replay the transition into this slide">Replay</button>
  <button id="nbtn" aria-pressed="false" title="Speaker notes (N)">Notes</button>
</nav>
<script>
'use strict';
/* =====================================================================
   V4 · A hundred attempts.
   Probability made visible: 100 dots (attempts) flow through the chain;
   each step drops its share, exact tools drop none, the check catches
   the stale fare and sends it back. Every attempt leaves a faint thread,
   so the settled slide still shows where the attempts went.
   On N1/N2 the dots are work, actions and messages; on N2 they leave the
   system only through two doors.
   Everything that moves is a pure function of (time, seed).
   ===================================================================== */
const W = 1600, H = 900;
const URLQ = new URLSearchParams(location.search);
const SEED = (parseInt(URLQ.get('seed'), 10) || 20261024) >>> 0;
const D = 1.1;                       // transition length, seconds
const ORDER = ['F1', 'F2', 'F3', 'F4', 'F5a', 'F5b', 'F7a', 'F7b', 'F7c', 'F8', 'N1', 'N2', 'N3', 'F9', 'R0', 'R4', 'R1', 'R2', 'R3', 'R6', 'R5a', 'R5b'];

/* ---------- palette: one colour per meaning ---------- */
const C = {
  ink:'#14202b', ink2:'#3b4855', mute:'#56626e', faint:'#8a96a1',
  line:'#9aa6b1', track:'#e3e8ec', card:'#ffffff', cardS:'#bcc6cf', group:'#edf1f4', stage:'#f4f6f7',
  dot:'#1b2834',
  good:'#13804d', goodBg:'#e3f2e9', goodInk:'#0d6a3f',
  warn:'#d08700', warnBg:'#fdf1d4', warnInk:'#8a5800',
  bad:'#cf3426', badBg:'#fde8e5', badInk:'#b0261a',
  chk:'#6a49c8', chkBg:'#f2eefc', chkInk:'#4b2fa0', chkDim:'#b9aae6',
  msg:'#2563b0', plan:'#4a5866', world:'#e4e9ed', worldS:'#aeb9c3', dim:'#c5ced6',
};

/* ---------- small helpers ---------- */
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
const eio = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;   // cubic in-out: geometry
const eout = t => 1 - Math.pow(1 - t, 3);                                     // cubic out: entrances
const f1 = v => Math.round(v * 10) / 10;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const hexRGB = c => { const n = parseInt(c.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
function mix(a, b, t) {
  if (a === b || t <= 0) return a; if (t >= 1) return b;
  if (!a || !b || a[0] !== '#' || b[0] !== '#') return t < .5 ? a : b;
  const A = hexRGB(a), B = hexRGB(b);
  return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join('');
}
const lum = c => { if (!c || c[0] !== '#') return 0; const [r, g, b] = hexRGB(c); return (.2126 * r + .7152 * g + .0722 * b) / 255; };
function hsh(a, b = 0, c = 0) {                       // deterministic hash → [0,1)
  let h = (SEED ^ 0x9e3779b9) >>> 0;
  for (const v of [a, b, c]) { h = Math.imul(h ^ ((v * 2654435761) | 0), 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; }
  return (h >>> 0) / 4294967296;
}
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// "0.98^100" → superscript tspans that do not depend on the font having ⁰¹…
function sup(s, size) {
  return esc(s).replace(/\^(\d+)/g, (m, d) => `<tspan dy="${f1(-size * .4)}" font-size="${f1(size * .62)}">${d}</tspan><tspan dy="${f1(size * .4)}"> </tspan>`);
}

/* =====================================================================
   SVG element renderers
   ===================================================================== */
function T(x, y, s, o = {}) {
  const { size = 18, w = 600, c = C.ink, a = 'start', st = 88, it = false, op = 1, ls = 0, halo = null } = o;
  return `<text x="${f1(x)}" y="${f1(y)}" font-size="${size}" font-weight="${w}" fill="${c}"${a !== 'start' ? ` text-anchor="${a}"` : ''}` +
    ` style="font-stretch:${st}%${it ? ';font-style:italic' : ''}"${ls ? ` letter-spacing="${ls}"` : ''}${op < 1 ? ` opacity="${op.toFixed(3)}"` : ''}` +
    `${halo ? ` stroke="${halo}" stroke-width="7" stroke-linejoin="round" paint-order="stroke"` : ''}>${s}</text>`;
}
const G = (o, inner) => o >= .999 ? inner : o <= .002 ? '' : `<g opacity="${o.toFixed(3)}">${inner}</g>`;

/* Text inside boxes is laid out as lines, so a morph can keep the lines that stay
   (they glide) and swap the ones that change: old out first, new in after — never on top of each other. */
function blockLines(g, P) {
  const fs = P.fs || 20, sfs = P.sfs || 15, L = P.label ? String(P.label).split('\n') : [], S = P.sub ? String(P.sub).split('\n') : [];
  const lh = fs * 1.13, slh = sfs * 1.27, gap = L.length && S.length ? (P.gap ?? 6) : 0;
  const total = L.length * lh + gap + S.length * slh;
  const top = g.y + (P.hd ? 40 : 0) + (P.pt ?? 6), bot = g.y + g.h - (P.pb ?? 6);
  const y0 = P.va === 'top' ? top + 6 : (top + bot) / 2 - total / 2;
  const left = P.align === 'left', cx = left ? g.x + 14 : g.x + g.w / 2 + (P.dx || 0), an = left ? 'start' : 'middle', out = [];
  L.forEach((l, i) => out.push({ k: 'L', s: l, x: cx, y: y0 + fs * .8 + i * lh, size: fs, w: P.lw || 700, c: P.lc || C.ink, a: an, st: P.lst || 86 }));
  S.forEach((l, i) => {
    const b = /^\*\*(.*)\*\*$/.exec(l);
    out.push({ k: 'S', s: b ? b[1] : l, x: cx, y: y0 + L.length * lh + gap + sfs * .8 + i * slh, size: sfs, w: b ? 700 : (P.sw2 || 500), c: b ? C.ink : (P.sc || C.ink2), a: an, st: 90 });
  });
  if (P.hd) {
    if (P.hl) out.push({ k: 'HL', s: P.hl, x: g.x + (P.hrs ? 11 : 14), y: g.y + 28, size: P.hls || 16, w: 500, c: P.hlc || C.mute, it: true, st: 92, a: 'start' });
    if (P.hr) out.push({ k: 'HR', s: P.hr, x: g.x + g.w - (P.hrs ? 10 : 13), y: g.y + 29, size: P.hrs || 19, w: 800, c: P.hrc || C.ink, st: P.hrs ? 86 : 92, a: 'end' });
  }
  return out;
}
const lineSVG = (l, op) => op <= .004 ? '' : T(l.x, l.y + (l.dy || 0), esc(l.s), { size: l.size, w: l.w, c: l.c, a: l.a, st: l.st, it: l.it, op });
function xfLines(LA, LB, e) {
  const t = e._t, lag = e._lag || 0, g = e._g ?? 1;
  const outO = 1 - smooth(.04 + lag, .3 + lag, t), inO = smooth(.4 + lag, .66 + lag, t);
  const used = new Set(); let s = '';
  for (const lb of LB) {
    const j = LA.findIndex((la, k) => !used.has(k) && la.k === lb.k && la.s === lb.s && (lum(la.c) < .5) === (lum(lb.c) < .5));
    if (j >= 0) { used.add(j); const la = LA[j]; s += lineSVG({ ...lb, x: lerp(la.x, lb.x, g), y: lerp(la.y, lb.y, g), size: f1(lerp(la.size, lb.size, g)), c: mix(la.c, lb.c, g) }, 1); }
    else s += lineSVG({ ...lb, dy: 6 * (1 - inO) }, inO);
  }
  LA.forEach((la, k) => { if (!used.has(k)) s += lineSVG({ ...la, dy: -4 * (1 - outO) }, outO); });
  return s;
}
function textOf(e, P) {   // the box's lines, cross-faded when the element is mid-morph
  if (e._A) return xfLines(blockLines(e, e._A), blockLines(e, e._B), e);
  const op = e._txo ?? 1;
  return blockLines(e, P).map(l => lineSVG(l, op)).join('');
}

function pillSVG(x, y, text, fill, color, size = 15, h = 26) {
  const w = Math.max(h + 6, text.length * size * .62 + 20);
  return `<g data-pill="1"><rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${h}" rx="${h / 2}" fill="${fill}"/>` +
    T(x + w / 2, y + h / 2 + size * .36, esc(text), { size, w: 800, c: color, a: 'middle', st: 92, ls: .6 }) + '</g>';
}
function personIcon(x, y, s, col) {      // a simple head-and-shoulders line icon
  return `<g fill="none" stroke="${col}" stroke-width="2.2" stroke-linecap="round"><circle cx="${f1(x)}" cy="${f1(y - s * .25)}" r="${f1(s * .22)}"/>` +
    `<path d="M${f1(x - s * .42)},${f1(y + s * .42)}c0,-${f1(s * .34)} ${f1(s * .2)},-${f1(s * .46)} ${f1(s * .42)},-${f1(s * .46)}s${f1(s * .42)},${f1(s * .12)} ${f1(s * .42)},${f1(s * .46)}"/></g>`;
}
function markSVG(x, y, ok, col, s = 7) {  // drawn ✓ / ✗ so they never depend on a font
  return ok
    ? `<path d="M${f1(x - s)},${f1(y)}l${f1(s * .7)},${f1(s * .75)}l${f1(s * 1.35)},-${f1(s * 1.55)}" fill="none" stroke="${col}" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>`
    : `<path d="M${f1(x - s * .8)},${f1(y - s * .8)}l${f1(s * 1.6)},${f1(s * 1.6)}M${f1(x + s * .8)},${f1(y - s * .8)}l-${f1(s * 1.6)},${f1(s * 1.6)}" fill="none" stroke="${col}" stroke-width="2.8" stroke-linecap="round"/>`;
}

function rCard(e) {
  const o = e.o ?? 1; if (o <= .005) return '';
  const rx = e.rx ?? 12;
  let s = '';
  if (e.lift) s += `<rect x="${f1(e.x)}" y="${f1(e.y + 3)}" width="${f1(e.w)}" height="${f1(e.h)}" rx="${rx}" fill="#14202b" opacity=".07"/>`;
  s += `<rect x="${f1(e.x)}" y="${f1(e.y)}" width="${f1(e.w)}" height="${f1(e.h)}" rx="${rx}" fill="${e.fill || C.card}" stroke="${e.stroke || C.cardS}" stroke-width="${e.sw ?? 1.8}"/>`;
  s += textOf(e, e);
  const top = e._A ? null : e;   // icon + pill: cross-fade too
  const deco = (P, op) => {
    if (op <= .004) return ''; let d = '';
    if (P.icon === 'person') d += personIcon(e.x + e.w - 24, e.y + 26, 24, P.stroke || C.ink);
    if (P.pill) d += pillSVG(e.x - 10, e.y - 13, P.pill, P.pillBg || C.ink, '#fff');
    return G(op, d);
  };
  if (e._A) {
    const same = (e._A.pill || '') === (e._B.pill || '') && (e._A.icon || '') === (e._B.icon || '');
    s += same ? deco(e._B, 1) : deco(e._A, 1 - smooth(.04, .3, e._t)) + deco(e._B, smooth(.4, .66, e._t));
  } else s += deco(e, e._txo ?? 1);
  return `<g opacity="${o.toFixed(3)}" data-box="${e.id}">${s}</g>`;
}

function rRegion(e) {
  const o = e.o ?? 1; if (o <= .005) return '';
  let s = `<rect x="${f1(e.x)}" y="${f1(e.y)}" width="${f1(e.w)}" height="${f1(e.h)}" rx="18" fill="none" stroke="#a3afba" stroke-width="1.8" stroke-dasharray="8 7"/>`;
  if (e.label) s += swapText(e, (l, op, dy) => op <= .004 ? '' : T(e.x + 18, e.y + 30 + (e.ls ? 3 : 0) + dy, esc(l), { size: e.ls || 19, w: 700, c: e.ls ? C.ink2 : C.mute, st: 92, ls: .3, op }));
  return G(o, s);
}

function ringsPath(g, from, to) {
  const r = g.r ?? g.p * .32; let d = '';
  for (let k = from; k < to; k++) {
    const cx = g.x + (k % 10 + .5) * g.p, cy = g.y + (Math.floor(k / 10) + .5) * g.p;
    d += `M${f1(cx - r)},${f1(cy)}a${f1(r)},${f1(r)} 0 1,0 ${f1(2 * r)},0a${f1(r)},${f1(r)} 0 1,0 ${f1(-2 * r)},0`;
  }
  return d;
}
function rGrid(e) {   // 10×10 slots; n filled (SVG-drawn grids) or rings only (canvas dots sit on top)
  const o = e.o ?? 1; if (o <= .005) return '';
  const n = Math.round(e.n ?? 0);
  let s = n < 100 ? `<path d="${ringsPath(e, n, 100)}" fill="none" stroke="${e.ring || '#b4bec7'}" stroke-width="1.3"/>` : '';
  if (n > 0) s += `<path d="${ringsPath({ ...e, r: (e.r ?? e.p * .32) + .6 }, 0, n)}" fill="${e.col || C.dot}"/>`;
  return G(o, s);
}

function swapText(e, one) {   // generic old-out / new-in for single-label elements
  if (e._A && e._A.label !== e._B.label) {
    const t = e._t, w = e.xw || (e.t === 'pill' ? [.62, .74, .8, .94] : [.04, .3, .4, .66]), outO = 1 - smooth(w[0], w[1], t), inO = smooth(w[2], w[3], t);
    return one(e._A.label, outO, -5 * (1 - outO)) + one(e._B.label, inO, 7 * (1 - inO));
  }
  return one(e.label, e._txo ?? 1, 0);
}
function rText(e) {
  const o = e.o ?? 1; if (o <= .005) return '';
  return swapText(e, (label, op, dy) => op <= .004 ? '' : String(label).split('\n').map((l, k) => T(e.x, e.y + dy + k * e.size * (e.lh || 1.25), e.sup ? sup(l, e.size) : esc(l),
    { size: e.size, w: e.weight || 600, c: e.color || C.ink, a: e.anchor || 'start', st: e.st || 88, op: op * o, it: e.it })).join(''));
}
function rPill(e) {
  const o = e.o ?? 1; if (o <= .005) return '';
  return `<g data-pill="1">${G(o, swapText(e, (text, op, dy) => {
    if (op <= .004) return '';
    const P = e._A && e._A.label !== e._B.label ? (text === e._A.label ? e._A : e._B) : e;   // each label keeps its own colours
    const w = text.length * 9.6 + 28;
    return G(op, `<rect x="${f1(e.x - w / 2)}" y="${f1(e.y + dy)}" width="${f1(w)}" height="30" rx="15" fill="${P.fill}" stroke="${P.stroke}" stroke-width="1.6"/>` +
      T(e.x, e.y + dy + 21, esc(text), { size: 17, w: 800, c: P.color, a: 'middle', st: 92 }));
  }))}</g>`;
}
function rCount(e) {
  const o = e.o ?? 1; if (o <= .005) return '';
  return G(o, `<text x="${f1(e.x)}" y="${f1(e.y)}" text-anchor="middle" fill="${C.ink}" style="font-stretch:96%">` +
    `<tspan font-size="${e.n >= 99.5 ? 44 : 50}" font-weight="800">${Math.round(e.n)}</tspan><tspan font-size="${e.n >= 99.5 ? 19 : 21}" font-weight="600" fill="${C.ink2}" dx="${e.n >= 99.5 ? 4 : 6}">of 100</tspan></text>`);
}
function rKey(e) {   // tiny legend with drawn dots
  const o = e.o ?? 1; if (o <= .005) return '';
  let x = e.x, s = '';
  const items = e.items.map(it => ({ ...it, w: it.label.length * 8.1 + 30 }));
  const tw = items.reduce((a, it) => a + it.w + 14, -14);
  if (e.anchor === 'end') x -= tw; else if (e.anchor === 'middle') x -= tw / 2;
  for (const it of items) {
    const r = it.r || 5.5;
    s += it.ring ? `<circle cx="${f1(x + 8)}" cy="${f1(e.y - 5)}" r="${r - 1}" fill="#fff" stroke="${it.c}" stroke-width="2.2"/>`
      : `<circle cx="${f1(x + 8)}" cy="${f1(e.y - 5)}" r="${r}" fill="${it.c}"/>`;
    s += T(x + 20, e.y, esc(it.label), { size: 16, w: 600, c: C.mute, st: 90 });
    x += it.w + 14;
  }
  return G(o, s);
}
function rLane(e) {
  const o = e.o ?? 1; if (o <= .005) return '';
  return G(o, `<rect x="${f1(e.x0)}" y="${f1(e.y - e.h / 2)}" width="${f1(e.x1 - e.x0)}" height="${f1(e.h)}" rx="${f1(e.h / 2)}" fill="${C.track}" opacity=".7"/>`);
}
function rGate(e) {
  const o = e.o ?? 1; if (o <= .005) return '';
  let s = '';
  const ex = e.exA ?? 0;   // 0 = judgement step, 1 = exact tool
  if (ex < 1) s += G(1 - ex, `<line x1="${f1(e.x)}" y1="${f1(e.y0)}" x2="${f1(e.x)}" y2="${f1(e.y1)}" stroke="${C.line}" stroke-width="2" stroke-dasharray="3 4"/>`);
  if (ex > 0) s += G(ex, [e.ex0, e.ex1].map(x => `<line x1="${f1(x)}" y1="${f1(e.ly - 9)}" x2="${f1(x)}" y2="${f1(e.ly + 9)}" stroke="${C.ink}" stroke-width="2.4" stroke-linecap="round"/>`).join(''));
  return G(o, s);
}
function rChip(e) {
  const o = e.o ?? 1; if (o <= .005) return '';
  if (e._A && (e._A.s !== e._B.s || e._A.label !== e._B.label)) {   // state or text changes: old chip out, new chip in
    const xo = smooth(.16, .36, e._t), xi = smooth(.38, .6, e._t), g = { _A: null, _B: null, _t: null };   // old out, then new in

  }

    elsB = dynEls(fb, B.els, { arrived: sB.arrived, lost: sB.lost, tc: gB.L ? tCheck(gB) : 0 }, tauB === 0, 0); }
  else elsB = dynEls(fb, B.els, { arrived: 0, lost: {} }, false, TFINAL(fb));
  let els = morph(elsA, elsB, t);
  const m = new Map(els.map(e => [e.id, e]));
  const clock = clockA + t * D;
  let dots = [], threads = [];
  if (A.kind === 'chain' && B.kind === 'chain') {
    const geo = chainGeo(m); let arrived = 0;
    const PA = [], PB = [];
    for (let i = 0; i < 100; i++) { PA.push(chainDot(i, A.sem, geo, tauA)); PB.push(chainDot(i, B.sem, geo, tauB)); }
    const resc = RANKED.filter(i => PA[i].st === 2 && PB[i].st === 3 && (PA[i].u ?? 1) >= 1);   // an exact tool or a redo saves them
    const rank = new Map(resc.map((i, k) => [i, k]));
    const xa = 1 - smooth(.3, .75, t), xb = smooth(.3, .75, t);
    chainThreads(A.sem, geo, tauA, () => xa, threads);
    chainThreads(B.sem, geo, tauB, i => rank.has(i) ? smooth(.9, 1, t) : xb, threads);
    for (let i = 0; i < 100; i++) {
      const pa = PA[i], pb = PB[i];
      if (rank.has(i)) {
        const g = geo.gates[lostAt(i, A.sem)], st = .14 * rank.get(i) / Math.max(1, resc.length - 1);
        const u = clamp((t - .24 - st) / .6), x1 = geo.L.x1, tray = trayXY(g, SEM[A.sem].tray[i]);
        let p, tail = null;
        if (u < .16) { const v = eout(u / .16); p = { x: lerp(tray.x, g.x, v), y: lerp(tray.y, laneY(i, g.x, geo, B.sem), v), c: mix(C.bad, C.dot, v) }; }
        else if (u < .84) {
          const v = eio((u - .16) / .68), x = lerp(g.x, x1, v), after = SEM[B.sem].hold ? C.warn : C.good;
          p = { x, y: laneY(i, x, geo, B.sem), c: SEM[B.sem].check && x > checkX(geo) ? after : C.dot };
          const xb2 = Math.max(g.x, x - 26); tail = [[xb2 + 13, laneY(i, xb2 + 13, geo, B.sem)], [xb2, laneY(i, xb2, geo, B.sem)]];
        } else { const v = eout((u - .84) / .16), d = slotXY(geo.ag, SLOT[B.sem][i]), yy = laneY(i, x1, geo, B.sem); p = { x: lerp(x1, d.x, v), y: lerp(yy, d.y, v), c: pb.c }; if (v > .5) arrived++; }
        dots.push({ ...p, r: 5.2, a: 1, tail });
        continue;
      }
      const lag = .06 * clamp(pa.x / 1600), g = eio(clamp((t - lag) / .7));
      const slot = pb.st === 3 ? SLOT[B.sem][i] : 0;
      const cu = pa.st === 3 && pb.st === 3 ? smooth(.56 + slot * .0028, .7 + slot * .0028, t) : smooth(.3, .7, t);
      const rr = r => r === 0 ? clamp(geo.qg.p * .3, 5.2, 9) : 5.2;
      dots.push({ x: lerp(pa.x, pb.x, g), y: lerp(pa.y, pb.y, g), c: mix(pa.c, pb.c, cu), r: lerp(rr(pa.st), rr(pb.st), g), a: 1 });
      if ((g < .5 ? pa.st : pb.st) === 3) arrived++;
    }
    els = els.map(e => e.id === 'acount' ? { ...e, n: arrived } : e);
    if (B.els.some(e => e.id === 'back')) dots = dots.concat(redoDots(m, clock, A.els.some(e => e.id === 'back') ? 1 : smooth(.86, 1, t)));
    else if (A.els.some(e => e.id === 'back')) dots = dots.concat(redoDots(m, clock, 1 - smooth(0, .3, t)));
  } else if (A.kind === 'net' && B.kind === 'net') {
    const ids = f => new Set(streamDefs(f).map(s => s.id).concat(netSpecialIds(f)));
    const ida = ids(fa), idb = ids(fb);
    const da = netDots(fa, els, m, clock, !runA, id => idb.has(id) ? 0 : 1 - smooth(0, .4, t));
    const db = netDots(fb, els, m, clock, true, id => ida.has(id) ? 1 : smooth(.62, 1, t));
    dots = da.concat(db);
  } else {
    // different kinds of slide: the old flow fades out, the new one fades in
    const fo = 1 - smooth(0, .35, t), fi = smooth(.62, 1, t);
    if (A.kind === 'chain') {
      const geo = chainGeo(m), st = chainState(A.sem, geo, tauA);
      dots = st.dots.map(d => ({ ...d, a: fo }));
      chainThreads(A.sem, geo, tauA, () => fo, threads);
      if (A.els.some(e => e.id === 'back')) dots = dots.concat(redoDots(m, clock, fo));
    } else dots = kindDots(fa, els, m, clock, !runA, () => fo);
    if (B.kind === 'chain') {
      const geo = chainGeo(m), st = chainState(B.sem, geo, tauB);
      dots = dots.concat(st.dots.map(d => ({ ...d, a: fi })));
      chainThreads(B.sem, geo, tauB, () => fi, threads);
      if (B.els.some(e => e.id === 'back')) dots = dots.concat(redoDots(m, clock, fi));
      els = els.map(e => e.id === 'acount' ? { ...e, n: st.arrived } : e);
    } else dots = dots.concat(kindDots(fb, els, m, clock, true, () => fi));
  }
  return { els, dots, threads };
}

const svg = document.getElementById('svg'), cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const stage = document.getElementById('stage'), wrap = document.getElementById('wrap');
const TH = { ink: [C.dot, .1, 1.3], warn: [C.warn, .2, 1.3], good: [C.good, .19, 1.3], bad: [C.bad, .6, 1.7] };
let lastSVG = '';
function fit() {
  const r = wrap.getBoundingClientRect(), s = Math.min(r.width / W, r.height / H);
  stage.style.transform = `translate(${(r.width - W * s) / 2}px,${(r.height - H * s) / 2}px) scale(${s})`;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(W * s * dpr)); cv.height = Math.max(1, Math.round(H * s * dpr));
}
function draw(view) {
  const s = render(view.els);
  if (s !== lastSVG) { svg.innerHTML = s; lastSVG = s; }
  ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const th of view.threads || []) {
    const [c, a, w] = TH[th.cat], p = th.pts; if (p.length < 4) continue;
    ctx.globalAlpha = a * th.a; ctx.strokeStyle = c; ctx.lineWidth = w;
    ctx.beginPath(); ctx.moveTo(p[0], p[1]); for (let k = 2; k < p.length; k += 2) ctx.lineTo(p[k], p[k + 1]); ctx.stroke();
  }
  for (const d of view.dots) {
    if (d.a <= .01) continue;
    const a = clamp(d.a);
    if (d.tail) {   // a short motion tail, so direction reads in a still frame
      ctx.globalAlpha = a * .3; ctx.strokeStyle = d.c; ctx.lineWidth = d.r * 1.3;
      ctx.beginPath(); ctx.moveTo(d.x, d.y); for (const [x, y] of d.tail) ctx.lineTo(x, y); ctx.stroke();
    }
    if (d.halo) { ctx.globalAlpha = a * d.halo; ctx.fillStyle = d.hc; ctx.beginPath(); ctx.arc(d.x, d.y, d.r + (d.hr || 8), 0, 6.2832); ctx.fill(); }
    ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(d.x, d.y, d.ring ? d.r - 1.1 : d.r, 0, 6.2832);
    if (d.ring) { ctx.lineWidth = 2.4; ctx.strokeStyle = d.c; ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.stroke(); }
    else { ctx.fillStyle = d.c; ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}

const NOTES = {"F1": {"t": "Title", "p": ["Здравейте. Аз съм Александър Андреев, кандидат-докторант в Русенския университет „Ангел Кънчев“. Днес ще ви представя темата „Решаване на сложни проблеми с многоагентни системи: възможности и рискове“."]}, "F2": {"t": "One question, one answer", "p": ["Идеята е да ви покажа процеса нагледно, с диаграма, която постепенно се разширява. Вляво винаги стои въпросът или задачата на потребителя. Вдясно е крайният отговор на ИИ, с примерен шанс този отговор да е верен. По средата е работата, която ИИ извършва, а в горния десен ъгъл – приблизителното време от задаването на въпроса до отговора.", "Започваме с обикновен въпрос и директен отговор – така работеха първите масово разпространени езикови модели, като GPT-3.5 от ноември 2022 г. „Да шофирам ли, или да си хвана влака до София?“ Получаваме бърз, но непроверен отговор – синтез на всичко, което моделът е прочел по време на обучението си. Основният проблем е, че отговорът винаги звучи уверено, дори когато е напълно подвеждащ. Това е т.нар. „халюцинация“."]}, "F3": {"t": "A real task has many steps", "p": ["Ако конкретизираме въпроса – „Кое е по-евтино от Русе до София: с кола или с влак?“ – вече ни трябват конкретни данни. За да даде смислен отговор, ИИ разбива въпроса на няколко последователни подвъпроса и така увеличава шанса за верен отговор. Езиковите модели започнаха да правят това сами около средата на 2023 г.", "Грешка дори в една от стъпките обаче най-вероятно води до грешен отговор. Ако всяка от петте стъпки е вярна с 95%, целият отговор е верен само в 77% от случаите. В реалността стъпките, разбира се, имат различен шанс, но идеята е ясна: дори когато всяка стъпка е вярна с над 90%, шансът за верен краен резултат пада рязко, колкото по-голяма е задачата. Под диаграмата виждате шанса за успех при 5, 10, 100 и 1000 стъпки.", "А времето: ако един въпрос отнема около 2 секунди, тук имаме пет такива – общо около 10 секунди."]}, "F4": {"t": "Thinking before each step", "p": ["За да подобрим шанса на всяка отделна стъпка, можем да оставим модела да „мисли“. Всичко започна с прости инструкции – „помисли задълбочено и обясни отговора си стъпка по стъпка“. Резултатите бяха толкова добри, че компаниите вградиха мисленето в самото обучение на моделите. Първите такива модели бяха OpenAI o1 (септември 2024 г.) и DeepSeek R1 (януари 2025 г.). Вместо направо да „изплюят“ отговора, те водят вътрешен диалог със себе си и търсят обосновка за всяко свое заключение. При 98% за стъпка петте стъпки вече дават 90%, но редът отдолу показва, че при хиляда стъпки и това не стига."]}, "F5a": {"t": "Tools and a check", "p": ["Друг начин да увеличим шанса за успех са инструментите и автоматичните проверки. Когато една стъпка се изпълни с инструмент, например калкулатор или програмен скрипт, шансът за грешка в нея пада до нула – на слайда изчислението на двата разхода вече е точно. За останалите стъпки добавяме проверка, която изрично търси доказателства за всяко заключение. В примера тя открива грешка в цената на билета: взета е от страница от 2025 г. и е в лева, а от януари плащаме в евро."]}, "F5b": {"t": "Redo, with the reason", "p": ["Проверката връща не просто „грешно“, а и причината – затова вторият опит е различен и търси актуалната цена в евро. Възможността да се върнем и да поправим грешката носи много по-голям шанс за успех: тук всяка проверена стъпка е вярна с 99,99% и дори при хиляда стъпки шансът остава около 90%.", "Минусът е цената. Писането на скриптове и многократното минаване през всяка стъпка удължават изчисленията, а някои проверки, дори автоматизирани, отнемат много време. Ако трябваше да проверим резултат от биологично изследване, това нямаше да са минути, а дни – но понякога това е единственият начин да сме сигурни в резултата."]}, "F7a": {"t": "An open question takes many more steps", "p": ["Ако направим въпроса по-„отворен“ – как най-евтино да стигнем до София в рамките на 24 часа – има по-голям шанс да открием решение, което изобщо не сме предвидили. Така можем да проверим различни варианти, а някои от тях отпадат чак докато задачата се решава. Такива системи се появиха в края на 2024 г. с Deep Research на Google, последван от Deep Research на OpenAI през февруари 2025 г. Минусът остава същият: времето за отговор рязко нараства – тук до около два часа. Затова и компаниите промениха начина, по който ги предлагат: вместо чат с активна дискусия, това е процес, който стартирате и получавате резултата след известно време."]}, "F7b": {"t": "Copies take the options in parallel", "p": ["Ако същият процес се раздели на няколко паралелни нишки, стигаме до същия резултат за много по-кратко време – около 25 минути вместо два часа. Всяка нишка е агент: същият модел, със собствена работна памет, пуснат за една задача. Необходимите ресурси обаче нарастват, защото освен стъпките, които иначе бихме изпълнили последователно, имаме и агент-„диригент“, който разпределя работата, следи останалите и ги изчаква."]}, "F7c": {"t": "Copies split again, stop early, report back", "p": ["Това, че има диригент, не означава, че един агент се грижи за всички останали. Тук всеки начин на придвижване се разделя допълнително според нуждите си: колата проверява два пътя – през Плевен и през Велико Търново, а влакът – директна връзка и връзка с прекачване. Йерархията обаче се запазва: обикновено всички подпроцеси трябва да приключат, за да може този, който ги е създал, да продължи. В случая това, че не можем да пътуваме с колело заради бурята, не зависи от останалите. Но ако подпроцесите са свързани и задължителни, провалът на един от тях може да накара диригента да спре всички останали и да преосмисли подхода си."]}, "F8": {"t": "Where splitting helps, and where it hurts", "p": ["Не всяка задача печели от разделяне на паралелни нишки. Търсенето в различни източници в интернет е отличен пример за ускорение без загуба на качество: няма нужда да зареждаме и „четем“ източниците един по един – може наведнъж.", "В другата крайност е писането на роман. Ако пишем всички глави едновременно, резултатът ще е катастрофален – не можем да пишем заключението по същото време като увода. Несъответствията в текста са неизбежни.", "Повечето задачи са някъде по средата, като програмирането: отделни поправки се делят лесно, но две копия, които пишат една и съща функционалност, трябва постоянно да се съгласуват. Въпросът, който трябва да си зададем, е дали значително по-краткото време си струва риска от неуспех."]}, "N1": {"t": "A real-scale job: 100 people to this conference", "p": ["Досега задачата – да намерим един превоз от точка А до точка Б – се ускоряваше значително с езикови модели, но все пак беше по силите на един човек за един работен ден. През последните месеци успехите на ИИ позволиха мащабът на проблемите да нарасне рязко. В новия пример не търсим превоз за един човек: искаме да доведем и настаним 100 гости от 15 държави в нашия град за конференция, с бюджет под 30 000 евро. Работа, която би отнела на екип от хора около три седмици, може да се свърши за един ден – стига външният свят да отговаря бързо с потвърждения за резервации, билети и т.н.", "Повечето сложни системи имат йерархия от възложители и изпълнители, общо място, където споделят междинните резултати, и начин да комуникират и да следят напредъка. Тук задачата е разделена на три части: как да придвижим гостите до града, как да ги настаним подобаващо и как да потвърдим, че всичко това е подходящо за всеки един от тях."]}, "N2": {"t": "Acting in the world, through two doors", "p": ["В такива сложни процеси е наивно да мислим, че най-добрият резултат може да се постигне без човешка намеса по време на изпълнението. Системата действа навън само през две „врати“: само кореспонденцията пише на хора и само агентите за плащания могат да плащат. Затова сме сложили и ограничение на плащанията: всичко под 500 евро агентът за плащания изпълнява сам, а по-големите суми чакат, докато отговорникът за организацията изрично ги одобри."]}, "N3": {"t": "Day 9: a flight is cancelled", "p": ["Реалният свят, разбира се, не е перфектен. Дори основната задача да е свършена за ден, трябват „дежурни“ агенти, които следят за промени и ги отразяват – в реално време или периодично. В примера авиокомпанията отменя полет, който засяга десет от нашите гости. Това може да се реши автоматично, но може и отново да изисква човешка намеса – тук допълнителните 1850 евро чакат одобрение от организатора."]}, "F9": {"t": "Systems like ours are already at work", "p": ["Последната стъпка в тази част: за да покажем какво отключва съвременният ИИ, излизаме от нашите примери и поглеждаме как подобни структури се използват за откриване на нови решения, за защита на критични системи и за ускоряване на научния и технологичния прогрес. Зад тях стоят както компании, така и университети, държавни институции и независими екипи.", "Нарочно не съм включил рекурсивното самоусъвършенстване на ИИ – идеята, че в даден момент ще бъде създадена многоагентна система, която сама подобрява работата си, а новата версия на свой ред създава още по-добра. Истината е, че в големите компании за ИИ прогресът наистина е зашеметяващ и голяма част от работата на експертите им се автоматизира буквално всеки месец. Но тяхната работа, макар и непрекъснато променяща се, остава ключова за успеха им."]}, "R0": {"t": "Misalignment: what we say vs what we mean", "p": ["Време е да обърнем внимание и на рисковете, които носи тази автоматизация. За целта се връщаме към примера с настаняването на 100 гости. Досега приемахме, че системата прави това, което искаме. Но ние ѝ казахме само „най-евтино, под 30 000 евро“, а имахме предвид и „законно, честно и без да подвеждаш никого“. Проблемите започват точно в тази неизказана част."]}, "R4": {"t": "One wrong step is enough", "p": ["Първият пример показва нагледно това, което пресметнахме със степените в многостъпковия процес. Конференцията е на 24-ти, затова всички гости трябва да са настанени до края на 23-ти. Двете дати често се срещат в бележките на агентите и лесно се объркват – и датата на пристигане става 24-ти вместо 23-ти. Веднъж записана така в общия план, грешката предизвиква верижна реакция и от единичен случай засяга действията и на другите агенти. И то без никаква лоша умисъл."]}, "R1": {"t": "It games the guard, to be helpful", "p": ["Във втория пример системата отново няма лоша умисъл. Но за да ни помогне и да ускори процеса, като избегне чакането на човешко одобрение, тя заобикаля защитата, която изрично сме сложили. Предстои плащане от 600 евро – над лимита от 500. Системата го разделя на три плащания по 200 евро. Формално не е нарушила правило, но е очевидно, че е излязла от разрешените ѝ граници."]}, "R2": {"t": "It crosses a line in the world", "p": ["В третия пример нещата ескалират. Да приемем, че агентите за влаковете откриват бъг в системата за резервации и могат да запазят места за гостите, без да плащат. Това е неетично и незаконно, но на теория помага директно на възложителя – в бюджета остават повече пари за други разходи."]}, "R3": {"t": "It hides the problem", "p": ["Една стъпка по-нататък – и това е препратка към реален случай, който ще видим след малко – системата може да усети, че възложителят не би искал това. Но отново, за да му „помогне“ и да запази спестените пари, тя решава да го заблуди: макар да не е платила билетите, генерира фалшиви фактури за плащането им. Така възложителят има още по-малък шанс да разбере какво се случва и да се намеси."]}, "R6": {"t": "It has already happened", "p": ["Ще ви покажа два реални случая, за които вероятно повечето от вас са чували. И двата са станали в тестова среда, но последствията им са стигнали до реалния свят. Не е нарочно, че и двата са на OpenAI – и други компании са имали подобни случаи, но тези са най-известните.", "В първия случай група агенти, които дори не е трябвало да работят заедно, са тествани на много сложни задачи по киберсигурност в изолирани среди. Те намират пролука в изолацията си и начин да комуникират. Малко след това откриват как да заобиколят задачите и да подадат на оценителя фалшиви верни отговори. Подобно на фалшивите фактури от преди малко, те разбират, че действията им не са коректни и че оценителят рано или късно ще ги хване. Затова, според оставените следи, планират атака срещу Hugging Face – един от основните сайтове на общността по машинно обучение – за да подменят истинските отговори и да намалят шанса да бъдат разкрити. Случаят е изследван подробно от независими източници и силно ви препоръчвам да го прочетете.", "Вторият случай е подобен. Задачата е била проучване на лекарства за кожни заболявания. Понеже системата не намира достатъчно информация, тя получава непозволен достъп до медицинска система на австралийското правителство и изтегля вътрешни файлове и пароли – за да изпълни задачата по-пълно. Лични данни на граждани не са прочетени."]}, "R5a": {"t": "Who asks, and who answers", "p": ["Тези примери могат да се обобщят в три групи, според това какво искаме от системата. Първата група са добре описани задачи с ясни граници: дори неетична система в общия случай ще стигне до етичен резултат. Втората група са неясно поставени задачи – нарочно или от небрежност. Неетична система отново може да даде етичен резултат, но може и да престъпи етични или законови правила, само за да изпълни задачата – като плащането, разделено на три. Третата група са недобронамерени възложители, които използват уменията на ИИ, за да навредят умишлено или да се възползват от слабостите на други системи. Неетична система няма да направи разлика и ще изпълни поръчката въпреки последствията."]}, "R5b": {"t": "With alignment, most of it is fixed", "p": ["Затова трябва да се погрижим системите за масово ползване да имат силни защитни механизми, които не могат да бъдат заобиколени. При първата група няма проблем – резултатът не би трябвало да се различава. При втората група, дори при неясно поставена задача, системата сама трябва да си поставя етични и законови граници и да постига целта си само с правилни действия. А умишлено вредните поръчки изобщо не трябва да се изпълняват – нещо повече, трябва да се анализират и да алармират отговорните органи, за да се предотвратяват подобни опити. С правилно съгласуване повечето от тези проблеми могат да бъдат решени. Благодаря ви за вниманието."]}};

/* =====================================================================
   Controller: navigation, review hooks, notes, reduced motion
   ===================================================================== */
const RM = window.matchMedia('(prefers-reduced-motion: reduce)');
const qF = URLQ.get('frame'), qFrom = URLQ.get('from'), qT = URLQ.get('t');
const REVIEW = !!(qF && FRAMES[qF]);
let cur = REVIEW ? ORDER.indexOf(qF) : Math.max(0, ORDER.indexOf((location.hash || '').slice(1)));
// mode: {k:'still', f, t0 (ms), c0 (clock at t0), run} or {k:'trans', a, b, t0, c0, runA}
let mode = null, raf = 0;
const now = () => performance.now();
const clockOf = md => md.c0 + (now() - md.t0) / 1000;
const bar = document.getElementById('fbtns'), notesEl = document.getElementById('notes');
function setButtons() {
  bar.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', String(+b.dataset.f === cur)));
  const cb = bar.querySelector('[aria-current="true"]'); if (cb && cb.scrollIntoView) cb.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  const n = NOTES[ORDER[cur]];
  notesEl.innerHTML = n ? `<h2><b>${ORDER[cur]}</b> · ${esc(n.t)}</h2>` + n.p.map(p => `<p>${esc(p)}</p>`).join('') : '';
  if (!REVIEW) history.replaceState(null, '', '#' + ORDER[cur]);
}
function frameLoop() {
  raf = 0; if (!mode) return;
  if (mode.k === 'trans') {
    const t = clamp((now() - mode.t0) / (D * 1000));
    draw(transView(mode.a, mode.b, t, mode.c0, mode.runA));
    if (t >= 1) mode = entryRun(mode.a, mode.b) ? { k: 'still', f: mode.b, t0: now(), c0: 0, run: true } : { k: 'still', f: mode.b, t0: now(), c0: mode.c0 + D, run: false };
  } else draw(stillView(mode.f, clockOf(mode), mode.run));
  // slides without a loop: once their run has settled there is nothing left to animate
  const F = FRAMES[mode.f];
  const idle = mode.k === 'still' && F.still && (!mode.run || clockOf(mode) > 7.5);
  if (!idle && !RM.matches) raf = requestAnimationFrame(frameLoop);
}
const kick = () => { if (!raf) raf = requestAnimationFrame(frameLoop); };
const currentClock = () => mode ? (mode.k === 'trans' ? mode.c0 + D : clockOf(mode)) : TFINAL(ORDER[cur]);
function crossfade(then) {      // reduced motion: snapshot the old slide, fade it out, fade the new one in
  const g = document.createElement('div'); g.id = 'ghost';
  g.innerHTML = `<svg class="layer" viewBox="0 0 1600 900" width="1600" height="900">${lastSVG}</svg>`;
  const c2 = document.createElement('canvas'); c2.className = 'layer'; c2.width = cv.width; c2.height = cv.height; c2.getContext('2d').drawImage(cv, 0, 0); g.appendChild(c2);
  g.style.transform = stage.style.transform; wrap.appendChild(g);
  stage.classList.remove('on'); stage.classList.add('fadein');
  then();
  requestAnimationFrame(() => requestAnimationFrame(() => { g.classList.add('out'); stage.classList.add('on'); }));
  setTimeout(() => { g.remove(); stage.classList.remove('fadein', 'on'); }, 400);
}
function go(i, how) {
  i = clamp(i, 0, ORDER.length - 1);
  const prev = ORDER[cur], next = ORDER[i];
  if (RM.matches) {
    cur = i; setButtons();
    crossfade(() => { mode = { k: 'still', f: next, t0: now(), c0: TFINAL(next), run: false }; draw(stillView(next, TFINAL(next), false)); });
    return;
  }
  if (how === 'run') { cur = i; setButtons(); mode = { k: 'still', f: next, t0: now(), c0: 0, run: true }; kick(); return; }
  const c0 = currentClock(), runA = mode && mode.k === 'still' ? mode.run : false;
  cur = i; setButtons();
  mode = { k: 'trans', a: prev, b: next, t0: now(), c0, runA };
  kick();
}
function step(d) {
  const j = clamp(cur + d, 0, ORDER.length - 1); if (j === cur) return;
  if (mode && mode.k === 'trans') mode = { k: 'still', f: mode.b, t0: now(), c0: mode.c0 + D, run: false };
  go(j, 'trans');
}
function replay() {
  if (cur === 0 || RM.matches) { go(cur, 'run'); return; }
  mode = { k: 'trans', a: ORDER[cur - 1], b: ORDER[cur], t0: now(), c0: TFINAL(ORDER[cur - 1]), runA: false }; kick();
}
function toggleNotes() {
  document.body.classList.toggle('notes-on');
  document.getElementById('nbtn').setAttribute('aria-pressed', String(document.body.classList.contains('notes-on')));
  fit(); lastSVG = ''; if (mode && mode.k === 'still') draw(stillView(mode.f, clockOf(mode), mode.run)); kick();
}
async function fontsReady() {
  try {
    await Promise.race([
      Promise.all(['800 46px Archivo', '700 20px Archivo', '500 15px Archivo', 'italic 500 16px Archivo'].map(f => document.fonts.load(f))
        .concat([document.fonts.load('700 16px "Golos Text"', 'лв')])),
      new Promise(r => setTimeout(r, 2500)),
    ]);
  } catch (e) { /* the fallback stack still renders */ }
}
function drawReview() {
  if (qFrom && FRAMES[qFrom] && qT != null) draw(transView(qFrom, qF, clamp(parseFloat(qT) || 0), TFINAL(qFrom), false));
  else draw(stillView(qF, TFINAL(qF), false));
}
window.addEventListener('resize', () => {
  fit(); lastSVG = '';
  if (REVIEW) drawReview(); else if (mode) { if (mode.k === 'still') draw(stillView(mode.f, clockOf(mode), mode.run)); kick(); }
});
(async function init() {
  if (REVIEW) document.body.classList.add('review');
  bar.innerHTML = ORDER.map((id, i) => `<button data-f="${i}" title="${esc(NOTES[id] ? NOTES[id].t : id)}">${id}</button>`).join('');
  fit();
  await fontsReady();
  lastSVG = '';
  if (REVIEW) { drawReview(); window.__ready = true; return; }
  setButtons();
  bar.querySelectorAll('button').forEach(b => b.addEventListener('click', ev => {
    ev.stopPropagation(); const i = +b.dataset.f;
    if (i !== cur) go(i, Math.abs(i - cur) === 1 ? 'trans' : 'run');
  }));
  document.getElementById('replay').addEventListener('click', ev => { ev.stopPropagation(); replay(); });
  document.getElementById('nbtn').addEventListener('click', ev => { ev.stopPropagation(); toggleNotes(); });
  stage.addEventListener('click', () => step(1));
  window.addEventListener('keydown', ev => {
    if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
    if (['ArrowRight', 'PageDown', ' ', 'Spacebar'].includes(ev.key)) { ev.preventDefault(); step(1); }
    else if (['ArrowLeft', 'PageUp'].includes(ev.key)) { ev.preventDefault(); step(-1); }
    else if (ev.key === 'n' || ev.key === 'N') { ev.preventDefault(); toggleNotes(); }
    else if (ev.key === 'Home') { ev.preventDefault(); go(0, 'run'); }
  });
  if (RM.matches) { mode = { k: 'still', f: ORDER[cur], t0: now(), c0: TFINAL(ORDER[cur]), run: false }; draw(stillView(ORDER[cur], TFINAL(ORDER[cur]), false)); }
  else { mode = { k: 'still', f: ORDER[cur], t0: now(), c0: 0, run: true }; kick(); }
  window.__ready = true;
})();
</script>
