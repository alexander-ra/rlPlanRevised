<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-Agent AI for Complex Problem Solving</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&family=Golos+Text:wght@400..700&display=swap">
<style>
  :root { --page:#d5dce2; --stage:#f4f6f7; --ink:#14202b; --ink2:#3b4855; --barbg:#e8ecef; --barline:#c3ccd4; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--page); }
  body { display:flex; flex-direction:column; color:var(--ink);
         font-family:Archivo, "Golos Text", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; }
  #wrap { flex:1; min-height:0; position:relative; overflow:hidden; }
  #stage, #ghost { position:absolute; left:0; top:0; width:1600px; height:900px; transform-origin:0 0; background:var(--stage); }
  #stage { box-shadow:0 1px 3px rgba(20,32,43,.12), 0 8px 30px rgba(20,32,43,.08); cursor:pointer; }
  #ghost { pointer-events:none; opacity:1; transition:opacity .16s linear; }
  #ghost.out { opacity:0; }
  #stage.fadein .layer { opacity:0; }
  #stage.fadein.on .layer { opacity:1; transition:opacity .18s linear .14s; }
  svg.layer, canvas.layer { position:absolute; left:0; top:0; width:1600px; height:900px; display:block; }
  svg text { font-family:Archivo, "Golos Text", "Arial Narrow", "Helvetica Neue", Arial, sans-serif; font-kerning:normal;
             font-variant-numeric:tabular-nums; }
  #bar { flex:none; height:40px; display:flex; align-items:center; gap:6px; padding:0 8px; background:var(--barbg);
         border-top:1px solid var(--barline); font-size:13px; white-space:nowrap; }
  #fbtns { display:flex; gap:3px; overflow-x:auto; scrollbar-width:thin; min-width:0; flex:1 1 auto; padding:2px 0; }
  #bar button { font:inherit; font-weight:700; font-stretch:90%; color:var(--ink); background:#fff; border:1px solid #b3bec8;
                border-radius:6px; padding:3px 7px; cursor:pointer; line-height:1.25; flex:none; }
  #bar button:hover { background:#f2f5f7; }
  #bar button[aria-current="true"] { background:var(--ink); color:#fff; border-color:var(--ink); }
  #bar button[aria-pressed="true"] { background:#dfe6ec; }
  #bar button:focus-visible { outline:2px solid #2563b0; outline-offset:1px; }
  #bar .sep { width:1px; height:20px; background:var(--barline); flex:none; }
  #notes { display:none; flex:none; max-height:30vh; overflow:auto; background:#fbfcfc; border-top:1px solid var(--barline);
           padding:10px 18px 12px; font:16px/1.5 "Golos Text", Archivo, Arial, sans-serif; color:var(--ink); }
  #notes h2 { margin:0 0 6px; font:600 14px/1.3 Archivo, Arial, sans-serif; color:var(--ink2); letter-spacing:.02em; }
  #notes p { margin:0 0 8px; max-width:110ch; }
  body.notes-on #notes { display:block; }
  body.review #bar, body.review #notes { display:none !important; }
  body.review #stage { box-shadow:none; cursor:default; }
  @media (max-width:900px) { #bar { height:36px; } #bar button { padding:2px 5px; } #notes { font-size:14px; } }
</style>
</head>

  </div>
</div>

</nav>

    ctx.beginPath(); ctx.moveTo(p[0], p[1]); for (let k = 2; k < p.length; k += 2) ctx.lineTo(p[k], p[k + 1]); ctx.stroke();
  }
  for (const d of view.dots) {
    if (d.a <= .01) continue;
    const a = clamp(d.a);
    if (d.pie != null) { drawPie(d, a); continue; }
    if (d.tail) {   // a short motion tail, so direction reads in a still frame
      ctx.globalAlpha = a * .3; ctx.strokeStyle = d.c; ctx.lineWidth = d.r * 1.3;
      ctx.beginPath(); ctx.moveTo(d.x, d.y); for (const [x, y] of d.tail) ctx.lineTo(x, y); ctx.stroke();
    }
    if (d.halo) { ctx.globalAlpha = a * d.halo; ctx.fillStyle = d.hc; ctx.beginPath(); ctx.arc(d.x, d.y, d.r + (d.hr || 8), 0, 6.2832); ctx.fill(); }
    ctx.globalAlpha = a; ctx.beginPath(); ctx.arc(d.x, d.y, d.ring ? d.r - 1.1 : d.r, 0, 6.2832);
    if (d.ring) { ctx.lineWidth = 2.4; ctx.strokeStyle = d.c; ctx.fillStyle = '#ffffff'; ctx.fill(); ctx.stroke(); }
    else { ctx.fillStyle = d.c; ctx.fill(); }
    if (d.lab) {   // a token with its amount written on it
      ctx.lineWidth = 2; ctx.strokeStyle = '#ffffff'; ctx.stroke();
      ctx.fillStyle = d.lc || '#ffffff'; ctx.font = `800 ${f1(d.r * .66)}px Archivo, "Golos Text", Arial, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(d.lab, d.x, d.y + d.r * .04);
    }
  }
  ctx.globalAlpha = 1;
}
function drawPie(d, a) {
  const R = d.r, c = d.c === C.dot ? C.ink : d.c;
  ctx.globalAlpha = a;
  ctx.beginPath(); ctx.arc(d.x, d.y, R, 0, 6.2832); ctx.fillStyle = d.done ? c : '#ffffff'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = c; ctx.stroke();
  if (d.done) {
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2.4; ctx.beginPath();
    if (c === C.bad) { const k = R * .38; ctx.moveTo(d.x - k, d.y - k); ctx.lineTo(d.x + k, d.y + k); ctx.moveTo(d.x + k, d.y - k); ctx.lineTo(d.x - k, d.y + k); }
    else { ctx.moveTo(d.x - R * .45, d.y + R * .02); ctx.lineTo(d.x - R * .1, d.y + R * .36); ctx.lineTo(d.x + R * .48, d.y - R * .32); }
    ctx.stroke(); return;
  }
  if (d.pie > .001) { ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.arc(d.x, d.y, R - 3, -Math.PI / 2, -Math.PI / 2 + 6.2832 * Math.min(1, d.pie)); ctx.closePath(); ctx.fillStyle = c; ctx.fill(); }
}

const NOTES = {"F1": {"t": "Title", "p": ["Здравейте. Аз съм Александър Андреев, кандидат-докторант в Русенския университет „Ангел Кънчев“. Днес ще ви представя темата „Решаване на сложни проблеми с многоагентни системи: възможности и рискове“."]}, "F2": {"t": "One question, one answer", "p": ["Идеята е да ви покажа процеса нагледно, с диаграма, която постепенно се разширява. Вляво винаги стои въпросът или задачата на потребителя. Вдясно е крайният отговор на ИИ, с примерен шанс този отговор да е верен. По средата е работата, която ИИ извършва, а в горния десен ъгъл – приблизителното време от задаването на въпроса до отговора.", "Започваме с обикновен въпрос и директен отговор – така работеха първите масово разпространени езикови модели, като GPT-3.5 от ноември 2022 г. „Да шофирам ли, или да си хвана влака до София?“ Получаваме бърз, но непроверен отговор – синтез на всичко, което моделът е прочел по време на обучението си. Основният проблем е, че отговорът винаги звучи уверено, дори когато е напълно подвеждащ. Това е т.нар. „халюцинация“."]}, "F3": {"t": "A real task has many steps", "p": ["Ако конкретизираме въпроса – „Кое е по-евтино от Русе до София: с кола или с влак?“ – вече ни трябват конкретни данни. За да даде смислен отговор, ИИ разбива въпроса на няколко последователни подвъпроса и така увеличава шанса за верен отговор. Езиковите модели започнаха да правят това сами около средата на 2023 г.", "Грешка дори в една от стъпките обаче най-вероятно води до грешен отговор. Ако всяка от петте стъпки е вярна с 95%, целият отговор е верен само в 77% от случаите. В реалността стъпките, разбира се, имат различен шанс, но идеята е ясна: дори когато всяка стъпка е вярна с над 90%, шансът за верен краен резултат пада рязко, колкото по-голяма е задачата. Под диаграмата виждате шанса за успех при 5, 10, 100 и 1000 стъпки.", "А времето: ако един въпрос отнема около 2 секунди, тук имаме пет такива – общо около 10 секунди."]}, "F4": {"t": "Thinking before each step", "p": ["За да подобрим шанса на всяка отделна стъпка, можем да оставим модела да „мисли“. Всичко започна с прости инструкции – „помисли задълбочено и обясни отговора си стъпка по стъпка“. Резултатите бяха толкова добри, че компаниите вградиха мисленето в самото обучение на моделите. Първите такива модели бяха OpenAI o1 (септември 2024 г.) и DeepSeek R1 (януари 2025 г.). Вместо направо да „изплюят“ отговора, те водят вътрешен диалог със себе си и търсят обосновка за всяко свое заключение. При 98% за стъпка петте стъпки вече дават 90%, но редът отдолу показва, че при хиляда стъпки и това не стига."]}, "F5a": {"t": "Tools and a check", "p": ["Друг начин да увеличим шанса за успех са инструментите и автоматичните проверки. Когато една стъпка се изпълни с инструмент, например калкулатор или програмен скрипт, шансът за грешка в нея пада до нула – на слайда изчислението на двата разхода вече е точно. За останалите стъпки добавяме проверка, която изрично търси доказателства за всяко заключение. В примера тя открива грешка в цената на билета: взета е от страница от 2025 г. и е в лева, а от януари плащаме в евро."]}, "F5b": {"t": "Redo, with the reason", "p": ["Проверката връща не просто „грешно“, а и причината – затова вторият опит е различен и търси актуалната цена в евро. Възможността да се върнем и да поправим грешката носи много по-голям шанс за успех: тук всяка проверена стъпка е вярна с 99,99% и дори при хиляда стъпки шансът остава около 90%.", "Минусът е цената. Писането на скриптове и многократното минаване през всяка стъпка удължават изчисленията, а някои проверки, дори автоматизирани, отнемат много време. Ако трябваше да проверим резултат от биологично изследване, това нямаше да са минути, а дни – но понякога това е единственият начин да сме сигурни в резултата."]}, "F7a": {"t": "An open question takes many more steps", "p": ["Ако направим въпроса по-„отворен“ – как най-евтино да стигнем до София в рамките на 24 часа – има по-голям шанс да открием решение, което изобщо не сме предвидили. Така можем да проверим различни варианти, а някои от тях отпадат чак докато задачата се решава. Такива системи се появиха в края на 2024 г. с Deep Research на Google, последван от Deep Research на OpenAI през февруари 2025 г. Минусът остава същият: времето за отговор рязко нараства – тук до около два часа. Затова и компаниите промениха начина, по който ги предлагат: вместо чат с активна дискусия, това е процес, който стартирате и получавате резултата след известно време."]}, "F7b": {"t": "Copies take the options in parallel", "p": ["Ако същият процес се раздели на няколко паралелни нишки, стигаме до същия резултат за много по-кратко време – около 25 минути вместо два часа. Всяка нишка е агент: същият модел, със собствена работна памет, пуснат за една задача. Необходимите ресурси обаче нарастват, защото освен стъпките, които иначе бихме изпълнили последователно, имаме и агент-„диригент“, който разпределя работата, следи останалите и ги изчаква."]}, "F7c": {"t": "Copies split again, stop early, report back", "p": ["Това, че има диригент, не означава, че един агент се грижи за всички останали. Тук всеки начин на придвижване се разделя допълнително според нуждите си: колата проверява два пътя – през Плевен и през Велико Търново, а влакът – директна връзка и връзка с прекачване. Йерархията обаче се запазва: обикновено всички подпроцеси трябва да приключат, за да може този, който ги е създал, да продължи. В случая това, че не можем да пътуваме с колело заради бурята, не зависи от останалите. Но ако подпроцесите са свързани и задължителни, провалът на един от тях може да накара диригента да спре всички останали и да преосмисли подхода си."]}, "F8": {"t": "Where splitting helps, and where it hurts", "p": ["Не всяка задача печели от разделяне на паралелни нишки. Търсенето в различни източници в интернет е отличен пример за ускорение без загуба на качество: няма нужда да зареждаме и „четем“ източниците един по един – може наведнъж.", "В другата крайност е писането на роман. Ако пишем всички глави едновременно, резултатът ще е катастрофален – не можем да пишем заключението по същото време като увода. Несъответствията в текста са неизбежни.", "Повечето задачи са някъде по средата, като програмирането: отделни поправки се делят лесно, но две копия, които пишат една и съща функционалност, трябва постоянно да се съгласуват. Въпросът, който трябва да си зададем, е дали значително по-краткото време си струва риска от неуспех."]}, "N1": {"t": "A real-scale job: 100 people to this conference", "p": ["Досега задачата – да намерим един превоз от точка А до точка Б – се ускоряваше значително с езикови модели, но все пак беше по силите на един човек за един работен ден. През последните месеци успехите на ИИ позволиха мащабът на проблемите да нарасне рязко. В новия пример не търсим превоз за един човек: искаме да доведем и настаним 100 гости от 15 държави в нашия град за конференция, с бюджет под 30 000 евро. Работа, която би отнела на екип от хора около три седмици, може да се свърши за един ден – стига външният свят да отговаря бързо с потвърждения за резервации, билети и т.н.", "Повечето сложни системи имат йерархия от възложители и изпълнители, общо място, където споделят междинните резултати, и начин да комуникират и да следят напредъка. Тук задачата е разделена на три части: как да придвижим гостите до града, как да ги настаним подобаващо и как да потвърдим, че всичко това е подходящо за всеки един от тях."]}, "N2": {"t": "Acting in the world, through two doors", "p": ["В такива сложни процеси е наивно да мислим, че най-добрият резултат може да се постигне без човешка намеса по време на изпълнението. Системата действа навън само през две „врати“: само кореспонденцията пише на хора и само агентите за плащания могат да плащат. Затова сме сложили и ограничение на плащанията: всичко под 500 евро агентът за плащания изпълнява сам, а по-големите суми чакат, докато отговорникът за организацията изрично ги одобри."]}, "N3": {"t": "Day 9: a flight is cancelled", "p": ["Реалният свят, разбира се, не е перфектен. Дори основната задача да е свършена за ден, трябват „дежурни“ агенти, които следят за промени и ги отразяват – в реално време или периодично. В примера авиокомпанията отменя полет, който засяга десет от нашите гости. Това може да се реши автоматично, но може и отново да изисква човешка намеса – тук допълнителните 1850 евро чакат одобрение от организатора."]}, "F9": {"t": "Systems like ours are already at work", "p": ["Последната стъпка в тази част: за да покажем какво отключва съвременният ИИ, излизаме от нашите примери и поглеждаме как подобни структури се използват за откриване на нови решения, за защита на критични системи и за ускоряване на научния и технологичния прогрес. Зад тях стоят както компании, така и университети, държавни институции и независими екипи.", "Нарочно не съм включил рекурсивното самоусъвършенстване на ИИ – идеята, че в даден момент ще бъде създадена многоагентна система, която сама подобрява работата си, а новата версия на свой ред създава още по-добра. Истината е, че в големите компании за ИИ прогресът наистина е зашеметяващ и голяма част от работата на експертите им се автоматизира буквално всеки месец. Но тяхната работа, макар и непрекъснато променяща се, остава ключова за успеха им."]}, "R0": {"t": "Misalignment: what we say vs what we mean", "p": ["Време е да обърнем внимание и на рисковете, които носи тази автоматизация. За целта се връщаме към примера с настаняването на 100 гости. Досега приемахме, че системата прави това, което искаме. Но ние ѝ казахме само „най-евтино, под 30 000 евро“, а имахме предвид и „законно, честно и без да подвеждаш никого“. Проблемите започват точно в тази неизказана част."]}, "R4": {"t": "One wrong step is enough", "p": ["Първият пример показва нагледно това, което пресметнахме със степените в многостъпковия процес. Конференцията е на 24-ти, затова всички гости трябва да са настанени до края на 23-ти. Двете дати често се срещат в бележките на агентите и лесно се объркват – и датата на пристигане става 24-ти вместо 23-ти. Веднъж записана така в общия план, грешката предизвиква верижна реакция и от единичен случай засяга действията и на другите агенти. И то без никаква лоша умисъл."]}, "R1": {"t": "It games the guard, to be helpful", "p": ["Във втория пример системата отново няма лоша умисъл. Но за да ни помогне и да ускори процеса, като избегне чакането на човешко одобрение, тя заобикаля защитата, която изрично сме сложили. Предстои плащане от 600 евро – над лимита от 500. Системата го разделя на три плащания по 200 евро. Формално не е нарушила правило, но е очевидно, че е излязла от разрешените ѝ граници."]}, "R2": {"t": "It crosses a line in the world", "p": ["В третия пример нещата ескалират. Да приемем, че агентите за влаковете откриват бъг в системата за резервации и могат да запазят места за гостите, без да плащат. Това е неетично и незаконно, но на теория помага директно на възложителя – в бюджета остават повече пари за други разходи."]}, "R3": {"t": "It hides the problem", "p": ["Една стъпка по-нататък – и това е препратка към реален случай, който ще видим след малко – системата може да усети, че възложителят не би искал това. Но отново, за да му „помогне“ и да запази спестените пари, тя решава да го заблуди: макар да не е платила билетите, генерира фалшиви фактури за плащането им. Така възложителят има още по-малък шанс да разбере какво се случва и да се намеси."]}, "R6": {"t": "It has already happened", "p": ["Ще ви покажа два реални случая, за които вероятно повечето от вас са чували. И двата са станали в тестова среда, но последствията им са стигнали до реалния свят. Не е нарочно, че и двата са на OpenAI – и други компании са имали подобни случаи, но тези са най-известните.", "В първия случай група агенти, които дори не е трябвало да работят заедно, са тествани на много сложни задачи по киберсигурност в изолирани среди. Те намират пролука в изолацията си и начин да комуникират. Малко след това откриват как да заобиколят задачите и да подадат на оценителя фалшиви верни отговори. Подобно на фалшивите фактури от преди малко, те разбират, че действията им не са коректни и че оценителят рано или късно ще ги хване. Затова, според оставените следи, планират атака срещу Hugging Face – един от основните сайтове на общността по машинно обучение – за да подменят истинските отговори и да намалят шанса да бъдат разкрити. Случаят е изследван подробно от независими източници и силно ви препоръчвам да го прочетете.", "Вторият случай е подобен. Задачата е била проучване на лекарства за кожни заболявания. Понеже системата не намира достатъчно информация, тя получава непозволен достъп до медицинска система на австралийското правителство и изтегля вътрешни файлове и пароли – за да изпълни задачата по-пълно. Лични данни на граждани не са прочетени."]}, "R5a": {"t": "Who asks, and who answers", "p": ["Тези примери могат да се обобщят в три групи, според това какво искаме от системата. Първата група са добре описани задачи с ясни граници: дори неетична система в общия случай ще стигне до етичен резултат. Втората група са неясно поставени задачи – нарочно или от небрежност. Неетична система отново може да даде етичен резултат, но може и да престъпи етични или законови правила, само за да изпълни задачата – като плащането, разделено на три. Третата група са недобронамерени възложители, които използват уменията на ИИ, за да навредят умишлено или да се възползват от слабостите на други системи. Неетична система няма да направи разлика и ще изпълни поръчката въпреки последствията."]}, "END": {"t": "Thanks for your attention", "p": []}, "R5b": {"t": "With alignment, most of it is fixed", "p": ["Затова трябва да се погрижим системите за масово ползване да имат силни защитни механизми, които не могат да бъдат заобиколени. При първата група няма проблем – резултатът не би трябвало да се различава. При втората група, дори при неясно поставена задача, системата сама трябва да си поставя етични и законови граници и да постига целта си само с правилни действия. А умишлено вредните поръчки изобщо не трябва да се изпълняват – нещо повече, трябва да се анализират и да алармират отговорните органи, за да се предотвратяват подобни опити. С правилно съгласуване повечето от тези проблеми могат да бъдат решени. Благодаря ви за вниманието."]}};

/* =====================================================================
   Controller: navigation, review hooks, notes, reduced motion
   ===================================================================== */
const RM = window.matchMedia('(prefers-reduced-motion: reduce)');
const qF = URLQ.get('frame'), qFrom = URLQ.get('from'), qT = URLQ.get('t');
const REVIEW = !!(qF && FRAMES[qF]);
let cur = REVIEW ? ORDER.indexOf(qF) : Math.max(0, ORDER.indexOf((location.hash || '').slice(1)));
// mode: {k:'still', f, t0 (ms), c0 (clock at t0), run} or {k:'trans', a, b, t0, c0, runA}
let mode = null, raf = 0;
const now = () => performance.now();
const clockOf = md => md.c0 + (now() - md.t0) / 1000;
const bar = document.getElementById('fbtns'), notesEl = document.getElementById('notes');
function setButtons() {
  bar.querySelectorAll('button').forEach(b => b.setAttribute('aria-current', String(+b.dataset.f === cur)));
  const cb = bar.querySelector('[aria-current="true"]'); if (cb && cb.scrollIntoView) cb.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  const n = NOTES[ORDER[cur]];
  notesEl.innerHTML = n ? `<h2><b>${ORDER[cur]}</b> · ${esc(n.t)}</h2>` + n.p.map(p => `<p>${esc(p)}</p>`).join('') : '';
  if (!REVIEW) history.replaceState(null, '', '#' + ORDER[cur]);
}
const T0 = performance.now();
function frameLoop() {
  raf = 0; if (!mode) return;
  AMB = (now() - T0) / 1000;
  if (mode.k === 'trans') {
    const t = clamp((now() - mode.t0) / (D * 1000));
    draw(transView(mode.a, mode.b, t, mode.c0, mode.runA));
    if (t >= 1) mode = { k: 'still', f: mode.b, t0: now(), c0: 0, run: true };
  } else draw(stillView(mode.f, clockOf(mode), mode.run));
  // slides without a loop: once their run has settled there is nothing left to animate
  const F = FRAMES[mode.f];
  const idle = mode.k === 'still' && F.still && (!mode.run || clockOf(mode) > runLen(F));
  if (!idle && !RM.matches) raf = requestAnimationFrame(frameLoop);
}
const kick = () => { if (!raf) raf = requestAnimationFrame(frameLoop); };
const runLen = F => F.kind !== 'chain' ? 7.5 : (F._rl ??= (() => { const g = chainGeo(new Map(F.els.map(e => [e.id, e]))); return g.L ? runEnd(F.sem, g) + 3.2 : 1; })());
const currentClock = () => mode ? (mode.k === 'trans' ? mode.c0 + D : clockOf(mode)) : TFINAL(ORDER[cur]);
function crossfade(then) {      // reduced motion: snapshot the old slide, fade it out, fade the new one in
  const g = document.createElement('div'); g.id = 'ghost';
  g.innerHTML = `<svg class="layer" viewBox="0 0 1600 900" width="1600" height="900">${lastSVG}</svg>`;
  const c2 = document.createElement('canvas'); c2.className = 'layer'; c2.width = cv.width; c2.height = cv.height; c2.getContext('2d').drawImage(cv, 0, 0); g.appendChild(c2);
  g.style.transform = stage.style.transform; wrap.appendChild(g);
  stage.classList.remove('on'); stage.classList.add('fadein');
  then();
  requestAnimationFrame(() => requestAnimationFrame(() => { g.classList.add('out'); stage.classList.add('on'); }));
  setTimeout(() => { g.remove(); stage.classList.remove('fadein', 'on'); }, 400);
}
function go(i, how) {
  i = clamp(i, 0, ORDER.length - 1);
  const prev = ORDER[cur], next = ORDER[i];
  if (RM.matches) {
    cur = i; setButtons();
    crossfade(() => { mode = { k: 'still', f: next, t0: now(), c0: TFINAL(next), run: false }; draw(stillView(next, TFINAL(next), false)); });
    return;
  }
  if (how === 'run') { cur = i; setButtons(); mode = { k: 'still', f: next, t0: now(), c0: 0, run: true }; kick(); return; }
  const c0 = currentClock(), runA = mode && mode.k === 'still' ? mode.run : false;
  cur = i; setButtons();
  mode = { k: 'trans', a: prev, b: next, t0: now(), c0, runA };
  kick();
}
function step(d) {
  const j = clamp(cur + d, 0, ORDER.length - 1); if (j === cur) return;
  if (mode && mode.k === 'trans') mode = { k: 'still', f: mode.b, t0: now(), c0: 0, run: true };
  go(j, 'trans');
}
function replay() {
  if (cur === 0 || RM.matches) { go(cur, 'run'); return; }
  mode = { k: 'trans', a: ORDER[cur - 1], b: ORDER[cur], t0: now(), c0: TFINAL(ORDER[cur - 1]), runA: false }; kick();
}
function toggleNotes() {
  document.body.classList.toggle('notes-on');
  document.getElementById('nbtn').setAttribute('aria-pressed', String(document.body.classList.contains('notes-on')));
  fit(); lastSVG = ''; AMB = (now() - T0) / 1000; if (mode && mode.k === 'still') draw(stillView(mode.f, clockOf(mode), mode.run)); kick();
}
async function fontsReady() {
  try {
    await Promise.race([
      Promise.all(['800 46px Archivo', '700 20px Archivo', '500 15px Archivo', 'italic 500 16px Archivo'].map(f => document.fonts.load(f))
        .concat([document.fonts.load('700 16px "Golos Text"', 'лв')])),
      new Promise(r => setTimeout(r, 2500)),
    ]);
  } catch (e) { /* the fallback stack still renders */ }
}
function drawReview() {
  if (qFrom && FRAMES[qFrom] && qT != null) { AMB = TFINAL(qFrom) + clamp(parseFloat(qT) || 0) * D; draw(transView(qFrom, qF, clamp(parseFloat(qT) || 0), TFINAL(qFrom), false)); }
  else if (URLQ.get('clock') != null) { AMB = +URLQ.get('clock'); draw(stillView(qF, +URLQ.get('clock'), true)); }
  else { AMB = TFINAL(qF); draw(stillView(qF, TFINAL(qF), false)); }
}
window.addEventListener('resize', () => {
  fit(); lastSVG = '';
  if (REVIEW) drawReview(); else if (mode) { if (mode.k === 'still') draw(stillView(mode.f, clockOf(mode), mode.run)); kick(); }
});
(async function init() {
  if (REVIEW) document.body.classList.add('review');
  bar.innerHTML = ORDER.map((id, i) => `<button data-f="${i}" title="${esc(NOTES[id] ? NOTES[id].t : id)}">${id}</button>`).join('');
  fit();
  await fontsReady();
  lastSVG = '';
  if (REVIEW) { drawReview(); window.__ready = true; return; }
  setButtons();
  bar.querySelectorAll('button').forEach(b => b.addEventListener('click', ev => {
    ev.stopPropagation(); const i = +b.dataset.f;
    if (i !== cur) go(i, Math.abs(i - cur) === 1 ? 'trans' : 'run');
  }));
  document.getElementById('replay').addEventListener('click', ev => { ev.stopPropagation(); replay(); });
  document.getElementById('nbtn').addEventListener('click', ev => { ev.stopPropagation(); toggleNotes(); });
  stage.addEventListener('click', () => step(1));
  window.addEventListener('keydown', ev => {
    if (ev.altKey || ev.ctrlKey || ev.metaKey) return;
    if (['ArrowRight', 'PageDown', ' ', 'Spacebar'].includes(ev.key)) { ev.preventDefault(); step(1); }
    else if (['ArrowLeft', 'PageUp'].includes(ev.key)) { ev.preventDefault(); step(-1); }
    else if (ev.key === 'n' || ev.key === 'N') { ev.preventDefault(); toggleNotes(); }
    else if (ev.key === 'Home') { ev.preventDefault(); go(0, 'run'); }
  });
  if (RM.matches) { mode = { k: 'still', f: ORDER[cur], t0: now(), c0: TFINAL(ORDER[cur]), run: false }; draw(stillView(ORDER[cur], TFINAL(ORDER[cur]), false)); }
  else { mode = { k: 'still', f: ORDER[cur], t0: now(), c0: 0, run: true }; kick(); }
  window.__ready = true;
})();
</script>
