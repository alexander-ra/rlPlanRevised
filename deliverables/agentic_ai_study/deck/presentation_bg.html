<style>:root{--page:#d5dce2;--stage:#ffffff;--ink:#14202b;--ink2:#3b4855;--barbg:#e8ecef;--barline:#c3ccd4;--notebg:#f6f8f9;--field:#c9d2da;--btnline:#b3bec8;--hover:#f2f5f7;--rowline:#e6eaed;--focus:#2563b0;--bad:#b42318;--good:#1d7344;color-scheme:light}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:var(--page)}body{display:flex;flex-direction:column;color:var(--ink);font-family:Roboto Flex,Golos Text,Arial Narrow,Arial,sans-serif}#wrap{flex:1;min-height:0;position:relative;overflow:hidden}#stage,#ghost{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;background:var(--stage)}#stage{box-shadow:0 1px 3px #14202b1f,0 8px 30px #14202b14;cursor:pointer}#ghost{pointer-events:none;opacity:1;transition:opacity .16s linear}#ghost.out,#stage.fadein .layer{opacity:0}#stage.fadein.on .layer{opacity:1;transition:opacity .18s linear .14s}svg.layer,canvas.layer{position:absolute;left:0;top:0;width:1600px;height:900px;display:block}svg text{font-family:Roboto Flex,Golos Text,Arial Narrow,Arial,sans-serif;font-kerning:normal;font-variant-numeric:tabular-nums}#bar{flex:none;height:40px;display:flex;align-items:center;gap:6px;padding:0 8px;background:var(--barbg);border-top:1px solid var(--barline);font-size:13px;white-space:nowrap}#fbtns{display:flex;gap:3px;overflow-x:auto;scrollbar-width:thin;min-width:0;flex:1 1 auto;padding:2px 0}#bar button{font:inherit;font-weight:700;font-stretch:90%;color:var(--ink);background:#fff;border:1px solid #b3bec8;border-radius:6px;padding:3px 7px;cursor:pointer;line-height:1.25;flex:none}#bar button:hover{background:#f2f5f7}#bar button[aria-current=true]{background:var(--ink);color:#fff;border-color:var(--ink)}#bar button[aria-pressed=true]{background:#dfe6ec}#bar button:focus-visible{outline:2px solid #2563b0;outline-offset:1px}#bar .sep{width:1px;height:20px;background:var(--barline);flex:none}[hidden]{display:none!important}#main{flex:1;min-height:0;display:flex}#main #wrap{min-width:0}#notes{display:none;flex:none;width:clamp(320px,30vw,560px);min-height:0;flex-direction:column;gap:8px;background:var(--notebg);border-left:1px solid var(--barline);padding:12px 14px 10px;color:var(--ink);font-family:Roboto Flex,Golos Text,Arial,sans-serif}body.notes-on #notes{display:flex}#nhead{margin:0;display:flex;gap:8px;align-items:baseline;font:600 14px/1.3 Roboto Flex,Arial,sans-serif;color:var(--ink2);letter-spacing:.02em}#nhead b{color:var(--ink)}#ntitle{flex:1;min-width:0}#npos{flex:none;font-weight:500;font-variant-numeric:tabular-nums}#ntext{flex:1;min-height:0;width:100%;resize:none;margin:0;padding:10px 12px;border:1px solid var(--field);border-radius:6px;background:var(--stage);color:var(--ink);font:17px/1.5 Roboto Flex,Golos Text,Arial,sans-serif}#ntext:focus{outline:2px solid var(--focus);outline-offset:-1px;border-color:transparent}#nfoot{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2);min-height:28px}#nstat{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#nstat.warn{color:var(--bad)}.btn{font:inherit;font-weight:700;font-stretch:90%;color:var(--ink);background:var(--stage);border:1px solid var(--btnline);border-radius:6px;padding:3px 8px;cursor:pointer;line-height:1.25;flex:none}.btn:hover{background:var(--hover)}.btn:focus-visible{outline:2px solid var(--focus);outline-offset:1px}#rec{display:flex;align-items:center;gap:5px;flex:none;font-variant-numeric:tabular-nums;color:var(--ink2)}#rec b{color:var(--ink)}#rec .dot{width:9px;height:9px;border-radius:50%;background:var(--bad);animation:blink 1.2s steps(2,jump-none) infinite}#recS.late{color:var(--bad)}#recR{color:var(--ink2)}@keyframes blink{50%{opacity:.25}}#rbtn{color:var(--bad)}#toast{position:fixed;left:50%;bottom:52px;transform:translate(-50%);max-width:min(640px,calc(100% - 32px));background:var(--ink);color:var(--stage);padding:8px 14px;border-radius:8px;font-size:14px;line-height:1.4;box-shadow:0 4px 18px #14202b40;z-index:5}#result{position:fixed;inset:0;z-index:10;background:#14202b6b;display:flex;justify-content:center;align-items:flex-start;padding:24px max(16px,env(safe-area-inset-left,0px)) 24px;overflow:auto}#rpanel{width:min(980px,100%);background:var(--stage);color:var(--ink);border-radius:10px;padding:20px 22px 22px;box-shadow:0 10px 40px #14202b4d;display:grid;gap:14px;font-family:Roboto Flex,Golos Text,Arial,sans-serif}#rpanel h2{margin:0;font:800 22px/1.2 Roboto Flex,Arial,sans-serif}#rtop{display:flex;gap:12px;align-items:center;flex-wrap:wrap}#rtop h2{flex:1;min-width:0}#rnote{margin:0;color:var(--ink2);font-size:14px}#rlist{display:flex;gap:6px;flex-wrap:wrap}#rlist .btn[aria-pressed=true]{background:var(--ink);color:var(--stage);border-color:var(--ink)}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.stat{border:1px solid var(--barline);border-radius:8px;padding:10px 12px;display:grid;gap:2px}.stat .k{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}.stat .v{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}.stat .d{font-size:13px;color:var(--ink2)}#rcmp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--ink2)}#rcmp select{font:inherit;color:var(--ink);background:var(--stage);border:1px solid var(--btnline);border-radius:6px;padding:3px 6px}.tw{overflow-x:auto}#rpanel table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}#rpanel th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);border-bottom:1px solid var(--barline);padding:4px 8px;white-space:nowrap}#rpanel td{border-bottom:1px solid var(--rowline);padding:5px 8px;vertical-align:middle}#rpanel .num{text-align:right;white-space:nowrap}#rpanel .over{color:var(--bad);font-weight:700}#rpanel .under{color:var(--good);font-weight:700}#rpanel .even,#rpanel .none{color:var(--ink2)}.track{position:relative;height:10px;min-width:140px;background:var(--barbg);border-radius:5px}.track .bar{position:absolute;left:0;top:0;bottom:0;background:var(--ink2);border-radius:5px}.track .ref{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--bad)}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}.legend i{display:inline-block;width:14px;height:8px;border-radius:4px;background:var(--ink2);margin-right:5px;vertical-align:middle}.legend i.r{width:2px;height:12px;border-radius:0;background:var(--bad)}#ract{display:flex;gap:8px;flex-wrap:wrap}#rjson{width:100%;height:120px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace}body.review #bar,body.review #notes,body.review #result,body.review #toast{display:none!important}body.review #stage{box-shadow:none;cursor:default}body.present{--page:#000}body.present #bar,body.present #notes,body.present #toast{display:none!important}body.present #stage{box-shadow:none}body.present.idle,body.present.idle #stage{cursor:none}#black{position:fixed;inset:0;z-index:30;background:#000;cursor:none}@media (prefers-reduced-motion: reduce){#rec .dot{animation:none}}@media (max-width:900px){#bar{height:36px}#bar button{padding:2px 5px}#main{flex-direction:column}#notes{width:auto;height:38vh;border-left:0;border-top:1px solid var(--barline)}#ntext{font-size:15px}}</style>
