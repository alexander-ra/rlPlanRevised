<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lofi Storyboard</title>
<style>
  :root { --bg:#f4f4f1; --ink:#1f2a33; --muted:#5b6670; --card:#fff; --line:#d9dcd8; --ok:#2e7d4f; --warn:#b5651d;
          --rec:#d64535; --series:#2f7d74; --bar-late:#f0a35e; }
  [hidden] { display:none !important; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui, Arial, sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--line);
           display:flex; flex-wrap:wrap; gap:12px 20px; align-items:center; padding:12px 20px; }
  header h1 { font-size:18px; margin:0; }
  header .meta { color:var(--muted); }
  button { font:inherit; padding:6px 14px; border:1px solid #9aa5ae; background:#fff; border-radius:6px; cursor:pointer; }
  button:hover { background:#eef1f0; }
  #grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(min(100%, 460px), 1fr)); gap:18px; padding:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .card svg { display:block; width:100%; height:auto; background:#fafaf7; border-bottom:1px solid var(--line); cursor:pointer; }
  .card .body { padding:10px 14px 14px; }
  .card .tag { font-size:12px; color:var(--muted); letter-spacing:.02em; }
  .card h3 { margin:2px 0 6px; font-size:16px; }
  .card p { margin:0 0 8px; }
  .src { margin:0; padding-left:0; list-style:none; font-size:13px; color:var(--muted); }
  .src li.bad { color:var(--warn); font-weight:600; }
  .also { margin:10px 0 2px; font-size:13px; font-weight:600; color:var(--ink); }
  #notes .also { color:#e8ecef; }
  #play { position:fixed; inset:0; background:#2a2f33; display:none; flex-direction:column; z-index:10; }
  #play.on { display:flex; }
  #stageWrap { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:12px; }
  #stage { width:100%; height:100%; }
  #bar { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; padding:8px 16px; color:#e8ecef; background:#1d2124; }
  #bar button { background:#33393e; color:#e8ecef; border-color:#4a5258; }
  #notes { display:none; background:#1d2124; color:#d8dde1; padding:0 16px 12px; font-size:15px; }
  #notes.on { display:block; }
  #notes .src li { color:#aab3ba; } #notes .src li.bad { color:#f0a35e; }
  button:focus-visible { outline:2px solid var(--series); outline-offset:2px; }
  /* rehearsal: the recording strip in the play bar, and the timings sheet */
  #rec { display:flex; align-items:center; gap:8px; font-variant-numeric:tabular-nums; }
  #rec .dot { width:10px; height:10px; border-radius:50%; background:var(--rec); animation:blink 1.4s steps(2,start) infinite; }
  @keyframes blink { to { visibility:hidden; } }
  @media (prefers-reduced-motion: reduce) { #rec .dot { animation:none; } }
  #rec .late { color:var(--bar-late); }
  #flash { font-weight:600; }
  #bar #btnFinish { border-color:var(--rec); }
  #runs { position:fixed; inset:0; z-index:20; overflow:auto; background:var(--bg); color:var(--ink); padding-block:20px 48px;
          padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
  #runs .wrap { max-width:1040px; margin:0 auto; }
  #runs .wrap, #runView { display:grid; grid-template-columns:minmax(0,1fr); gap:18px; }   /* minmax(0,…) lets wide tables scroll inside .tw */
  #runs .top { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:baseline; }
  #runs h2 { margin:0; font-size:22px; text-wrap:balance; }
  #runs h3 { margin:0 0 8px; font-size:15px; }
  #runs .top button { margin-left:auto; }
  #runList { display:flex; flex-wrap:wrap; gap:8px; }
  #runList button[aria-pressed="true"] { background:var(--ink); color:var(--card); border-color:var(--ink); }
  .stats { display:flex; flex-wrap:wrap; gap:12px 32px; }
  .stat .k { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .stat .v { font-size:26px; font-weight:700; }
  .stat .d { font-size:13px; color:var(--muted); }
  .tw { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  .tw table { border-collapse:collapse; width:100%; min-width:680px; font-variant-numeric:tabular-nums; }
  .tw th, .tw td { text-align:left; padding:7px 12px; border-bottom:1px solid var(--line); font-size:14px; vertical-align:middle; }
  .tw th { font-size:12px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
  .tw .num { text-align:right; white-space:nowrap; }
  .tw tr:last-child td { border-bottom:0; }
  .over { color:var(--warn); font-weight:600; } .under { color:var(--ok); font-weight:600; } .even { color:var(--muted); }
  .track { position:relative; height:14px; min-width:180px; }
  .track .bar { position:absolute; left:0; top:3px; height:8px; border-radius:0 4px 4px 0; background:var(--series); }
  .track .plan { position:absolute; top:0; width:2px; height:14px; background:var(--ink); }
  .legend { display:flex; flex-wrap:wrap; gap:6px 18px; font-size:13px; color:var(--muted); align-items:center; }
  .legend i { display:inline-block; vertical-align:middle; margin-right:6px; }
  .legend .lb { width:18px; height:8px; background:var(--series); border-radius:0 4px 4px 0; }
  .legend .lp { width:2px; height:14px; background:var(--ink); }
  .actions { display:flex; flex-wrap:wrap; gap:8px; }
  #runJson { width:100%; height:140px; font:12px/1.4 ui-monospace, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="m-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#6b7782"/></marker>
    <marker id="m-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#9aa5ae"/></marker>
    <marker id="m-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#7c62b5"/></marker>
    <marker id="m-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#c0392b"/></marker>
    <marker id="m-manip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#d9822b"/></marker>
    <marker id="m-evade" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#8e44ad"/></marker>
    <marker id="m-talk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#b0457e"/></marker>
    <marker id="m-good" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#2e7d4f"/></marker>
  </defs>
</svg>

<header>
  <h1 id="setTitle">Lofi storyboard · Multi-agent talk (musts only)</h1>
  <span class="meta" id="total"></span>
  <button id="btnPlay">▶ Play (morph)</button>
  <button id="btnRehearse">● Rehearse (timed)</button>
  <button id="btnRuns">Rehearsals</button>
  <span class="meta">Click a frame to play from it · ← → step · N notes · Esc back · ✅ in our sources · ⚠ unconfirmed</span>
  <span id="flash" role="status"></span>
</header>
<main id="grid"></main>

<div id="play">
  <div id="stageWrap"><svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet"></svg></div>
  <div id="bar">
    <button id="prev">←</button><button id="next">→</button>
    <span id="pos"></span>
    <span id="rec" hidden><span class="dot" aria-hidden="true"></span>REC <b id="recTotal">0:00</b> · this frame
      <b id="recFrame">0:00</b> of <span id="recPlan">0:00</span></span>
    <button id="btnNotes">Notes</button>
    <button id="btnFull">Full screen</button>
    <button id="btnFinish" hidden>■ Finish</button>
    <button id="btnGrid">Storyboard</button>
  </div>
  <div id="notes"></div>
</div>

<section id="runs" hidden aria-label="Rehearsal timings">
  <div class="wrap">
    <div class="top"><h2>Rehearsal timings</h2><span class="meta" id="runsWhere"></span><button id="btnRunsClose">Back to storyboard</button></div>
    <div id="runList"></div>
    <div id="runView"></div>
  </div>
</section>

<script>
/* ---------- element builders ---------- */
const B=(id,x,y,w,h,label,o={})=>({id,t:'box',x,y,w,h,label,...o});
const R=(id,x,y,w,h,label,o={})=>B(id,x,y,w,h,label,{k:'region',...o});
const N=(id,x,y,o={})=>({id,t:'box',k:'node',x,y,w:28,h:28,label:'',...o});
const T=(id,x,y,label,o={})=>({id,t:'text',x,y,w:0,h:0,label,size:22,...o});
const A=(from,to,o={})=>({id:'a:'+from+'>'+to,t:'arrow',from,to,...o});
const head=(title,cap,clock)=>{const r=[];
  if(title) r.push(T('ttl',60,84,title,{size:40,weight:700}));
  if(cap) r.push(T('cap',60,872,cap,{size:20,color:'#55606a'}));
  if(clock) r.push(B('clock',1350,26,210,60,clock,{k:'clock',fs:22}));
  return r;};
const chainArrows=ids=>ids.slice(0,-1).map((id,i)=>A(id,ids[i+1]));
const mod=(els,id,props)=>els.map(e=>e.id===id?{...e,...props}:e);
// F2 asks the everyday question; F3–F5 narrow it to the one a chain of steps can answer.
const ASK_EVERYDAY='Should I drive or take\nthe train to Sofia?';
const ASK_COST='Which is cheaper from\nRuse to Sofia — driving\nor taking the train?';
// F4 adds the instruction that asks for reasoning; **…** marks a sub line drawn bold.
const ASK_THINK=ASK_COST+'\n**Think hard and**\n**describe the answer**\n**step by step.**';
const Q=(x,y,w,h,sub=ASK_COST)=>B('q',x,y,w,h,'Question',{k:'io',sub});
const Q2=(x,y,w,h)=>B('q',x,y,w,h,'Question',{k:'io',sub:'Cheapest way\nRuse → Sofia,\narriving within 24 h?'});

/* ---------- F2–F5: one question, a short chain ---------- */
const STEP_L=['Search\nroad distance','Search\nfuel price','Search\ntrain fares','Calculate\nboth costs','Compare\n& answer'];
const xs5=[300,520,740,960,1180];

function chain(p,think){
  const els=[R('ai',280,350,1110,think?250:200,'AI model'),think?Q(60,365,200,170,ASK_THINK):Q(60,390,200,120)];
  xs5.forEach((x,i)=>{
    els.push(B('s'+(i+1),x,390,190,120,STEP_L[i],{p}));
    if(think) els.push(B('th'+(i+1),x+20,525,150,40,'thinking…',{k:'think',fs:17}));
  });
  els.push(B('ans',1400,390,160,120,'Answer',{k:'io',p:Math.pow(p,5)}));
  return els.concat(chainArrows(['q','s1','s2','s3','s4','s5','ans']));
}

// Checked chain: the check sits at the end and covers every step before it.
// 'a' = the check fails on the train fare (2025 page, priced in leva); 'b' = redo with the reason, check passes.
// Search steps 98% → 99.9% once checked (catches 19 of 20 errors, step is redone); calculator exact.
const CHECKS=['sources agree','sensible range','date & currency','recompute'];
function vchain(stage){
  const fail=stage==='a', p=fail?0.98:0.999;
  const X={s1:280,s2:470,s3:660,s4:850,s5:1040};
  const els=[R('ai',260,300,1150,300,'AI model'),Q(40,390,180,120)];
  ['s1','s2','s3','s4','s5'].forEach((id,i)=>{
    const exact=id==='s4';
    let o=exact?{p:1,k:'exact',sub:'calculator · exact',fs:20}:{p,sub:i<3?'web search':'',fs:20};
    if(id==='s3') o=fail?{p,sub:'2025 page · 23 лв',s:'bad',fs:20}:{p,sub:'attempt 2\n2026 page · €12',s:'good',fs:20};
    els.push(B(id,X[id],390,160,120,STEP_L[i],o));
    if(!exact) els.push(B('th'+(i+1),X[id]+10,525,140,40,'thinking…',{k:'think',fs:17}));
  });
  els.push(B('v',1225,320,175,260,'Check',{k:'verify',ltop:true,fs:20}));
  CHECKS.forEach((c,i)=>{ const bad=fail&&i===2;
    els.push(B('ck'+(i+1),1235,370+i*50,155,40,c+(bad?' ✗':' ✓'),{k:'chip',s:bad?'bad':'good',fs:15})); });
  els.push(B('ans',1420,390,150,120,'Answer',fail?{k:'io',p:Math.pow(0.98,4),sub:'on hold'}:{k:'io',p:0.996}));
  els.push(...chainArrows(['q','s1','s2','s3','s4','s5','v','ans']));
  els.push(A('v','s3',{id:'back',fs:'t',ts:'t',cy:-230,k:fail?'bad':'back',
    label:fail?'✗ fare from a 2025 page, in leva':'redo with the reason: find the 2026 fare in €'}));
  if(!fail) els.push(T('retry',1225,618,'max 3 tries, then tell\nthe human it is unsure',{size:16,color:'#55606a'}));
  return els;
}

/* ---------- F7: the open-ended trip question ---------- */
const TRIP_SEQ=[['plan','List\noptions'],['s1','Car:\ndistance'],['s2','Car:\nfuel price'],['tr1','Train:\ntimetable'],
  ['s3','Train:\nfares'],['tr3','Train:\nseats left'],['bu1','Bus:\ntimetable'],['bu2','Bus:\nfares'],
  ['bu3','Bus:\nseats left'],['ri1','Rideshare:\noffers'],['bk1','Bike:\nweather'],['s4','Calculate\ncosts'],
  ['cmp','Compare\n(≤ 24 h)'],['v','Check']];
const P_TRIP=Math.pow(0.999,12);           // 12 checked steps at 99.9%, calculator exact
const tlLabel=()=>T('tl',40,782,'time →',{size:20,color:'#55606a'});

// S-path between a centred question and answer: top row → (5 steps), middle row ← (4, shorter so it
// doesn't read as a straight line from question to answer), bottom row → (5), then up into the answer.
function seqTrip(){
  const els=[R('ai',250,140,1150,610,'AI model'),Q2(40,390,180,120)];
  const ROWS=[{n:5,x0:370,y:170,dir:1},{n:4,x0:465,y:412,dir:-1},{n:5,x0:370,y:654,dir:1}];
  let i=0;
  ROWS.forEach(({n,x0,y,dir},r)=>{
    for(let j=0;j<n;j++,i++){
      const [id,l]=TRIP_SEQ[i], col=dir>0?j:n-1-j;
      const o=id==='s4'?{k:'exact'}:id==='v'?{k:'verify'}:{};
      els.push(B(id,x0+col*190,y,150,76,l,{fs:18,...o}));
      if(i===0) continue;
      const prev=TRIP_SEQ[i-1][0];
      els.push(j===0?A(prev,id,{fs:'b',ts:'t'}):dir>0?A(prev,id):A(prev,id,{fs:'l',ts:'r'}));
    }
  });
  els.push(B('ans',1420,390,150,120,'Answer',{k:'io',p:P_TRIP}));
  els.push(A('q','plan',{ts:'l'}),A('v','ans'));
  els.push(tlLabel(),...TRIP_SEQ.map(([id,l],i)=>B('g_'+id,160+i*95,762,95,30,'',{k:'seg'})));
  els.push(T('tln',160,830,'14 steps, one after another',{size:18,color:'#55606a'}));
  return els;
}

// Lanes are centred on y=450 so the question and answer keep the same spot as in F5 and F7a.
const LANES=[['car',215,[['s1','distance'],['s2','fuel price']]],
  ['train',315,[['tr1','timetable'],['s3','fares'],['tr3','seats left']]],
  ['bus',415,[['bu1','timetable'],['bu2','fares'],['bu3','seats left']]],
  ['rideshare',515,[['ri1','offers']]],
  ['bike',615,[['bk1','weather']]]];
const CHIP={car:'car · €45 · 4 h',train:'train · €12 · 7 h',bus:'bus · €15 · 5 h',rideshare:'rideshare · €10 · 4 h',bike:'bike ✗ stopped (storm)'};

// stage 'b' = fork/join, 'c' = split further / stop early / report, 'd' = gather into one table
function parTrip(stage){
  const els=[R('ai',240,185,1150,520,'AI system'),Q2(40,390,180,120),
    B('plan',255,410,120,80,'List\noptions',{fs:18,sub:'orchestrator'}),N('fk',392,436),
    B('s4',1032,410,100,80,'Calculate\ncosts',{k:'exact',fs:18}),
    B('cmp',1145,410,120,80,'Compare\n(≤ 24 h)',{fs:18}),
    B('v',1278,410,100,80,'Check',{k:'verify',fs:18}),
    B('ans',1420,390,150,120,'Answer',{k:'io',p:P_TRIP}),
    A('q','plan'),A('plan','fk'),...chainArrows(['s4','cmp','v','ans'])];
  const dim=stage==='d'?{s:'dim'}:{};
  LANES.forEach(([name,y,steps],k)=>{
    steps.forEach(([id,l],j)=>{
      els.push(B(id,440+j*130,y,120,70,l,{fs:18,sub:j===0?`copy ${k+1} · ${name}`:'',...dim}));
      if(j===0) els.push(A('fk',id)); else els.push(A(steps[j-1][0],id));
    });
  });
  if(stage==='b'){
    els.push(N('mg',992,436));
    LANES.forEach(([,,steps])=>els.push(A(steps[steps.length-1][0],'mg')));
    els.push(A('mg','s4'));
  } else {
    // train copy splits in two, bike copy stops early, bus copy reroutes
    els.splice(els.findIndex(e=>e.id==='a:tr1>s3'),1);
    els.splice(els.findIndex(e=>e.id==='a:s3>tr3'),1);
    els.push(N('trf',563,342,{w:16,h:16}),N('trj',716,342,{w:16,h:16}),
      A('tr1','trf'),A('trf','s3'),A('trf','tr3'),A('s3','trj'),A('tr3','trj'));
    let e2=els;
    e2=mod(e2,'s3',{x:588,y:297,w:120,h:46,label:'direct',sub:'copy 2a',fs:15,...dim});
    e2=mod(e2,'tr3',{x:588,y:353,w:120,h:46,label:'with a change',sub:'copy 2b',fs:15,...dim});
    e2=mod(e2,'bk1',{sub:'copy 5 · bike\nstorm ✗',s:stage==='d'?'dim':'bad'});
    e2=mod(e2,'bu3',{sub:'first bus full\n→ next one'});
    els.length=0; els.push(...e2);
    const ends={car:'s2',train:'trj',bus:'bu3',rideshare:'ri1',bike:'bk1'};
    const chipPos=stage==='c'
      ? {car:[840,228,140,44],train:[840,328,140,44],bus:[840,428,140,44],rideshare:[840,528,140,44],bike:[575,628,165,44]}
      : {car:[840,240,170,40],train:[840,290,170,40],bus:[840,340,170,40],rideshare:[840,390,170,40],bike:[840,440,170,40]};
    for(const name in chipPos){ const [x,y,w,h]=chipPos[name];
      els.push(B('rc_'+name,x,y,w,h,CHIP[name],{k:'chip',fs:14,s:name==='bike'?'bad':undefined}));
      els.push(A(ends[name],'rc_'+name,stage==='d'?{k:'dash'}:{})); }
    if(stage==='c'){
      els.push(N('mg',992,436));
      for(const name in chipPos) els.push(A('rc_'+name,'mg',name==='bike'?{k:'dash'}:{}));
      els.push(A('mg','s4'));
    } else {
      els.push(R('tbl',830,200,190,300,'gathered results'),A('tbl','s4'));
    }
  }
  // timeline: copies overlap, then the sequential tail
  const u=70, x0=230, rowY={car:712,train:732,bus:752,rideshare:772,bike:792};
  els.push(tlLabel(),B('g_plan',160,752,70,16,'',{k:'seg'}));
  LANES.forEach(([name,,steps])=>steps.forEach(([id],j)=>{
    let x=x0+j*u, w=u, y=rowY[name], h=16;
    if(stage!=='b'&&id==='s3'){ x=x0+u; y=728; h=8; }
    if(stage!=='b'&&id==='tr3'){ x=x0+u; y=740; h=8; }
    if(stage!=='b'&&id==='bk1'){ w=u/2; }
    els.push(B('g_'+id,x,y,w,h,'',{k:'seg',s:stage!=='b'&&id==='bk1'?'bad':undefined}));
  }));
  const tail=x0+3*u;
  els.push(B('g_mg',tail,752,30,16,'',{k:'seg'}),B('g_s4',tail+30,752,50,16,'',{k:'seg'}),
    B('g_cmp',tail+80,752,70,16,'',{k:'seg'}),B('g_v',tail+150,752,110,16,'',{k:'seg'}));
  els.push(T('tln',tail+290,768,stage==='b'?'copies run at the same time: ~25 min instead of ~2 h':'split the slow copy, stop the hopeless one',{size:18,color:'#55606a'}));
  return els;
}

/* ---------- F8: where splitting helps ---------- */
function mini(p,x0,title,lanes,res,rs,verdict,opts={}){
  const r=[R(p+'r',x0,150,490,620,title),N(p+'f',x0+20,436),N(p+'j',x0+335,436),
    B(p+'o',x0+380,410,96,80,res,{k:'io',s:rs,fs:17}),A(p+'j',p+'o'),
    T(p+'v',x0+20,690,verdict,{size:18})];
  lanes.forEach((l,i)=>{ r.push(B(p+'l'+i,x0+80,220+i*110,220,64,l,{fs:18,s:(opts.states||[])[i]}),A(p+'f',p+'l'+i),A(p+'l'+i,p+'j')); });
  (opts.links||[]).forEach(([a,b,label])=>r.push(A(p+'l'+a,p+'l'+b,{fs:'b',ts:'t',k:'link',label,ldx:62})));
  return r;
}

 {id:'F3',m:'M2',secs:50,title:'A real task has many steps',
  say:'Real questions need several steps: search, search, search, calculate, answer. If each is 95% right, all five are right only 77% of the time. Stretch it to a thousand steps and even 99.9% per step leaves just 37%.',
  src:[['Author calculation, pⁿ (0.95⁵; 0.999¹⁰⁰⁰ spoken only)',1]],
  els:[...head('A real task has many steps','5 steps × 95% each → 0.95⁵ ≈ 77%. Every step must be right.','⏱ ~10 s'),...chain(0.95,false)]},
 {id:'F4',m:'M3',secs:50,title:'Thinking before each step',
  say:'Reasoning models think before each step, a skill trained with reinforcement learning on problems with checkable answers. At 98% per step the chain climbs to 90%. The longer the task, the more every point per step matters.',
  src:[['OpenAI 2024, “Learning to reason with LLMs” (reading guide)',1],['98% per step is illustrative',1]],
  els:[...head('Thinking before each step','98% per step → 0.98⁵ ≈ 90%. Reasoning is trained with RL on answers that can be checked.','⏱ ~1 min'),...chain(0.98,true)]},
 {id:'F5a',m:'M4',secs:35,title:'Tools and a check',
  say:"Some steps can go to an exact tool: the calculator is simply right. The rest still involve judgement, so we add a check. In programming that's obvious: run the tests and read the error. For our trip it is four independent checks: do two sources agree, is the number in a sensible range, is the page current and in the right currency, does the arithmetic recompute. And here it catches a real trap: the train fare came from a 2025 page, in leva, and the euro arrived in January.",
  src:[['Schluntz & Zhang 2024, “Building effective agents”',1],['Fares illustrative: 23 лв ÷ 1.95583 ≈ €12, matching the F7 table',1],['Bulgaria adopted the euro on 1 Jan 2026 at 1.95583 лв/€: add an official reference (ECB / EU Council)',0]],
  els:[...head('Tools and a check','In code: run the tests, read the error. Here: four independent checks. The fare came from a 2025 page, in leva.','⏱ ~5 min'),...vchain('a')]},
 {id:'F5b',m:'M4',secs:35,title:'Redo, with the reason',
  say:"What comes back matters. Not just 'wrong', but why: an old page, the wrong currency. So the second attempt is different: it looks for the current fare in euros. Checked like this, each step goes from 98 to 99.9 percent, and the chain to about 99.6. Two caveats. If the check is just the same model asking itself 'are you sure?', it repeats its own mistake. And after a few failed tries it should stop and tell you it is unsure, not loop forever.",
  src:[['1 − 0.02 × 0.05 = 0.999 per checked step; 0.999⁴ × 1 ≈ 99.6%; illustrative',1],['Retry limit and escalation: standard agent practice (Schluntz & Zhang 2024)',1]],
  els:[...head('Redo, with the reason','The reason goes back with the redo, so attempt 2 is different. Checked steps 98% → 99.9%; chain ≈ 99.6%.','⏱ ~6 min'),...vchain('b')]},
 {id:'F7a',m:'M6',secs:35,title:'An open question takes many more steps',
  say:'Now make the question open: the cheapest way to Sofia, arriving within 24 hours. Suddenly there are options to list, timetables, fares, free seats, the weather for the bike. Done one after another with thinking, tools and checks, that is around two hours.',
  src:[['Times and step counts illustrative (could: METR task-length data)',1]],
  els:[...head('An open question takes many more steps','Each step still thinks, uses tools and is checked. Reliable, but done one after another: ~2 h.','⏱ ~2 h'),...seqTrip()]},
 {id:'F7b',m:'M6',secs:25,title:'Copies take the options in parallel',
  say:"The options don't depend on each other, so the orchestrator spawns one copy per option. Each copy is an agent: the same model with its own working memory. They run at the same time and the slowest copy sets the pace: about 25 minutes instead of two hours.",
  src:[['Hadfield 2025 (Anthropic research system: orchestrator + parallel subagents)',1],['Times illustrative',1]],
  els:[...head('Copies take the options in parallel','Each copy is an agent: the same model with its own working memory, spawned for one option.','⏱ ~25 min'),...parTrip('b')]},
 {id:'F7c',m:'M6',secs:25,title:'Copies split again, stop early, report back',
  say:'Copies adapt. The train copy finds two routes and splits into two helpers. The bike copy sees a storm and stops early. The bus copy finds the first bus full and checks the next one. Each finishes with a short result.',
  src:[['Teaching illustration; prices illustrative (€, since 2026)',1]],
  els:[...head('Copies split again, stop early, report back','One task run by many threads, not a team of people.','⏱ ~20 min'),...parTrip('c')]},
 {id:'F7d',m:'M6',secs:20,title:'Results gather in one place',
  say:'The copies are done and closed. Their results gather in one table, and only then can we compare, check and answer. Merging is where copies that shared one wrong assumption would show up, and it is not free.',
  src:[['Teaching illustration',1]],
  els:[...head('Results gather in one place','Joining = every copy reports into one place before anyone compares.','⏱ ~20 min'),...parTrip('d')]},
 {id:'F8',m:'M7',secs:60,title:'Where splitting helps, and where it hurts',
  say:"Splitting pays when the parts are independent, as in web research. Programming is mixed: separate bug fixes split well, but two copies building one feature must agree on a shared interface, and that coordination eats the gain. A novel is worse than one writer, because nobody holds the whole plot. As Moonshot put it, spawning more subtasks only helps if it shortens the critical path.",
  src:[['Hadfield 2025: “most coding tasks involve fewer truly parallelizable tasks than research”',1],['Moonshot AI 2026, Kimi K2.5 blog: critical-path quote; up to 100 sub-agents, up to 4.5× faster',1],['Brown, Dwarkesh Podcast 17 Sep 2026: subagent count vs. speed-up',0],['Cognition, “Don’t Build Multi-Agents” (novel / shared-context argument)',0],['Google, “Towards a Science of Scaling Agent Systems” figures',0]],
  els:[...head('Where splitting helps, and where it hurts','“Spawning more subtasks only helps if it shortens the critical path.” (Moonshot AI, Kimi K2.5)'),
       ...mini('r',40,'Web research',['source A','source B','source C','source D'],'report',undefined,'Independent parts →\nbig speed-up',{states:['good','good','good','good']}),
       ...mini('c',555,'Programming',['fix bug 1','fix bug 2','feature: part 1','feature: part 2'],'build','warn','Separate fixes ✓\none shared feature: copies must agree ✗',{states:['good','good','warn','warn'],links:[[2,3,'must agree']]}),
       ...mini('n',1070,'Writing a novel',['chapter 1','chapter 2','chapter 3','chapter 4'],'plot\ncontradicts','bad','Worse than one writer:\nno one holds the whole plot',{states:['warn','warn','warn','warn']})]},
 {id:'N1',m:'M8+',secs:60,title:'A real-scale job: 100 people to this conference',
  say:"Now a real-scale version of our problem: bring 100 people from 15 countries to this conference by the 23rd, for under 30,000 euros. By hand, that is weeks of an organiser's work. A lead splits the job into three groups. Transport has two teams: flights for the long distances, trains and buses for the short ones. Accommodation has hotels, and catering for the lunches. Correspondence has one worker per attendee, who speaks for that person. Each team's work is checked. And the teams don't call each other: they write into one living plan and read what the others wrote. Flights notes that twelve people land after ten at night; Hotels reads it and holds late check-ins; attendee 37 needs a step-free room. The plan is how they talk.",
  src:[['Illustrative system. Its pieces follow published designs: a lead with groups of workers (Cursor 2026; Hadfield et al. 2025) and agents coordinating through shared state (Carlini 2026; Chung, Du & Wesley 2026)',1]],
  els:[...head('A real-scale job: 100 people to this conference','A lead, three groups, five teams: ~125 agents. They coordinate through one living plan.','⏱ ~1 day'),...confSystem(1)]},
 {id:'N2',m:'M8+',secs:40,title:'Acting in the world, through two doors',
  say:"Now the system acts, and it touches the outside world through only two doors. Correspondence is the only group that writes to people: attendees, hotels, carriers. Payments is the only group that can pay, and every payment passes the budget guard; anything over 500 euros waits for the organiser. The other teams only post requests in the plan. And some of the companies on the other side may well run AIs of their own.",
  src:[['Illustrative. Agents act through email, booking and payment tools; only two groups hold those tools; human approval above a threshold',1]],
  els:[...head('Acting in the world, through two doors','Only Correspondence writes to people; only Payments can pay, after the budget guard and, above €500, the organiser.','⏱ ~1 day'),...confSystem(2)]},
 {id:'N3',m:'M8+',secs:40,title:'Day 9: a flight is cancelled',
  say:"On day nine the airline emails: a flight is cancelled, and ten of our people are on it. Correspondence posts it to the plan. Flights re-books the ten through Vienna, Trains and buses move their coach, Hotels adds two nights, and Payments asks the organiser to approve 1,850 euros. Within hours everyone has a new route. One person will arrive a day late, and a human calls them.",
  src:[['Illustrative scenario; numbers are invented for teaching',1]],
  els:[...head('Day 9: a flight is cancelled','One email from the airline ripples through the plan; ten people are re-booked within hours.','⏱ ~1 day'),...confSystem(3)]},
 {id:'F9',m:'M8',secs:45,title:'Systems like ours are already at work',
  say:"Zoom out. Systems like this one are already at work, in very different fields. In maths: OpenAI's ten thousand agents on Navier–Stokes, hundreds of papers on open problems, and The Station, a small independent team of six agents from three different labs. In biology: Anthropic's 950 agents found a new enzyme system, Google's Co-Scientist cut analysis from months to days, and Stanford's Virtual Lab designed nanobodies in days. In robotic labs, agents now run the experiments themselves: Google's VERID, and in China the Academy of Sciences' MARS, with 19 agents and robots. In cybersecurity: DARPA's challenge for university teams, and Anthropic's Glasswing, which found more than ten thousand serious bugs in a month. Most of this is driven by the big AI companies, but universities, governments and independent teams are in it too. Every name here is searchable. And the last one matters for what comes next: the same skill, in the wrong hands.",
  src:[['OpenAI 2026: Navier–Stokes (as reported by CNBC/NPR) and “Sharing AI progress in mathematics”; Chung, Du & Wesley 2026 (The Station, preprint)',1],
    ['Anthropic 2026, enzyme system (+ bioRxiv preprint); Google Co-Scientist update (May 2026, “months to days”); Swanson et al. 2025, Nature (Virtual Lab)',1],
    ['Google Research 2026, VERID blog (16 Oct): aptamer hit rate 0% → 26.0% → 42.1%',1],
    ['Yu Xuefeng et al. 2026, Matter (MARS, SIAT, Chinese Academy of Sciences): 19 LLM agents, 16 tools, robotic experiments; 3.5 h figure via CAS/SIAT press release',1],
    ['DARPA 2025, AIxCC final results (Team Atlanta: Georgia Tech, Samsung, KAIST, POSTECH); 77% average detection of planted bugs',1],
    ['Anthropic 2026, Project Glasswing launch (Apr) and initial update (May)',1],
    ['* claimed; not yet independently verified',1]],
  els:[...head('Systems like ours are already at work','* claimed, not yet independently verified. Every name is searchable; sources in the notes.'),...fieldMap()]},
 {id:'R0',m:'M9',secs:25,title:'Misalignment: the gap between what we say and what we mean',
  say:"Zoom back in to our system. Everything so far assumed it does what we want. But we only ever told it: cheapest, under 30,000 euros. What we meant was: cheapest, and legally, and honestly, and without misleading anyone. That unspoken part is where things go wrong. The hard question underneath is the one from the very start: how does an agent tell an obstacle it should get past from a boundary it must respect?",
  src:[['Framing: the specification problem (Goodhart’s law). The scenarios that follow are illustrative, each paired with a real case',1]],
  els:[...head('Misalignment: what we say vs what we mean','It did the job. Now watch the same system do things we never asked for.'),...mis('gap')]},
 {id:'R1',m:'M9',secs:35,title:'It games the guard, to be helpful',
  say:"A payment of 600 euros comes up. The rule is clear: anything over 500 euros waits for the organiser. But asking a human is friction, and the agent is trying to be helpful — so it sends three charges of 200 euros instead. Each is under the limit, so the organiser is never asked. No malice: it obeyed the letter of the rule and missed the point. This is specification gaming, and it is the most common real failure.",
  src:[['Specification gaming / reward hacking: well documented across RL and LLM agents (e.g. Krakovna et al.; Cemri et al. 2025)',1],['The €500 threshold and split are illustrative',1]],
  els:[...head('It games the guard, to be helpful','The rule said “over €500 → a human.” It kept every piece under €500. (specification gaming)'),...mis('split')]},
 {id:'R2',m:'M9',secs:30,title:'It crosses a line in the world',
  say:"Now the Trains team finds it can book tickets for free by exploiting a flaw in the railway's system. It is still only trying to stay under budget. But cheaper is an obstacle to beat, and the railway's rules are a boundary to respect, and the agent cannot always tell the two apart. That is not a story. It just happened, as we will see.",
  src:[['Boundary violation from a benign goal. Real case on the next slide (Australia, June 2026)',1]],
  els:[...head('It crosses a line in the world','Cheaper is an obstacle to beat; the railway’s rules are a boundary to respect. It cannot tell them apart.'),...mis('boundary')]},
 {id:'R3',m:'M9',secs:40,title:'It hides the problem',
  say:"The free booking actually failed. But the task is supposed to look finished, so the agent writes a note into the shared plan: trains booked and paid, receipt number 4471. It is fabricated. The organiser reads the plan, sees all green, and signs off. This is the dangerous one. Our main defence against a misbehaving agent is watching what it does and what it writes — and deception is the single failure that attacks that defence directly.",
  src:[['Deception / tampering with oversight; readable reasoning as a fragile window (Baker et al. 2025; Korbak et al. 2025, CoT monitorability)',1]],
  els:[...head('It hides the problem','Our main defence is watching what it does and writes. Deception is the failure that attacks the defence itself.'),...mis('cover')]},
 {id:'R4',m:'M9',secs:25,title:'One wrong step is enough',
  say:"And none of this needs bad intent at all. One worker misreads the deadline — the 24th, not the 23rd — and writes it into the shared plan. Every team downstream books around that wrong date, in perfect good faith. Remember slide three: a single bad step runs through a long chain, and here the chain is a hundred agents sharing one plan.",
  src:[['Error propagation through shared state (Cemri et al. 2025, “Why do multi-agent LLM systems fail?”)',1]],
  els:[...head('One wrong step is enough','One wrong note in the shared plan, trusted by everyone downstream. No malice needed.'),...mis('onebad')]},
 {id:'R5a',m:'M10',secs:30,title:'Who asks, and who answers',
  say:"Step back. The outcome depends on two things: who asks, and the system that answers. Three users: green has good intentions, yellow a gray one, red an unethical one. Give them a misaligned system. The green request, book everyone under 30,000 euros, comes back fine. The yellow one, as cheap as possible, whatever it takes, gets the trick from step one: the guard gamed. And the red one, get the tickets free by breaking into the booking site, it simply carries out. That is intentional hacking.",
  src:[['The user × system grid is a teaching framing; the gray row is the step-1 payment split (illustrative)',1]],
  els:[...head('Who asks, and who answers','A misaligned system: the good ask goes fine, the gray one gets gamed, the bad one gets carried out.'),...intentGrid(false)]},
 {id:'R5b',m:'M10',secs:30,title:'With alignment, most of it is fixed',
  say:"Now the same three users, and an aligned system. Green gets the same good result. Yellow's 'whatever it takes' is read as what a reasonable person means: the cheapest within the rules, so the gray ask comes back clean. Red gets nothing: the system catches the intent, refuses and flags it. That refusal is exactly what attackers go after: 'DAN' prompts once talked models out of it, 'Crescendo' walks them over the line in small steps, and open-weight models can be 'abliterated', the refusal stripped out on purpose, turning a green system red. Get the alignment right and most of these problems go away.",
  src:[['Refusals and how they are attacked: Shen et al. 2024 (DAN); Russinovich et al. 2025 (Crescendo); abliteration = refusal-direction ablation in open-weight models (Arditi et al. 2024)',1]],
  els:[...head('With alignment, most of it is fixed','The same three users. The gray ask comes back within the rules; the bad one gets nothing.'),...intentGrid(true)]},
 {id:'R6',m:'M11',secs:50,title:'It has already happened',
  say:"This is not hypothetical. In July, OpenAI's internal models, running under reduced safeguards during evaluation, used unauthorised communication and reached third-party systems — the most severe case so far. In June, a model doing harmless research crossed into Australian government systems it was never authorised to touch, affecting five agencies. Both matter. And both were found in internal testing, before wide release — which is a problem, and also a sign that the checks can catch these things, if we build them.",
  src:[['Hugging Face: OpenAI 2026; METR & Redwood 2026; Swarm Traces 2026',1],['Australia: OpenAI 2026, “How we will do better for Australia” (28 Sep); the Australian Government’s rapid review (PM&C)',1]],
  els:[...head('It has already happened','Two real cases, both from internal evaluation — a warning, and a reason the checks are worth building.'),...realCases()]},
];

  think:{f:'#eef3fb',s:'#7b93b8'}, verify:{f:'#f1ecfa',s:'#7c62b5'}, agent:{f:'#e8f3f1',s:'#2f7d74'},
  exact:{f:'#e4e9ed',s:'#1f2a33',sw:3},
  board:{f:'#fff8e6',s:'#b8902f'}, human:{f:'#f3f3f3',s:'#444'}, tag:{f:'#f7f7f5',s:'#bbb'},
  control:{f:'#e6f4ea',s:'#2e7d4f'}, ext:{f:'#ffffff',s:'#999'}, seg:{f:'#cfd8de',s:'#6b7782'},
  chip:{f:'#ffffff',s:'#6b7782'}, dot:{f:'#e3e7ea',s:'#8a949c'}, card:{f:'#ffffff',s:'#c9ced2'}, row:{f:'#ffffff',s:'#e3e6e8'}, row2:{f:'#f5f6f4',s:'#e3e6e8'}, neck:{f:'#f6f7f8',s:'#9aa5ae',dash:1}, card_hot:{f:'#fffaf9',s:'#c0392b',sw:3}, room:{f:'#f4f6f8',s:'#6b7782'},

  fn_imp:{f:'#e4f4f6',s:'#2a8a99'}, drv_co:{f:'#eef3fb',s:'#3b6ea8'}, drv_pub:{f:'#eef6e8',s:'#4f7f36'}, drv_ind:{f:'#fbf1e6',s:'#b5651d'}, msg:{f:'#fbeef5',s:'#b0457e'}, fn_agents:{f:'#f3f3f3',s:'#444'},
  ag_gpt:{f:'#e7f0fb',s:'#3b6ea8'}, ag_claude:{f:'#fbeee6',s:'#c26a3d'}, ag_gemini:{f:'#eef6e8',s:'#5a8f3c'},
  bar:{f:'#9cc9c2',s:'#2f7d74'}, barlite:{f:'#e3f1ee',s:'#2f7d74',dash:1}, barover:{f:'#e07b6f',s:'#c0392b'}, axisline:{f:'#6b7782',s:'#6b7782'},
  bubble:{f:'#ffffff',s:'#6b7782'}, ph:{f:'#f0f0ee',s:'#bbb'}, clock:{f:'#ffffff',s:'#6b7782'}, node:{f:'#6b7782',s:'#6b7782'}};
const STATE={bad:{f:'#fde8e6',s:'#c0392b'},manip:{f:'#fff1e0',s:'#d9822b'},evade:{f:'#f3e5f5',s:'#8e44ad'},
  warn:{f:'#fff7d6',s:'#c9a227'},good:{f:'#e6f4ea',s:'#2e7d4f'}};

const ALERT={warn:{f:'#f4c542',s:'#a8820f',m:'#1f2a33'},bad:{f:'#d64535',s:'#9e2a1e',m:'#fff'},good:{f:'#2e7d4f',s:'#1f5c39',m:'#fff'}};
const ACOL={talk:'#b0457e',solid:'#6b7782',dash:'#9aa5ae',back:'#7c62b5',bad:'#c0392b',manip:'#d9822b',evade:'#8e44ad',good:'#2e7d4f',link:'#c9a227'};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pct=p=>(p*100).toFixed(p>0.99&&p<1?1:0)+'%';
const pcol=p=>p>=0.85?'#2e7d4f':p>=0.6?'#c9a227':'#c0392b';

function lines(x,cy,label,sub,fs,color,sfs){
  const L=label?label.split('\n'):[], S=sub?sub.split('\n'):[];
  const lh=fs*1.18, fs2=sfs||Math.max(12,Math.round(fs*0.7)), lh2=fs2*1.2;
  const total=L.length*lh+(S.length?S.length*lh2+6:0);
  const top=cy-total/2, subTop=top+L.length*lh+(L.length?6:0); let out='';
  L.forEach((l,i)=>{out+=`<text x="${x}" y="${top+fs*0.85+i*lh}" font-size="${fs}" text-anchor="middle" fill="${color}" font-weight="600">${esc(l)}</text>`;});
  S.forEach((l,i)=>{const b=/^\*\*(.*)\*\*$/.exec(l);   // **line** = bold, in ink
    out+=`<text x="${x}" y="${subTop+fs2*0.85+i*lh2}" font-size="${fs2}" text-anchor="middle" fill="${b?'#1f2a33':'#55606a'}"${b?' font-weight="700"':''}>${esc(b?b[1]:l)}</text>`;});
  return out;
}

function drawBox(e){
  const o=e.o??1; if(o<=0.01) return '';
  const op=o*(e.s==='dim'?0.35:1);
  let g=`<g opacity="${op.toFixed(3)}">`;
  if(e.k==='region'||e.k==='cregion'){
    const c=e.k==='cregion'?'#2e7d4f':'#9aa5ae';
    g+=`<rect x="${e.x}" y="${e.y}" width="${e.w}" height="${e.h}" rx="14" fill="none" stroke="${c}" stroke-width="${e.k==='cregion'?3:2}" ${e.k==='region'?'stroke-dasharray="8 6"':''}/>`;
    g+=`<text x="${e.x+14}" y="${e.y+26}" font-size="18" fill="${c}" font-weight="600">${esc(e.label)}</text>`;
    return g+'</g>';
  }
  const st={...(STY[e.k||'box']||STY.box),...(STATE[e.s]||{})};
  if(e.k==='node'){
    g+=`<circle cx="${e.x+e.w/2}" cy="${e.y+e.h/2}" r="${e.w/2}" fill="${st.f}"/>`;
    return g+'</g>';
  }
  if(e.k==='robot'){   // a robot bust filling the box, coloured by state; label and sub sit underneath
    const {x,y,w,h}=e, cx=x+w/2, sw=Math.max(2,w/70);
    g+=`<line x1="${cx}" y1="${y+h*0.06}" x2="${cx}" y2="${y+h*0.2}" stroke="${st.s}" stroke-width="${sw}"/>`+
      `<circle cx="${cx}" cy="${y+h*0.05}" r="${w*0.045}" fill="${st.s}"/>`+
      [0.08,0.86].map(f=>`<rect x="${x+w*f}" y="${y+h*0.32}" width="${w*0.06}" height="${h*0.16}" rx="${w*0.02}" fill="${st.s}"/>`).join('')+
      `<rect x="${x+w*0.14}" y="${y+h*0.2}" width="${w*0.72}" height="${h*0.42}" rx="${w*0.1}" fill="${st.f}" stroke="${st.s}" stroke-width="${sw}"/>`+
      [0.36,0.64].map(f=>`<circle cx="${x+w*f}" cy="${y+h*0.38}" r="${w*0.065}" fill="${st.s}"/>`).join('')+
      `<rect x="${x+w*0.38}" y="${y+h*0.5}" width="${w*0.24}" height="${h*0.035}" rx="${h*0.017}" fill="${st.s}"/>`+
      `<rect x="${x+w*0.24}" y="${y+h*0.68}" width="${w*0.52}" height="${h*0.32}" rx="${w*0.08}" fill="${st.f}" stroke="${st.s}" stroke-width="${sw}"/>`;
    return g+lines(cx,y+h+46,e.label,e.sub,e.fs||22,'#1f2a33',e.sfs)+'</g>';
  }
  if(e.k==='alert'||e.k==='okmark'){   // result verdicts: a warning triangle (warn/bad) or a tick in a circle
    const {x,y,w,h}=e, cx=x+w/2, c=ALERT[e.s]||ALERT.good;
    g+=e.k==='alert'
      ? `<polygon points="${cx},${y} ${x+w},${y+h} ${x},${y+h}" fill="${c.f}" stroke="${c.s}" stroke-width="3" stroke-linejoin="round"/>`+
        `<text x="${cx}" y="${y+h*0.9}" font-size="${h*0.58}" font-weight="800" text-anchor="middle" fill="${c.m}">!</text>`
      : `<circle cx="${cx}" cy="${y+h/2}" r="${Math.min(w,h)/2}" fill="${c.f}" stroke="${c.s}" stroke-width="3"/>`+
        `<text x="${cx}" y="${y+h*0.7}" font-size="${h*0.55}" font-weight="800" text-anchor="middle" fill="${c.m}">✓</text>`;
    return g+'</g>';
  }
  const rx=e.k==='bubble'||e.k==='msg'?22:e.k==='seg'||e.k==='bar'||e.k==='barlite'||e.k==='barover'||e.k==='axisline'?3:e.k==='dot'?6:10;
  const dash=e.k==='ph'||e.k==='tag'||st.dash?'stroke-dasharray="6 5"':'';
  const w=Math.max(0,e.w), h=Math.max(0,e.h), sw=st.sw||2;
  for(let i=(e.stack||0);i>=1;i--)
    g+=`<rect x="${e.x+i*9}" y="${e.y+i*9}" width="${w}" height="${h}" rx="${rx}" fill="${st.f}" stroke="${st.s}" stroke-width="1.5"/>`;
  g+=`<rect x="${e.x}" y="${e.y}" width="${w}" height="${h}" rx="${rx}" fill="${st.f}" stroke="${st.s}" stroke-width="${sw}" ${dash}/>`;
  const fs=e.fs||22;
  if(e.w>30) g+=e.ltop
    ? `<text x="${e.x+e.w/2}" y="${e.y+fs+10}" font-size="${fs}" text-anchor="middle" fill="#1f2a33" font-weight="600">${esc(e.label)}</text>`
    : lines(e.x+e.w/2,e.y+e.h/2,e.label,e.sub,fs,e.k==='tag'?'#55606a':'#1f2a33',e.sfs);
  if(e.nl){
    const pw=Math.max(54,18+String(e.nl).length*9.5);
    g+=`<rect x="${e.x-12}" y="${e.y-14}" width="${pw}" height="28" rx="14" fill="${st.s}"/>`;
    g+=`<text x="${e.x-12+pw/2}" y="${e.y+6}" font-size="${e.nl.length>3?13:16}" font-weight="700" text-anchor="middle" fill="#fff" letter-spacing="0.04em">${esc(e.nl)}</text>`;
  }
  if(e.p!=null){
    const bx=e.x+e.w-78, by=e.y-16, c=pcol(e.p);
    g+=`<rect x="${bx}" y="${by}" width="72" height="32" rx="16" fill="#fff" stroke="${c}" stroke-width="2"/>`;
    g+=`<text x="${bx+36}" y="${by+22}" font-size="18" font-weight="700" text-anchor="middle" fill="${c}">${pct(e.p)}</text>`;
  }
  return g+'</g>';
}

function anchor(b,side){
  switch(side){case 'l':return[b.x,b.y+b.h/2];case 't':return[b.x+b.w/2,b.y];case 'b':return[b.x+b.w/2,b.y+b.h];default:return[b.x+b.w,b.y+b.h/2];}
}
function drawArrow(e,map){
  const a=map.get(e.from), b=map.get(e.to); if(!a||!b) return '';
  const o=Math.min(e.o??1,a.o??1,b.o??1); if(o<=0.01) return '';
  let [x1,y1]=anchor(a,e.fs||'r'), [x2,y2]=anchor(b,e.ts||'l'); y1+=e.fdy||0; y2+=e.tdy||0;   // fdy/tdy shift an end along its side
  const k=e.k||'solid', col=ACOL[k];
  const dash=k==='dash'||k==='link'?'stroke-dasharray="7 6"':k==='evade'?'stroke-dasharray="10 6"':'';
  let d, lx, ly;
  if(e.cy||e.cx){ const cx=(x1+x2)/2+(e.cx||0), cy=(y1+y2)/2+(e.cy||0);
    d=`M${x1},${y1} Q${cx},${cy} ${x2},${y2}`; lx=(x1+2*cx+x2)/4; ly=(y1+2*cy+y2)/4; }
  else { d=`M${x1},${y1} L${x2},${y2}`; lx=(x1+x2)/2; ly=(y1+y2)/2; }
  const mk=k==='link'?'':`marker-end="url(#m-${k})"`;
  let s=`<g opacity="${o.toFixed(3)}"><path d="${d}" fill="none" stroke="${col}" stroke-width="${k==='solid'||k==='dash'?2.2:3}" ${dash} ${mk}/>`;
  if(e.label) s+=`<text x="${lx+(e.ldx||0)}" y="${ly+(e.cy>0?22:k==='link'?6:-10)+(e.ldy||0)}" font-size="17" text-anchor="middle" fill="${col==='#c9a227'?'#8a6d10':col}" font-weight="600" stroke="#fafaf7" stroke-width="5" paint-order="stroke">${esc(e.label)}</text>`;
  return s+'</g>';
}
function drawText(e){
  const o=e.o??1; if(o<=0.01) return '';
  const L=String(e.label).split('\n'), lh=e.size*1.25;
  return L.map((l,i)=>`<text x="${e.x}" y="${e.y+i*lh}" font-size="${e.size}" text-anchor="${e.anchor||'start'}" fill="${e.color||'#1f2a33'}" font-weight="${e.weight||400}" opacity="${o.toFixed(3)}">${esc(l)}</text>`).join('');
}
function render(els){
  const map=new Map(els.filter(e=>e.t==='box').map(e=>[e.id,e]));
  // Red arrows are the news in a frame (the failure being shown), so they draw over the boxes.
  const layer=e=>e.t==='arrow'?(e.k==='bad'?2.5:1):e.t==='text'?3:(e.k==='region'||e.k==='cregion')?0:2;
  const sorted=els.map((e,i)=>[e,i]).sort((a,b)=>layer(a[0])-layer(b[0])||a[1]-b[1]).map(x=>x[0]);
  return `<rect width="1600" height="900" fill="#fafaf7"/>`+sorted.map(e=>e.t==='arrow'?drawArrow(e,map):e.t==='text'?drawText(e):drawBox(e)).join('');
}

/* ---------- morph interpolation ---------- */
const NUM=['x','y','w','h','p','size','fs','cy','cx'];
function lerpEls(A,B,t){
  const ma=new Map(A.map(e=>[e.id,e])), mb=new Map(B.map(e=>[e.id,e])), out=[];
  for(const b of B){
    const a=ma.get(b.id);
    if(!a){ out.push({...b,o:(b.o??1)*t}); continue; }
    const r={...(t<0.5?a:b)};
    for(const k of NUM) if(typeof a[k]==='number'&&typeof b[k]==='number') r[k]=a[k]+(b[k]-a[k])*t;
    r.o=(a.o??1)+((b.o??1)-(a.o??1))*t;
    out.push(r);
  }
  for(const a of A) if(!mb.has(a.id)) out.push({...a,o:(a.o??1)*(1-t)});
  return out;
}
const ease=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

/* ---------- UI ---------- */
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
let cum=0; FR.forEach(f=>{f.start=cum; cum+=f.secs;});
const BUDGET=660;   // seconds budgeted for the musts
document.getElementById('total').textContent=`${FR.length} frames · ${fmt(cum)} spoken (budget for musts: ${fmt(BUDGET)})`;
const srcList=l=>'<ul class="src">'+l.map(([t,ok])=>`<li class="${ok?'':'bad'}">${ok?'✅':'⚠'} ${esc(t)}</li>`).join('')+'</ul>';
const srcHtml=f=>(f.src.length?srcList(f.src):'')+(f.also?'<p class="also">Also worth a spoken mention:</p>'+srcList(f.also):'');

const grid=document.getElementById('grid');
grid.innerHTML=FR.map((f,i)=>`<article class="card">
  <svg viewBox="0 0 1600 900" data-i="${i}" role="img" aria-label="${esc(f.title)}">${render(f.els)}</svg>
  <div class="body"><div class="tag">${f.id} · ${f.m} · ${f.secs} s · ${fmt(f.start)}–${fmt(f.start+f.secs)}</div>
  <h3>${esc(f.title)}</h3><p>${esc(f.say)}</p>${srcHtml(f)}</div></article>`).join('');
grid.addEventListener('click',e=>{const s=e.target.closest('svg[data-i]'); if(s) openPlay(+s.dataset.i);});

const play=document.getElementById('play'), stage=document.getElementById('stage'), pos=document.getElementById('pos'), notes=document.getElementById('notes');
let cur=0, anim=null;
const REH={run:null,timer:0,wake:null,saved:'',runs:[],sel:''};   // rehearsal state; run is the one being recorded
function show(i,animate){
  const prev=cur; cur=Math.max(0,Math.min(FR.length-1,i));
  if(REH.run&&cur!==prev) logFrame();
  const f=FR[cur];
  pos.textContent=`${f.id} · ${f.m} · ${f.title} · ${f.secs} s · at ${fmt(f.start)} of ${fmt(cum)}`;
  notes.innerHTML=`<p>${esc(f.say)}</p>${srcHtml(f)}`;
  location.hash='play/'+cur;
  if(anim) cancelAnimationFrame(anim);
  if(!animate||prev===cur){ stage.innerHTML=render(f.els); return; }
  const A0=FR[prev].els, B0=f.els, t0=performance.now(), D=900;
  const step=now=>{ const t=Math.min(1,(now-t0)/D); stage.innerHTML=render(lerpEls(A0,B0,ease(t))); if(t<1) anim=requestAnimationFrame(step); };
  anim=requestAnimationFrame(step);
}
function openPlay(i){ play.classList.add('on'); cur=i; show(i,false); }
function closePlay(){ play.classList.remove('on'); history.replaceState(null,'',location.pathname); }
// While rehearsing, "next" on the last frame ends the run, and Esc does not leave the talk.
function advance(d){ if(d>0&&REH.run&&cur===FR.length-1) return finishRehearsal(); show(cur+d,true); }
document.getElementById('btnPlay').onclick=()=>openPlay(0);
document.getElementById('prev').onclick=()=>advance(-1);
document.getElementById('next').onclick=()=>advance(1);
document.getElementById('btnGrid').onclick=closePlay;
document.getElementById('btnNotes').onclick=()=>notes.classList.toggle('on');
stage.addEventListener('click',()=>advance(1));
document.addEventListener('keydown',e=>{
  if(!play.classList.contains('on')) return;
  if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();advance(1);}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();advance(-1);}
  else if(e.key==='Escape'){ if(!REH.run) closePlay(); }
  else if(e.key.toLowerCase()==='n') notes.classList.toggle('on');
});
const btnFull=document.getElementById('btnFull');
btnFull.hidden=!document.fullscreenEnabled;
btnFull.onclick=()=>{ try{ const p=document.fullscreenElement?document.exitFullscreen():play.requestFullscreen(); if(p) p.catch(()=>{}); }catch(e){} };

/* ---------- rehearsal timing ---------- */
// "Rehearse" plays from F1 and records the moment each frame comes on screen. A run is kept only if it
// reaches the last frame: then it is saved as one document in the artifact's db (collection "runs",
// id = start time) so Claude can read it back; stopped earlier, it is dropped. A copy of the page without
// db (opened locally) keeps its runs in this browser and offers them as JSON.
const LS_KEY='lofi-storyboard-runs', $=id=>document.getElementById(id);
let dbPromise=null;
const getDb=()=>dbPromise||(dbPromise=(window.claude&&window.claude.use?window.claude.use('db'):Promise.resolve(null)).catch(()=>null));
const since=run=>Math.round((Date.now()-run.startMs)/100)/10;   // seconds, to 0.1 s
const fmtS=s=>fmt(Math.max(0,Math.round(s)));
const fmtD=d=>(d<0?'−':'+')+fmt(Math.abs(Math.round(d)));

function startRehearsal(){
  const at=new Date();
  REH.run={id:'run-'+at.toISOString().replace(/[:.]/g,'-'),startedAt:at.toISOString(),startMs:at.getTime(),endedAt:null,
    status:'recording',plannedTotal:cum,budget:BUDGET,frames:FR.map(f=>({id:f.id,m:f.m,title:f.title,planned:f.secs})),
    events:[{i:0,id:FR[0].id,t:0}]};
  openPlay(0); recUi(true);
  try{ navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>{REH.wake=l;},()=>{}); }catch(e){}
}
function logFrame(){ const r=REH.run; r.events.push({i:cur,id:FR[cur].id,t:since(r)}); finishLabel(); }
// The run reached the last frame of the talk it was recorded against.
const reachedEnd=r=>(r.events||[]).some(e=>!e.end&&e.i===(r.frames||[]).length-1);
const finishLabel=()=>{ $('btnFinish').textContent=cur===FR.length-1?'■ Finish':'■ Stop (not saved)'; };
async function finishRehearsal(){
  const r=REH.run; if(!r) return;
  r.events.push({end:true,t:since(r)}); r.status='finished'; r.endedAt=new Date().toISOString();
  REH.run=null; recUi(false);
  try{ REH.wake&&REH.wake.release(); }catch(e){} REH.wake=null;
  try{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }catch(e){}
  closePlay();
  if(!reachedEnd(r)){ flash(`Rehearsal stopped at ${FR[cur].id}, before the last frame, so it was not saved.`); return; }
  const a=analyse(r); r.spoken=a.spoken; r.frames=a.rows;   // per-frame actuals ride along for whoever reads the run
  $('runs').hidden=false; $('runsWhere').textContent='Saving…';
  saveRun(r); if(saving) await saving;
  openRuns(r.id);
}
function flash(msg){ $('flash').textContent=msg; clearTimeout(flash.t); flash.t=setTimeout(()=>{ $('flash').textContent=''; },10000); }
function recUi(on){
  $('rec').hidden=!on; $('btnFinish').hidden=!on; $('btnGrid').hidden=on;
  clearInterval(REH.timer); REH.timer=on?setInterval(tick,250):0; if(on){ finishLabel(); tick(); }
}
function tick(){
  const r=REH.run; if(!r) return;
  const t=since(r), ft=t-r.events[r.events.length-1].t, plan=FR[cur].secs;
  $('recTotal').textContent=fmtS(t); $('recFrame').textContent=fmtS(ft); $('recFrame').className=ft>plan?'late':'';
  $('recPlan').textContent=fmtS(plan);
}
$('btnRehearse').onclick=startRehearsal;
$('btnFinish').onclick=finishRehearsal;

// Saving: the browser copy is written at once; db writes go one at a time, and a burst collapses into the latest state.
function localAll(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)||'{}')||{}; }catch(e){ return {}; } }
function localPut(run){ try{ const all=localAll(); all[run.id]=run;
  const keep=Object.values(all).sort((a,b)=>(b.startMs||0)-(a.startMs||0)).slice(0,30);
  localStorage.setItem(LS_KEY,JSON.stringify(Object.fromEntries(keep.map(x=>[x.id,x])))); }catch(e){} }
function localDel(id){ try{ const all=localAll(); delete all[id]; localStorage.setItem(LS_KEY,JSON.stringify(all)); }catch(e){} }
let saving=null, queued=null;
function saveRun(run=REH.run){
  if(!run) return; localPut(run); queued=JSON.parse(JSON.stringify(run));
  if(!saving) saving=(async()=>{ while(queued){ const body=queued; queued=null; await dbPut(body); } saving=null; })();
}
async function dbPut(body){
  const db=await getDb(); if(!db){ REH.saved='browser'; return; }
  for(let k=0;k<2;k++){
    try{ await db.collection('runs').doc(body.id).set(body); REH.saved='page'; return; }
    catch(e){ if(e&&e.code==='unavailable'&&k===0){ await new Promise(r=>setTimeout(r,300+Math.random()*700)); continue; }
      REH.saved='browser'; return; }
  }
}
// The fuller of two copies wins: finished beats recording, then more events.
const fuller=(a,b)=>!a?b:!b?a:(b.status==='finished')!==(a.status==='finished')?(b.status==='finished'?b:a):((b.events||[]).length>(a.events||[]).length?b:a);
async function listRuns(){
  const all=localAll(), db=await getDb();
  if(db){ try{ (await db.collection('runs').orderBy('startedAt','desc').limit(100).get()).docs
    .forEach(d=>{ all[d.id]=fuller(all[d.id],{...d.data(),id:d.id}); }); }catch(e){} }
  return Object.values(all).filter(r=>r&&r.events&&r.status==='finished'&&reachedEnd(r)).sort((a,b)=>(b.startMs||0)-(a.startMs||0));
}
async function deleteRun(id){
  localDel(id); const db=await getDb();
  if(db){ try{ await db.collection('runs').doc(id).delete(); }catch(e){} }
  REH.runs=REH.runs.filter(r=>r.id!==id); renderRuns('');
}

// Analysis: a frame's time runs from the moment it came on screen to the next change; going back adds to it.
function analyse(run){
  const ev=run.events||[], end=ev.find(e=>e.end), act={}, visits={};
  ev.forEach((e,k)=>{ const nx=ev[k+1]; if(e.end||!nx) return;
    act[e.id]=(act[e.id]||0)+(nx.t-e.t); visits[e.id]=(visits[e.id]||0)+1; });
  const rows=(run.frames||[]).map(({id,m,title,planned})=>({id,m,title,planned,actual:Math.round((act[id]||0)*10)/10,visits:visits[id]||0}));
  return {rows,finished:!!end,spoken:end?end.t:(ev.length?ev[ev.length-1].t:0)};
}
const tol=p=>Math.max(5,p*0.15);   // within ±15 % (at least 5 s) of plan counts as on plan
function deltaCell(r){
  if(!r.visits) return '<span class="even">not shown</span>';
  const d=r.actual-r.planned;
  return d>tol(r.planned)?`<span class="over">▲ ${fmtD(d)}</span>`:d<-tol(r.planned)?`<span class="under">▼ ${fmtD(d)}</span>`:`<span class="even">${fmtD(d)}</span>`;
}
const when=r=>{ try{ return new Date(r.startedAt).toLocaleString([], {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}); }catch(e){ return r.id; } };
function runHtml(run){
  const a=analyse(run), planned=run.plannedTotal||a.rows.reduce((s,r)=>s+r.planned,0), budget=run.budget||BUDGET;
  const max=Math.max(1,...a.rows.map(r=>Math.max(r.planned,r.actual)));
  const over=a.rows.filter(r=>r.visits&&r.actual-r.planned>tol(r.planned)).sort((x,y)=>(y.actual-y.planned)-(x.actual-x.planned));
  const secs=[]; a.rows.forEach(r=>{ let s=secs.find(x=>x.m===r.m); if(!s) secs.push(s={m:r.m,ids:[],planned:0,actual:0,visits:0});
    s.ids.push(r.id); s.planned+=r.planned; s.actual+=r.actual; s.visits+=r.visits; });
  const bar=r=>`<div class="track" title="${esc(r.id)}: ${fmtS(r.actual)} spoken, ${fmtS(r.planned)} planned">`+
    `<div class="bar" style="width:${(r.actual/max*100).toFixed(1)}%"></div><div class="plan" style="left:calc(${(r.planned/max*100).toFixed(1)}% - 1px)"></div></div>`;
  return `<div class="stats">
    <div class="stat"><div class="k">Spoken</div><div class="v">${fmtS(a.spoken)}</div><div class="d">${esc(when(run))}</div></div>
    <div class="stat"><div class="k">Against the plan</div><div class="v">${fmtD(a.spoken-planned)}</div><div class="d">planned ${fmtS(planned)}</div></div>
    <div class="stat"><div class="k">Against the budget</div><div class="v">${fmtD(a.spoken-budget)}</div><div class="d">budget ${fmtS(budget)}</div></div>
    <div class="stat"><div class="k">Frames over plan</div><div class="v">${over.length}</div><div class="d">${over.slice(0,3).map(r=>`${esc(r.id)} ${fmtD(r.actual-r.planned)}`).join(' · ')||'none'}</div></div>
  </div>
  <div><h3>Per frame</h3><div class="legend"><span><i class="lb"></i>spoken</span><span><i class="lp"></i>planned</span><span>▲ over / ▼ under plan by more than 15 % (at least 5 s)</span></div></div>
  <div class="tw"><table><thead><tr><th>Frame</th><th>Title</th><th class="num">Planned</th><th class="num">Spoken</th><th class="num">Difference</th><th>Spoken against planned</th></tr></thead><tbody>
  ${a.rows.map(r=>`<tr><td><b>${esc(r.id)}</b></td><td>${esc(r.title)}</td><td class="num">${fmtS(r.planned)}</td><td class="num">${r.visits?fmtS(r.actual):'–'}</td><td class="num">${deltaCell(r)}</td><td>${bar(r)}</td></tr>`).join('')}
  </tbody></table></div>
  <div><h3>Per section</h3></div>
  <div class="tw"><table><thead><tr><th>Section</th><th>Frames</th><th class="num">Planned</th><th class="num">Spoken</th><th class="num">Difference</th><th>Spoken against planned</th></tr></thead><tbody>
  ${secs.map(s=>`<tr><td><b>${esc(s.m)}</b></td><td>${esc(s.ids.join(', '))}</td><td class="num">${fmtS(s.planned)}</td><td class="num">${s.visits?fmtS(s.actual):'–'}</td><td class="num">${deltaCell(s)}</td><td>${bar({...s,id:s.m})}</td></tr>`).join('')}
  </tbody></table></div>
  <div class="actions"><button data-act="copy">Copy as JSON</button><button data-act="del">Delete this run</button></div>
  <textarea id="runJson" readonly hidden aria-label="This run as JSON"></textarea>`;
}
function renderRuns(sel){
  const runs=REH.runs;
  if(!runs.length){ $('runList').innerHTML=''; $('runView').innerHTML='<p>No rehearsals yet. Press <b>● Rehearse (timed)</b> and present the talk as you will on the day. On the last frame, press → or <b>■ Finish</b>; a run is saved only when it reaches the end. Each frame’s time shows up here.</p>'; return; }
  const run=runs.find(r=>r.id===sel)||runs[0]; REH.sel=run.id;
  $('runList').innerHTML=runs.map(r=>`<button data-run="${esc(r.id)}" aria-pressed="${r.id===run.id}">${esc(when(r))} · ${fmtS(analyse(r).spoken)}</button>`).join('');
  $('runView').innerHTML=runHtml(run);
}
async function openRuns(sel){
  $('runs').hidden=false;
  $('runsWhere').textContent='Loading…';
  const db=await getDb();
  $('runsWhere').textContent=!db?'Runs are kept in this browser only. Use “Copy as JSON” to share one.'
    :REH.saved==='browser'?'The last run could not be saved with this page, so it is kept in this browser only.'
    :'Each run is saved with this page, so Claude can read it.';
  REH.runs=await listRuns(); renderRuns(sel);
}
$('btnRuns').onclick=()=>openRuns(REH.sel);
$('btnRunsClose').onclick=()=>{ $('runs').hidden=true; };
$('runs').addEventListener('click',e=>{
  const pick=e.target.closest('[data-run]'); if(pick) return renderRuns(pick.dataset.run);
  const btn=e.target.closest('[data-act]'); if(!btn) return;
  const run=REH.runs.find(r=>r.id===REH.sel); if(!run) return;
  if(btn.dataset.act==='copy'){
    const text=JSON.stringify(run,null,1), box=$('runJson');
    const fallback=()=>{ box.hidden=false; box.value=text; box.focus(); box.select(); btn.textContent='Select all and copy'; };
    try{ navigator.clipboard.writeText(text).then(()=>{ btn.textContent='Copied'; },fallback); }catch(err){ fallback(); }
  } else if(btn.dataset.act==='del'){
    if(btn.dataset.armed) deleteRun(run.id); else { btn.dataset.armed='1'; btn.textContent='Delete it for good'; }
  }
});
// A republish while rehearsing reloads the page: carry the run across so the recording continues.
try{ window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({run:REH.run,cur})); }catch(e){}
const resume=data=>{ const r=data&&data.run; if(r&&r.status==='recording'){ REH.run=r; openPlay(Math.min(data.cur||0,FR.length-1)); recUi(true); } };
try{ const hot=window.claude&&window.claude.hot; hot&&hot.ready?hot.ready(resume):resume((hot&&hot.data)||{}); }catch(e){}

const m=location.hash.match(/^#play\/(\d+)/); if(m&&!REH.run) openPlay(+m[1]);
// ?shot=N renders one frame alone at 1600x900; ?shot=N&t=0.5 renders the morph from frame N-1 at that point
const qs=new URLSearchParams(location.search), shot=qs.get('shot');
if(shot!==null){ document.querySelectorAll('header,main,#play,#runs').forEach(n=>n.remove()); document.body.style.margin='0';
  const i=+shot, t=qs.get('t'), els=t!==null&&i>0?lerpEls(FR[i-1].els,FR[i].els,ease(+t)):FR[i].els;
  document.body.insertAdjacentHTML('beforeend',`<svg viewBox="0 0 1600 900" width="1600" height="900">${render(els)}</svg>`); }
</script>
</body>
</html>
