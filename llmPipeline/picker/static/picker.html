<!doctype html><html><head><meta charset="utf-8">
<!-- Without this, mobile browsers lay out at a virtual ~980px and scale down,
     so max-width media queries never match and portrait is unusable. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glossary picker</title>
<style>
:root{color-scheme:light dark;
 --plane:#f9f9f7;--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;
 --grid:#e1e0d9;--ring:rgba(11,11,11,.10);--sel:#2a78d6;--good:#0ca30c;--warn:#fab219;--crit:#d03b3b;}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme=light])){
 --plane:#0d0d0d;--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--muted:#898781;
 --grid:#2c2c2a;--ring:rgba(255,255,255,.10);--sel:#3987e5;--good:#0ca30c;}}
*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);
 font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--ring);
 padding:10px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.tab{padding:5px 13px;border-radius:7px;border:1px solid var(--ring);cursor:pointer;
 background:transparent;color:var(--ink2);font-size:13.5px}
.tab.on{background:var(--sel);color:#fff;border-color:transparent}
select,input[type=text]{background:var(--plane);color:var(--ink);border:1px solid var(--ring);
 border-radius:7px;padding:5px 9px;font:inherit;font-size:13.5px}
.bar{flex:1;min-width:130px;height:7px;background:var(--grid);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--good);border-radius:4px;transition:width .3s}
.pct{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.wrap{max-width:900px;margin:22px auto;padding:0 18px 90px}
.card{background:var(--surface);border:1px solid var(--ring);border-radius:12px;padding:20px 22px}
.meta{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.chip{font-size:11.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--ring);color:var(--muted)}
.chip.ex{border-color:var(--warn);color:var(--warn)}
.chip.au{border-color:var(--good);color:var(--good)}
h1{font-size:29px;margin:0 0 4px;line-height:1.2}
.ctx{color:var(--ink2);font-size:13.5px;border-left:2px solid var(--grid);padding-left:11px;margin:6px 0}
.cands{margin:18px 0 10px;display:flex;flex-direction:column;gap:8px}
.c{display:flex;gap:11px;align-items:center;padding:11px 13px;border:1.5px solid var(--ring);
 border-radius:9px;cursor:pointer;background:transparent}
.c:hover{border-color:var(--sel)}
.c.on{border-color:var(--sel);background:color-mix(in srgb,var(--sel) 11%,transparent)}
.num{width:23px;height:23px;flex:none;border-radius:6px;background:var(--grid);color:var(--ink2);
 display:grid;place-items:center;font-size:12.5px;font-weight:600}
.c.on .num{background:var(--sel);color:#fff}
.bg{flex:1;font-size:17px}
.votes{font-size:11.5px;color:var(--muted);white-space:nowrap}
.opts{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin:14px 0 0;
 padding-top:13px;border-top:1px solid var(--grid);font-size:13.5px;color:var(--ink2)}
label{display:flex;gap:6px;align-items:center;cursor:pointer}
#other{width:100%;margin-top:4px;font-size:16px;padding:9px 11px}
.acts{position:fixed;bottom:0;left:0;right:0;background:var(--surface);
 border-top:1px solid var(--ring);padding:11px 18px;display:flex;gap:10px;
 justify-content:center;align-items:center;flex-wrap:wrap}
/* desktop: let the three secondary buttons sit directly in the flex row;
   mobile overrides this to a real flex row under the full-width Confirm */
.row2{display:contents}
button.go{background:var(--sel);color:#fff;border:0;border-radius:8px;padding:9px 20px;
 font:inherit;font-weight:600;cursor:pointer}
button.alt{background:transparent;color:var(--ink2);border:1px solid var(--ring);
 border-radius:8px;padding:9px 15px;font:inherit;cursor:pointer}
kbd{font:11.5px ui-monospace,Consolas,monospace;background:var(--grid);color:var(--ink2);
 border-radius:4px;padding:1px 5px}
.hint{color:var(--muted);font-size:12.5px;text-align:center;margin-top:12px}
.done{text-align:center;padding:60px 20px;color:var(--ink2)}
.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:var(--ink);
 color:var(--plane);padding:8px 16px;border-radius:8px;font-size:13.5px;opacity:0;
 transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:.94}

/* Phone (portrait first). No physical keyboard, so tap targets carry the whole
   interaction. The desktop action bar is position:fixed, which in portrait ate
   the bottom of the screen and forced landscape - here it becomes a normal
   in-flow block directly under the candidates, so the page scrolls as one thing.
   16px inputs stop iOS zooming the page on focus. */
@media (max-width:900px){
  body{font-size:17px}
  .wrap{margin:0;padding:0 0 30px;max-width:none}

  /* edge-to-edge: side padding wastes width that the Bulgarian text needs */
  .card{padding:18px 14px;border-radius:0;border-left:0;border-right:0}
  h1{font-size:30px;line-height:1.15;margin-bottom:8px}
  .ctx{font-size:15px;padding-left:12px;margin:8px 0}
  .chip{font-size:13px;padding:3px 11px}

  .top{padding:10px 12px;gap:8px;position:static}
  .top>b{display:none}
  .tab{flex:1;text-align:center;padding:12px 6px;font-size:16px}
  select,input[type=text]{font-size:16px;padding:10px 11px}
  #cat{flex:1 1 100%}
  #q{flex:1;min-width:0}
  .pct{font-size:14px}

  .cands{gap:11px;margin:20px 0 12px}
  .c{padding:18px 15px;gap:14px;border-width:2px;border-radius:11px}
  .num{width:36px;height:36px;font-size:17px;border-radius:8px}
  .bg{font-size:21px;line-height:1.3}
  .votes{font-size:12.5px}
  #other{font-size:17px;padding:15px 13px;border-radius:10px}
  .opts{font-size:16px;gap:20px;margin-top:18px;padding-top:16px}
  .opts input[type=checkbox]{width:20px;height:20px}
  .hint{display:none}

  /* actions in normal flow, stacked full-width under the picker */
  .acts{position:static;display:block;padding:16px 14px 0;border-top:0;background:transparent}
  .acts kbd{display:none}
  .acts button{display:block;width:100%;margin:0 0 11px;padding:19px 10px;
    font-size:19px;font-weight:600;border-radius:12px}
  #next{font-size:21px;padding:22px 10px}
  .acts .row2{display:flex;gap:11px}
  .acts .row2 button{margin-bottom:0}
  #pos{display:block;text-align:center;font-size:15px;padding:6px 0 2px}
  .toast{bottom:24px;font-size:15px;padding:11px 20px}
}
</style></head><body>

<div class="top">
  <b style="font-size:14px">Glossary</b>
  <button class="tab on" data-s="queue">Queue</button>
  <button class="tab" data-s="stage2">Stage 2</button>
  <button class="tab" data-s="auto">Auto</button>
  <select id="cat"><option value="">all categories</option></select>
  <input type="text" id="q" placeholder="search…" style="width:130px">
  <select id="view">
    <option value="">to decide</option>
    <option value="flagged">⚑ flagged</option>
    <option value="skipped">skipped</option>
    <option value="picked">picked</option>
    <option value="decided">all decided</option>
  </select>
  <div class="bar"><i id="bar" style="width:0"></i></div>
  <span class="pct" id="pct">–</span>
</div>

<div class="wrap" id="wrap"></div>

<div class="acts">
  <span class="pct" id="pos"></span>
  <button class="go"  id="next">Confirm <kbd>↵</kbd></button>
  <div class="row2">
    <button class="alt" id="back">← Back</button>
    <button class="alt" id="skip">Skip <kbd>S</kbd></button>
    <button class="alt" id="flag">Flag <kbd>F</kbd></button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let items=[],i=0,stage='queue',sel=-1,other='',keepLatin=false,firstUse=true;

const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('on'),1300);}

async function stats(){
  const s=await (await fetch('/api/stats')).json();
  const c=$('#cat');
  if(c.options.length<2) s.categories.forEach(x=>{
    const o=document.createElement('option');o.value=o.textContent=x;c.appendChild(o);});
  const st=s.stages[stage]||{total:0,done:0};
  const p=st.total? st.done/st.total*100 : 0;
  $('#bar').style.width=p+'%';
  $('#pct').textContent=`${st.done} / ${st.total} decided`;
}

async function load(){
  const p=new URLSearchParams({stage,cat:$('#cat').value,q:$('#q').value,
                               view:$('#view').value});
  items=await (await fetch('/api/items?'+p)).json();
  i=0;render();stats();
}

function render(){
  const w=$('#wrap');
  if(!items.length){w.innerHTML='<div class="done"><h1>Nothing left here</h1>'+
    '<p>Every term in this view has a decision. Try another tab, clear the filters, '+
    'or tick “incl. decided” to revisit.</p></div>';$('#pos').textContent='';return;}
  if(i>=items.length){w.innerHTML='<div class="done"><h1>Batch complete</h1>'+
    '<p>Reload to pull the next set.</p></div>';$('#pos').textContent='';return;}

  const i0=items[i];
  sel=-1;other='';keepLatin=false;firstUse=true;
  // pre-select: previous pick > existing glossary form > top-voted candidate
  if(i0.picked&&i0.picked.bg!=null){
    const k=i0.candidates.findIndex(c=>c.bg===i0.picked.bg);
    sel=k>=0?k:-1; if(k<0){other=i0.picked.bg;}
    keepLatin=!!i0.picked.keep_latin; firstUse=i0.picked.first_use!==0;
  } else if(i0.candidates.length){ sel=0; }

  const chips=[`<span class="chip">${esc(i0.category||'—')}</span>`,
    `<span class="chip">freq ${i0.freq}</span>`];
  if((i0.sources||[]).some(s=>s==='glossary'||s==='term_map'))
    chips.push('<span class="chip ex">in current glossary</span>');
  if(stage==='auto') chips.push(`<span class="chip au">auto: ${esc(i0.reason||'')}</span>`);

  w.innerHTML=`<div class="card">
    <div class="meta">${chips.join('')}</div>
    <h1>${esc(i0.term)}</h1>
    ${(i0.contexts||[]).slice(0,3).map(c=>`<div class="ctx">${esc(c)}</div>`).join('')}
    <div class="cands" id="cands">
      ${i0.candidates.map((c,k)=>`<div class="c${k===sel?' on':''}" data-k="${k}">
         <div class="num">${k+1}</div><div class="bg">${esc(c.bg)}</div>
         <div class="votes">${c.existing?'current glossary':
            c.auto?'auto-accepted':(c.votes?c.votes+'/5 votes':'')}</div></div>`).join('')}
    </div>
    <input type="text" id="other" placeholder="or type your own…" value="${esc(other)}">
    <div class="opts">
      <label><input type="checkbox" id="kl" ${keepLatin?'checked':''}> keep Latin script</label>
      <label><input type="checkbox" id="fu" ${firstUse?'checked':''}> gloss English on first use</label>
    </div></div>
    <div class="hint"><kbd>1</kbd>–<kbd>9</kbd> choose · <kbd>↵</kbd> confirm ·
      <kbd>S</kbd> skip · <kbd>F</kbd> flag · <kbd>←</kbd> back · <kbd>Tab</kbd> type your own</div>`;

  $('#pos').textContent=`${i+1} / ${items.length}`;
  document.querySelectorAll('.c').forEach(el=>el.onclick=()=>{
    sel=+el.dataset.k;$('#other').value='';paint();});
  $('#other').oninput=e=>{if(e.target.value.trim()){sel=-1;paint();}};
  $('#kl').onchange=e=>keepLatin=e.target.checked;
  $('#fu').onchange=e=>firstUse=e.target.checked;
}
function paint(){document.querySelectorAll('.c').forEach(el=>
  el.classList.toggle('on',+el.dataset.k===sel));}

async function save(status){
  if(i>=items.length)return;
  const it=items[i];
  const typed=($('#other')?.value||'').trim();
  let bg=null;
  if(status==='picked'){
    bg = typed || (sel>=0 && it.candidates[sel] ? it.candidates[sel].bg : null);
    if(!bg){toast('Pick a candidate or type one');return;}
  }
  await fetch('/api/pick',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({key:it.key,bg,status,stage,
      keep_latin:keepLatin,first_use:firstUse})});
  it.picked={bg,status};
  toast(status==='picked'?`Saved: ${bg}`:status==='skipped'?'Skipped':'Flagged');
  i++;render();stats();
}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');stage=b.dataset.s;load();});
$('#cat').onchange=load; $('#view').onchange=load;
let qt;$('#q').oninput=()=>{clearTimeout(qt);qt=setTimeout(load,300);};
$('#next').onclick=()=>save('picked');
$('#skip').onclick=()=>save('skipped');
$('#flag').onclick=()=>save('flagged');
$('#back').onclick=()=>{if(i>0){i--;render();}};

document.onkeydown=e=>{
  if(e.target.id==='q')return;
  if(e.target.id==='other'){ if(e.key==='Enter'){e.preventDefault();save('picked');} return; }
  if(e.key>='1'&&e.key<='9'){const k=+e.key-1;
    if(items[i]&&k<items[i].candidates.length){sel=k;$('#other').value='';paint();}}
  else if(e.key==='Enter'){e.preventDefault();save('picked');}
  else if(e.key==='s'||e.key==='S'){save('skipped');}
  else if(e.key==='f'||e.key==='F'){save('flagged');}
  else if(e.key==='ArrowLeft'){if(i>0){i--;render();}}
  else if(e.key==='Tab'){e.preventDefault();$('#other')?.focus();}
};
load();setInterval(stats,10000);
</script></body></html>
